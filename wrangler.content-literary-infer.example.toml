# Physically isolated literary inference. STAGING TEMPLATE — no production binding or routes.
name = "cove-literary-infer-staging"
main = "content-dist/worker.js"
compatibility_date = "2026-10-09"
workers_dev = false
preview_urls = false
[limits]
cpu_ms = 300_000
[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_STAGING_PRIMARY"
database_id = "REPLACE_WITH_STAGING_PRIMARY_UUID"
[[d1_databases]]
binding = "CONTENT_DB"
database_name = "REPLACE_WITH_INDEPENDENT_LITERARY_CONTENT"
database_id = "REPLACE_WITH_INDEPENDENT_LITERARY_UUID"
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "REPLACE_WITH_PRIVATE_STAGING_R2"
[ai]
binding = "AI"
[vars]
FORE_CONTENT_PROCESSOR_ENABLED = "0"
FORE_CONTENT_PREPARE_ENABLED = "0"
FORE_CONTENT_INFERENCE_ENABLED = "0"
FORE_CONTENT_PROCESSOR_ROLE = "literary-infer"
FORE_CONTENT_BUDGET_MODE = "isolated"
FORE_CONTENT_D1_ADMISSION_MAX_MS = "150"
[triggers]
crons = []
