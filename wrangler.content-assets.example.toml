# Isolated asset worker. STAGING TEMPLATE ONLY; supply dedicated staging resources.
name = "cove-content-assets-staging"
main = "content-dist/worker.js"
compatibility_date = "2026-10-09"
workers_dev = true
[limits]
cpu_ms = 300_000
[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_STAGING_DATABASE"
database_id = "REPLACE_WITH_STAGING_D1_UUID"
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "REPLACE_WITH_PRIVATE_STAGING_R2"
[vars]
FORE_CONTENT_PROCESSOR_ENABLED = "0"
FORE_CONTENT_PROCESSOR_ROLE = "assets"
# External scheduling needs this switch AND primary D1 content_assets_owner='external'.
FORE_CONTENT_PIPELINE_EXTERNAL = "0"
FORE_CONTENT_D1_ADMISSION_MAX_MS = "300"
FORE_ASSETS_PER_MINUTE = "1"
FORE_CONTENT_MAX_D1_STATEMENTS = "32"
FORE_CONTENT_MAX_D1_WRITES = "16"
FORE_CONTENT_MAX_D1_SERVICE_MS = "2000"
FORE_CONTENT_MAX_R2_BYTES = "33554432"
[triggers]
crons = ["* * * * *"]
