[project]
name = "cove-audio-pipeline"
version = "0.1.0"
description = "Cove audiobook ingestion and BioSync workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.141.1",
  "vercel-queue==0.9.0",
  "faster-whisper==1.2.1",
  "rapidfuzz==3.14.3",
  "socksio==1.0.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "audio_pipeline.service:app"

[[tool.vercel.subscribers]]
entrypoint = "audio_pipeline.subscriber"
