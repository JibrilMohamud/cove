# Nonpublic production-equivalent application code using synthetic isolated
# D1 only. No production database, bucket, custom route, or Workers URL.
name = "cove-thin-core-staging"
main = ".output/server/index.mjs"
minify = false
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./.output/public"
binding = "ASSETS"
run_worker_first = true

[[ratelimits]]
name = "COVE_STOREFRONT_READ_LIMITER"
namespace_id = "732041"
[ratelimits.simple]
limit = 180
period = 60

[[d1_databases]]
binding = "DB"
database_name = "cove-perf-isolated-candidate-20261019"
database_id = "e4cbb0ef-6288-4fa1-9dbb-fb42fe01d4f3"
migrations_dir = "drizzle"

[vars]
COVE_SSR_STAGING = "1"
FORE_ENVIRONMENT = "production"
FORE_DEFAULT_TERRITORY = "US"
FORE_PUBLIC_URL = "https://cove-strangler-m1-staging.cove-jibrilmohamud.workers.dev"

# This CORE worker remains private and inaccessible without service bindings.
# A distinct, random COVE_SSR_STAGING_GATE_KEY is installed only as a secret.
# Media and billing bindings intentionally absent; user-journey certification
# therefore CANNOT be claimed from this first deployment.
