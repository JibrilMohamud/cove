# Copy to wrangler.backend.toml and replace the resource identifiers.
# Do not commit production secrets or private signing material.
name = "cove-persistence-backend"
main = "backend-dist/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "cove-production"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cove-production-media"

[vars]
FORE_PUBLIC_URL = "https://REPLACE_WITH_YOUR_VERCEL_DOMAIN"
FORE_ENVIRONMENT = "production"
FORE_DEFAULT_TERRITORY = "US"
FORE_CATALOG_PAGES_PER_TICK = "5"
FORE_CATALOG_EPUBS_PER_TICK = "2"

[triggers]
crons = ["*/5 * * * *", "*/7 * * * *", "9 * * * *", "39 * * * *", "*/10 * * * *", "23 * * * *", "17 3 * * *", "41 4 * * *"]

# Production authentication:
# - Vercel holds FORE_BACKEND_TOKEN; Cloudflare verifies its SHA-256 fingerprint
#   stored in D1 cove_runtime_config under backend_token_sha256.
# - Add the private P-256 FORE_INGESTION_SIGNING_KEY with wrangler secret put.
# - Vercel holds only the matching FORE_INGESTION_VERIFY_JWK public key.
#
# Add enabled provider secrets with wrangler secret put (or your Cloudflare dashboard):
#   FORE_INGESTION_SIGNING_KEY
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   FORE_STAFF_BOOTSTRAP_TOKEN
# plus any other server-only Cove integration credentials you enable.
