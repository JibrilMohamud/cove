# Cove production persistence backend.
# Non-secret resource identifiers are intentionally committed.
# Secrets remain in Cloudflare/Vercel secret stores and must never be added here.
name = "cove-persistence-backend"
main = "backend-dist/worker.js"
compatibility_date = "2026-10-09"
workers_dev = true

[limits]
cpu_ms = 300_000

[[d1_databases]]
binding = "DB"
database_name = "cove-production"
database_id = "4bd657ac-8789-403e-a28c-93aba8d0a989"
migrations_dir = "drizzle"

# Provisioned private R2 media bucket; public r2.dev access remains disabled.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cove-production-media"

[vars]
# Canonical verified Cove Vercel production origin.
FORE_PUBLIC_URL = "https://cove-puce-theta.vercel.app"
FORE_ENVIRONMENT = "production"
FORE_DEFAULT_TERRITORY = "US"
FORE_CATALOG_PAGES_PER_TICK = "5"
FORE_CATALOG_EPUBS_PER_TICK = "2"

[triggers]
crons = ["*/5 * * * *", "*/10 * * * *", "23 * * * *", "17 3 * * *", "41 4 * * *"]

# Cloudflare account:
#   account_id: d26430caa63ec55f6612e32f36aca5e9
#   workers.dev: cove-jibrilmohamud.workers.dev
#   backend origin: https://cove-persistence-backend.cove-jibrilmohamud.workers.dev
#
# Production authentication:
#   - Vercel stores FORE_BACKEND_TOKEN; this Worker verifies its SHA-256 fingerprint
#     from D1 cove_runtime_config (backend_token_sha256), so Cloudflare never needs
#     the gateway token in plaintext.
#   - Cloudflare stores FORE_INGESTION_SIGNING_KEY (P-256 private JWK).
#   - Vercel stores the matching FORE_INGESTION_VERIFY_JWK public key.
#   - Vercel stores the scoped FORE_SERVICE_TOKEN used by the audio pipeline; D1
#     stores only its service-principal credential digest and scopes.
# Provider secrets (Supabase, Stripe, etc.) remain in their platform secret stores.
