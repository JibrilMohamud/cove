# ISOLATED staging authentication gateway: NEVER bind any static assets here.
# Secrets are rotated in the isolated CI job and are not stored in this file.
name = "cove-asset-auth-gateway"
main = "src/cloudflare/staging-auth-gateway.mjs"
compatibility_date = "2026-10-17"
workers_dev = true
preview_urls = false

[[services]]
binding = "STAGING"
service = "cove-asset-auth-stage"

[vars]
COVE_STAGING_INGRESS_HOST = "cove-asset-auth-gateway.cove-jibrilmohamud.workers.dev"
COVE_STAGING_CANARY_HOST = "ssr-canary.covereads.com"
