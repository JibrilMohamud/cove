# Never route customers or reuse prod DB/R2. This staging deployment has no cron.
# Gate must be installed before use. Do not associate a custom domain.
name = "cove-commercial-parity-ssr-staging-20261020"
main = "scripts/staging/observed-ssr-entry.mjs"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]
minify = false
upload_source_maps = true
workers_dev = true
# Controlled staging experiment: the isolated D1 primary reports ENAM/IAD.
# Use an explicit nearby region rather than waiting for Smart Placement training.
[placement]
region = "aws:us-east-1"
[assets]
directory = "./.output/public"
binding = "ASSETS"
run_worker_first = true
# Dedicated, staging-only rate namespace/cap for bounded 100-RPS synthetic tests.
# The production 180/min abuse limit and namespace remain unchanged.
[[ratelimits]]
name = "COVE_STOREFRONT_READ_LIMITER"
namespace_id = "731991"
[ratelimits.simple]
limit = 6_000
period = 60
[[d1_databases]]
binding = "DB"
database_name = "cove-commercial-parity-stage-20261020"
database_id = "ce0e67b7-692d-44c6-94dc-7f324e7c5421"
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cove-commercial-parity-media-20261020"
[vars]
FORE_PUBLIC_URL = "https://cove-commercial-parity-ssr-staging-20261020.cove-jibrilmohamud.workers.dev"
FORE_ENVIRONMENT = "staging"
FORE_DEFAULT_TERRITORY = "US"
COVE_SSR_STAGING = "1"
FORE_CONTENT_PROCESSOR_ENABLED = "0"
FORE_CONTENT_PREPARE_ENABLED = "0"
FORE_CONTENT_HANDOFF_ENABLED = "0"
FORE_LITERARY_PREPARED_IMPORT_ENABLED = "0"
FORE_CONTENT_BUDGET_MODE = "primary"
# Experiment only: share pending presentation D1 calls, never cache rights.
FORE_ANON_CONTEXT_SINGLEFLIGHT = "0"
FORE_ANON_CONTEXT_ONE_READ = "1"
FORE_ANON_BOOTSTRAP_BATCH = "1"
# Stage only; normal/production public API remains on its existing adapter.
FORE_LEAN_ANON_PUBLIC_API = "1"
FORE_LEAN_ANON_CATALOG = "1"
