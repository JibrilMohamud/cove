# Intentionally UNROUTABLE private QA ingress candidate.
# To run a short-lived customer/Stripe TEST campaign, deploy an explicitly
# reviewed temporary variant with workers_dev=true and rotate matching
# 256-bit secrets to the gateway and private upstream; always restore.
name = "cove-commerce-qa-ingress"
main = "src/cloudflare/commerce-qa-ingress.mjs"
compatibility_date = "2026-10-27"
workers_dev = false
preview_urls = false

[[services]]
binding = "COMMERCE_QA"
service = "cove-commerce-customer-qa-stage"

[vars]
COVE_QA_GATEWAY_HOST = "cove-commerce-qa-ingress.cove-jibrilmohamud.workers.dev"
COVE_QA_SIGNED_WEBHOOK_GATE_ENABLED = "0"
