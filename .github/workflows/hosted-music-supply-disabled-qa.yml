name: hosted-music-supply-disabled-qa
on:
  pull_request:
    paths:
      - "scripts/staging/deploy-music-supply-qa-shadow.mjs"
      - ".github/workflows/hosted-music-supply-disabled-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-hosted-music-supply-disabled-qa
  cancel-in-progress: false
jobs:
  verify-nonpublic-shadow:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/isolated-licensed-music-supply-20261023') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/feat/isolated-licensed-music-supply-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node scripts/staging/deploy-music-supply-qa-shadow.mjs
