name: hosted-music-supply-disabled-qa
on:
  pull_request:
    paths:
      - "src/music-supply/**"
      - "infra/music/**"
      - "wrangler.music-supply.qa.jsonc"
      - "scripts/build-isolated-music-supply.mjs"
      - "scripts/staging/deploy-music-supply-qa-shadow.mjs"
      - ".github/workflows/hosted-music-supply-disabled-qa.yml"
  push:
    branches: [main]
    paths:
      - "src/music-supply/**"
      - "infra/music/**"
      - "wrangler.music-supply.qa.jsonc"
      - "scripts/build-isolated-music-supply.mjs"
      - "scripts/staging/deploy-music-supply-qa-shadow.mjs"
      - ".github/workflows/hosted-music-supply-disabled-qa.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA for protected Cloudflare operations"
        type: string
        required: true
      confirm_protected_cloudflare_action:
        description: "Explicitly approve protected stage/production Cloudflare operation"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cove-hosted-music-supply-disabled-qa
  cancel-in-progress: false

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node --check scripts/staging/deploy-music-supply-qa-shadow.mjs
      - run: node scripts/build-isolated-music-supply.mjs

  verify-nonpublic-shadow:
    needs: offline-preflight
    # No PR, fork, or branch code ever receives the Cloudflare account token.
    # Only reviewed and merged main can deploy the disabled QA shadow.
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN }}
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_STAGE_D1_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_D1_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node scripts/staging/deploy-music-supply-qa-shadow.mjs
