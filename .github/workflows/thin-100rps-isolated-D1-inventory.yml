name: thin-100rps-isolated-D1-inventory
on:
  push:
    branches: [perf/pr227-100rps-causal-20261020]
    paths:
      - "scripts/performance/read-thin-isolated-d1-mode.mjs"
      - ".github/workflows/thin-100rps-isolated-D1-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-stage-d1-replication-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Inspect synthetic D1 instance replication via account GET only
        run: node scripts/performance/read-thin-isolated-d1-mode.mjs
# No data queries, writes, deployments, primary changes or replica enablement.
