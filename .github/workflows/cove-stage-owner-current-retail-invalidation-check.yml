name: cove-stage-owner-current-retail-invalidation-check
on:
  push:
    branches: [perf/stage-owner-transactional-retail-projection-20261115]
    paths:
      - scripts/staging/owner-current-retail-invalidation.stage.py
      - scripts/staging/check-owner-current-retail-invalidation.py
      - .github/workflows/cove-stage-owner-current-retail-invalidation-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-transactional-deny-first-fixture:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile isolated authority projection fixture
        run: |
          python -m py_compile scripts/staging/owner-current-retail-invalidation.stage.py
          python -m py_compile scripts/staging/check-owner-current-retail-invalidation.py
      - name: Deny stale projected rights and offers on inserts updates deletes and rollback
        run: python scripts/staging/check-owner-current-retail-invalidation.py
      - name: Confirm no production authority or database workflow hooks
        run: |
          ! grep -Ei '(wrangler d1 execute|cloudflare_api_token|cove_rights_owner_enabled|legal_authority|stripe_livemode)' scripts/staging/owner-current-retail-invalidation.stage.py scripts/staging/check-owner-current-retail-invalidation.py
