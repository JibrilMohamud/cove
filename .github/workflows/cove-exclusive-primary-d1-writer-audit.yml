name: cove-exclusive-primary-d1-writer-audit
on:
  # Production-primary audits are never started by a push.
  pull_request:
    branches: [main]
    paths:
      - scripts/release/certify-exclusive-primary-d1.mjs
      - scripts/release/physical-d1-writer-read-transport.mjs
      - scripts/release/physical-d1-writer-read-transport.test.mjs
      - scripts/release/user-token-evidence.test.mjs
      - scripts/release/active-writer-bindings.mjs
      - scripts/release/active-writer-bindings.test.mjs
      - scripts/release/single-principal-coverage.mjs
      - scripts/release/single-principal-coverage.test.mjs
      - scripts/read-active-worker-versions.mjs
      - scripts/release/exclusive-primary-d1-workflow-lock.test.mjs
      - .github/workflows/cove-exclusive-primary-d1-writer-audit.yml
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact approved main HEAD; any source drift fails closed."
        required: true
        type: string
      confirm_readonly_physical_audit:
        description: "Explicitly authorize read-only production primary D1 principal inventory."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check scripts/release/certify-exclusive-primary-d1.mjs
      - run: node scripts/release/certify-exclusive-primary-d1.mjs --self-test
      - run: node --test scripts/release/physical-d1-writer-read-transport.test.mjs scripts/release/exclusive-primary-d1-workflow-lock.test.mjs scripts/release/user-token-evidence.test.mjs scripts/release/active-writer-bindings.test.mjs scripts/release/single-principal-coverage.test.mjs
  live-physical-audit:
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_readonly_physical_audit == true &&
      inputs.reviewed_main_sha == github.sha
    needs: [offline-source-contract]
    concurrency:
      group: cove-exclusive-real-primary-cold-acceptance
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Fail closed if protected audit source differs from approved main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.reviewed_main_sha }}"
          test "$(git branch --show-current)" = "main" || test "${{ github.ref }}" = "refs/heads/main"
      # Content Read is optional only when the metadata credential already has
      # immutable-version read access. No deploy credential is ever substituted.
      - name: Require three separately scoped audit credentials before inventory
        shell: bash
        env:
          CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
          CF_WORKERS_CONTENT_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_CONTENT_READ_TOKEN }}
          CF_ACCOUNT_TOKENS_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
          CF_USER_AUDIT_TOKEN: ${{ secrets.COVE_CF_USER_TOKENS_AUDIT_READ_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in CF_WORKERS_METADATA_READ_TOKEN CF_ACCOUNT_TOKENS_AUDIT_READ_TOKEN CF_USER_AUDIT_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing scoped protected read credential::$name must be configured in cove-production-release-audit"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - name: Certify physical Cloudflare writer exclusivity (READ-ONLY)
        run: node scripts/release/certify-exclusive-primary-d1.mjs
        env:
          CF_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
          CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
          CF_WORKERS_CONTENT_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_CONTENT_READ_TOKEN }}
          CF_ACCOUNT_TOKENS_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
          CF_USER_AUDIT_TOKEN: ${{ secrets.COVE_CF_USER_TOKENS_AUDIT_READ_TOKEN }}
