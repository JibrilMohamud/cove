name: literary-infer-draining-canary
# Historical draining inference is RETIRED. This workflow is a static policy
# guard, NEVER a reactivation/deployment path for canonical production D1.
on:
  pull_request:
    paths:
      - ".github/workflows/literary-infer-draining-canary.yml"
      - "wrangler.content-literary-infer.prod-draining.jsonc"
      - "scripts/check-literary-draining-infer-canary.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-infer-draining-canary.yml"
      - "wrangler.content-literary-infer.prod-draining.jsonc"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-inference-draining-canary
  cancel-in-progress: false
jobs:
  static:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Assert retired inference Worker never regains canonical D1, cron or executable flags
        run: |
          node --check scripts/staging/stop-literary-draining-infer.mjs
          node --check scripts/staging/activate-literary-draining-inference-budget.mjs
          node --check scripts/staging/verify-literary-draining-inference.mjs
          node scripts/check-literary-draining-infer-canary.mjs
