name: literary-infer-draining-canary
on:
  pull_request:
    paths:
      - ".github/workflows/literary-infer-draining-canary.yml"
      - "wrangler.content-literary-infer.prod-draining.jsonc"
      - "scripts/staging/activate-literary-draining-inference-budget.mjs"
      - "scripts/staging/verify-literary-draining-inference.mjs"
      - "scripts/staging/stop-literary-draining-infer.mjs"
      - "scripts/check-literary-draining-infer-canary.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-infer-draining-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-inference-draining-canary
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/activate-literary-draining-inference-budget.mjs
      - run: node --check scripts/staging/verify-literary-draining-inference.mjs
      - run: node --check scripts/staging/stop-literary-draining-infer.mjs
      - run: node scripts/check-literary-draining-infer-canary.mjs
  protected-real-ai:
    needs: static
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-isolated-inference.mjs
      - run: node scripts/check-literary-budget-domain.mjs
      - name: Activate isolated budget only after frozen legacy transfer and real EPUB evidence
        run: node scripts/staging/activate-literary-draining-inference-budget.mjs
      - run: npm run build:content-processing
      - name: Deploy no-ingress real AI inference Worker with publication disabled
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-infer.prod-draining.jsonc
      - name: Demand independent real AI completion and canonical nonpublication
        run: node scripts/staging/verify-literary-draining-inference.mjs
      - name: Stop scheduled inference after failed canary, retain budget fence
        if: failure() || cancelled()
        run: node scripts/staging/stop-literary-draining-infer.mjs
