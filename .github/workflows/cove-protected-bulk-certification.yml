name: cove-protected-bulk-certification
on:
  pull_request:
    paths:
      - ".github/workflows/cove-protected-bulk-certification.yml"
  # SHA-pinned protected batch on reviewed changes to release-critical
  # transport, owner mutation, legal witnesses, and token authority checks.
  # Protected environment and all eleven child fail-closed gates remain intact.
  push:
    branches: [main]
    paths:
      # Orchestration-only changes get PR contract checks and remain manually
      # dispatchable; they do not invalidate unchanged hosted runtime proofs.
      - "src/persistence-backend.worker.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/qa-owner-scheduled-execution.ts"
      - "scripts/staging/paid-owner-rollback-evidence.mjs"
      - "scripts/staging/prove-biosync-hosted-owner-write.mjs"
      - "scripts/staging/prove-private-paid-owner.mjs"
      # Protected ingest readiness and strict capacity harness changes must
      # retrigger the SAME SHA-pinned paid+capacity batch, not just source CI.
      - "scripts/staging/paid-qa-ingress-readiness.mjs"
      - "scripts/staging/strangler-http-transport.mjs"
      - "scripts/staging/check-strangler-live-capacity.mjs"
      - "src/storefront-strangler/paid-settlement-stage-qa.worker.ts"
      - "scripts/staging/verify-literary-postpublication-readonly.mjs"
      - "scripts/staging/check-strangler-data-plane-preflight.mjs"
      - "scripts/staging/check-protected-canonical-real-d1-differential.mjs"
      - "scripts/staging/rights-differential-coverage.mjs"
      # Token-only verifier changes run the separately protected user-token
      # workflow. They do not alter owner/commerce/rights/capacity sources.
      # Manual full batches still require all eleven child proofs below.
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main commit; any source drift refuses all dispatches."
        required: true
        type: string
      confirm_protected_batch:
        description: "Approve only isolated QA and READ-ONLY production audits; no live cutover."
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: cove-protected-bulk-certification
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Verify existing production hold, legal owner and hourly BioSync continuity
        run: |
          node scripts/release/check-production-cron-continuity.mjs --self-test
          node scripts/check-canonical-writer-closure.mjs --no-new-writers
          node scripts/check-locked-production-legal-owner.mjs
          node scripts/check-biosync-hosted-owner-config.mjs
          node scripts/release/check-protected-batch-concurrency.mjs
          git diff --check
  protected-bulk-dispatch:
    needs: [contract]
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirm_protected_batch == true &&
         inputs.reviewed_main_sha == github.sha))
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: JibrilMohamud/cove
      REVIEWED_SHA: ${{ inputs.reviewed_main_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require exact approved main and refuse untrusted events
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "JibrilMohamud/cove"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_EVENT_NAME" = "push" || "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test -n "$GH_TOKEN"
      - name: Dispatch and verify child workflows in concurrency-safe lanes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-batch
          verify() {
            local workflow="$1" lane="$2" before matches count id status conclusion info
            shift 2
            before="$(gh run list -w "$workflow" -R "$GH_REPO" -b main -e workflow_dispatch --json databaseId --limit 50 | jq -r '[.[].databaseId]|max//0')"
            gh workflow run "$workflow" -R "$GH_REPO" --ref main "$@"
            id=""
            for attempt in $(seq 1 45); do
              sleep 2
              info="$(gh run list -w "$workflow" -R "$GH_REPO" -b main -e workflow_dispatch --json databaseId,headSha --limit 50)"
              matches="$(printf '%s' "$info" | jq -c --argjson prior "$before" --arg sha "$REVIEWED_SHA" '[.[] | select(.databaseId>$prior and .headSha==$sha)]')"
              count="$(printf '%s' "$matches" | jq 'length')"
              if [[ "$count" == 1 ]]; then
                id="$(printf '%s' "$matches" | jq -r '.[0].databaseId')"
                break
              fi
              if [[ "$count" != 0 ]]; then
                printf '%s\t0\tambiguous\n' "$workflow" >> "artifacts/release-batch/$lane.tsv"
                return 0
              fi
            done
            if [[ -z "$id" ]]; then
              printf '%s\t0\tnot-observed\n' "$workflow" >> "artifacts/release-batch/$lane.tsv"
              return 0
            fi
            conclusion="timeout"
            for attempt in $(seq 1 100); do
              if info="$(gh run view "$id" -R "$GH_REPO" --json headSha,event,status,conclusion 2>/dev/null)"; then
                if ! printf '%s' "$info" | jq -e --arg sha "$REVIEWED_SHA" '.headSha==$sha and .event=="workflow_dispatch"' >/dev/null; then
                  conclusion="identity-drift"
                  break
                fi
                status="$(printf '%s' "$info" | jq -r '.status')"
                if [[ "$status" == completed ]]; then
                  conclusion="$(printf '%s' "$info" | jq -r '.conclusion//"missing"')"
                  break
                fi
              fi
              sleep 12
            done
            printf '%s\t%s\t%s\n' "$workflow" "$id" "$conclusion" >> "artifacts/release-batch/$lane.tsv"
            echo "$workflow: $conclusion"
          }
          # Independent lanes overlap. Tasks sharing a GitHub concurrency group
          # are sequential: all earlier child jobs finish before next dispatch.
          paid() { verify paid-legal-full-schema-private-qa.yml paid -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_isolated_qa=true -f confirm_owner_state_rollback=true; }
          biosync() { verify cove-biosync-owner-cutover-offline.yml biosync -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_isolated_biosync_qa=true -f confirm_hosted_owner_write=true; }
          rollback() { verify cove-stage-protected-worker-rollback.yml rollback -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_isolated_worker_rehearsal=true; }
          capacity_writer() {
            verify strangler-hosted-capacity-evaluation.yml capacity -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_protected_cloudflare_action=true
            verify cove-exclusive-primary-d1-writer-audit.yml capacity -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_readonly_physical_audit=true
          }
          legal() {
            verify cove-protected-full-primary-historical-rights.yml legal -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_historical_readonly=true
            verify cove-protected-primary-grant-event-replay.yml legal -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_select_only_replay=true
            verify cove-protected-external-source-withdrawal-audit.yml legal -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_external_source_readonly=true
            verify cove-protected-real-rights-spot-readonly.yml legal -f confirm=RIGHTS_SPOT_AUDIT
          }
          tokens() { verify cove-protected-user-token-readonly.yml tokens -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm_user_token_metadata_only=true; }
          differential() { verify cove-protected-stage-canonical-rights-differential.yml differential -f "reviewed_main_sha=$REVIEWED_SHA" -f confirm=STAGE_RIGHTS_DIFF; }
          pids=""
          paid & pids="$pids $!"
          biosync & pids="$pids $!"
          rollback & pids="$pids $!"
          capacity_writer & pids="$pids $!"
          legal & pids="$pids $!"
          tokens & pids="$pids $!"
          differential & pids="$pids $!"
          failed=0
          for pid in $pids; do wait "$pid" || failed=1; done
          cat artifacts/release-batch/*.tsv > artifacts/release-batch/results.tsv
          [[ "$(wc -l < artifacts/release-batch/results.tsv)" == 11 ]] || failed=1
          awk -F '\t' '$3!="success" { print "UNVERIFIED CHILD: " $1 " (" $3 ")"; failed=1 } END { exit failed ? 1 : 0 }' artifacts/release-batch/results.tsv || failed=1
          echo "Protected child results must all pass; source green is not release certification." >> "$GITHUB_STEP_SUMMARY"
          [[ "$failed" == 0 ]]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cove-release-batch-dispatch-${{ github.sha }}
          path: artifacts/release-batch/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve strict NO-GO until all child proof results are independently accepted
        if: always()
        shell: bash
        run: |
          echo "Dispatching a child is NOT proof of its success. This batch cannot enable the legal owner, Stripe LIVE sales, production D1 cutover, release domains, or credential retirement." >> "$GITHUB_STEP_SUMMARY"
