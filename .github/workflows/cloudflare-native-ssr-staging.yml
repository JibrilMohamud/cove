name: cloudflare-native-ssr-staging

on:
  pull_request:
    paths:
      - "src/server.ts"
      - "src/lib/cloudflare-ssr-stage-gate.server.ts"
      - "src/lib/cloudflare-native-bindings.server.ts"
      - "scripts/check-cloudflare-native-bindings.mjs"
      - "src/lib/cove-request-env.server.ts"
      - "src/lib/cloudflare-country.server.ts"
      - "src/features/fore/api.server.ts"
      - "src/features/fore/storefront-read-rate-limit.server.ts"
      - "scripts/check-storefront-firstpaint-rate-limit.mjs"
      - "src/features/fore/search.server.ts"
      - "src/features/fore/catalog-model.server.ts"
      - "src/features/fore/localization.server.ts"
      - "scripts/check-storefront-bootstrap.mjs"
      - "src/features/fore/storefront-loader.ts"
      - "src/features/fore/storefront-anonymous-bootstrap.server.ts"
      - "src/features/fore/storefront-hedged-fetch.ts"
      - "vite.config.ts"
      - "wrangler.frontend.staging.toml"
      - "wrangler.frontend.production.toml"
      - "scripts/check-cloudflare-production-candidate.mjs"
      - "scripts/check-cloudflare-ssr-stage-gate.mjs"
      - "scripts/check-cloudflare-ssr-staging.mjs"
      - "scripts/cloudflare-deployment-readiness.mjs"
      - "scripts/check-cloudflare-deployment-readiness.mjs"
      - "scripts/wait-cloudflare-native-deployment.mjs"
      - ".github/workflows/cloudflare-native-ssr-staging.yml"
  push:
    branches: [main]
    paths:
      - "src/server.ts"
      - "src/lib/cloudflare-ssr-stage-gate.server.ts"
      - "src/lib/cloudflare-native-bindings.server.ts"
      - "scripts/check-cloudflare-native-bindings.mjs"
      - "src/lib/cove-request-env.server.ts"
      - "src/lib/cloudflare-country.server.ts"
      - "src/features/fore/api.server.ts"
      - "src/features/fore/storefront-read-rate-limit.server.ts"
      - "scripts/check-storefront-firstpaint-rate-limit.mjs"
      - "src/features/fore/search.server.ts"
      - "src/features/fore/catalog-model.server.ts"
      - "src/features/fore/localization.server.ts"
      - "scripts/check-storefront-bootstrap.mjs"
      - "src/features/fore/storefront-loader.ts"
      - "src/features/fore/storefront-anonymous-bootstrap.server.ts"
      - "src/features/fore/storefront-hedged-fetch.ts"
      - "vite.config.ts"
      - "wrangler.frontend.staging.toml"
      - "wrangler.frontend.production.toml"
      - "scripts/check-cloudflare-production-candidate.mjs"
      - "scripts/check-cloudflare-ssr-stage-gate.mjs"
      - "scripts/check-cloudflare-ssr-staging.mjs"
      - "scripts/cloudflare-deployment-readiness.mjs"
      - "scripts/check-cloudflare-deployment-readiness.mjs"
      - "scripts/wait-cloudflare-native-deployment.mjs"
      - ".github/workflows/cloudflare-native-ssr-staging.yml"
  workflow_dispatch:
  # Preserve a rolling independent cold-start and live-rights signal even
  # when no code ships. Run off the hour to reduce shared-runner contention.
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: cove-ssr-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      COVE_CLOUDFLARE_SSR_PILOT: "1"
      VERCEL: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fail-closed stage gate and country binding tests
        run: |
          node scripts/check-cloudflare-ssr-stage-gate.mjs
          node scripts/check-cloudflare-deployment-readiness.mjs
          node scripts/check-cloudflare-production-candidate.mjs
          node scripts/check-cloudflare-native-bindings.mjs
          node scripts/check-storefront-firstpaint-rate-limit.mjs
          node scripts/check-storefront-bootstrap.mjs
          node scripts/check-cove-request-context.mjs
          node scripts/check-storefront-hedged.mjs
      - name: Build Cloudflare-native frontend
        run: npm run build
      - name: Verify static and SSR artifacts
        run: node scripts/check-cloudflare-ssr-pilot.mjs
      - name: Dry-run full staging Worker (no network publish)
        env:
          CLOUDFLARE_SEND_METRICS: "false"
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.frontend.staging.toml
      - name: Dry-run disabled-production Worker candidate (no publish)
        env:
          CLOUDFLARE_SEND_METRICS: "false"
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.frontend.production.toml

  deploy-staging:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COVE_CLOUDFLARE_SSR_PILOT: "1"
      VERCEL: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
      COVE_SSR_STAGING_ORIGIN: "https://cove-storefront-ssr-staging.cove-jibrilmohamud.workers.dev"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare credential unavailable"; exit 1; }
      - name: Build immutable reviewed production-source staging artifact
        run: npm run build
      - name: Deploy staging only (no custom domain or traffic migration)
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.frontend.staging.toml
      - name: Independently cold-deploy and strictly benchmark three times
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for trial in 1 2 3; do
            echo "::group::Independent cold SSR deployment $trial/3"
            # Even when the code has not changed, rotating the secret creates
            # a new Worker version. On later trials, also redeploy all assets.
            if [ "$trial" -gt 1 ]; then
              npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.frontend.staging.toml
            fi
            COVE_SSR_STAGING_GATE_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
            echo "::add-mask::$COVE_SSR_STAGING_GATE_KEY"
            export COVE_SSR_STAGING_GATE_KEY
            export COVE_STAGE_SECRET_ROTATION_EPOCH_MS="$(node -p 'Date.now()')"
            printf '%s' "$COVE_SSR_STAGING_GATE_KEY" | npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put COVE_SSR_STAGING_GATE_KEY --config wrangler.frontend.staging.toml
            # Verify the new secret deployment is targeting 100% and has
            # settled via Cloudflare's CONTROL PLANE (not Worker HTTP).
            # No edge fetch/SSR/asset request is made during this wait; the
            # next HTTP request is still the first genuinely cold SSR probe.
            node scripts/wait-cloudflare-native-deployment.mjs
            rm -f artifacts/cloudflare-ssr-staging-performance.json
            if ! node scripts/check-cloudflare-ssr-staging.mjs; then
              echo "::error::Cold deployment $trial failed the strict 20/20 gate"
              failures=$((failures + 1))
            fi
            if [ -f artifacts/cloudflare-ssr-staging-performance.json ]; then
              cp artifacts/cloudflare-ssr-staging-performance.json "artifacts/cloudflare-ssr-staging-performance-$trial.json"
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures of 3 independent cold deployments failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-native-ssr-staging-performance
          path: |
            artifacts/cloudflare-ssr-staging-performance.json
            artifacts/cloudflare-ssr-staging-performance-1.json
            artifacts/cloudflare-ssr-staging-performance-2.json
            artifacts/cloudflare-ssr-staging-performance-3.json
          if-no-files-found: ignore
          retention-days: 14
