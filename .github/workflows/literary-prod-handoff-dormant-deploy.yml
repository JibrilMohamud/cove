name: literary-prod-handoff-dormant-deploy
on:
  pull_request:
    paths:
      - "wrangler.content-literary-handoff.prod-disabled.jsonc"
      - "scripts/staging/deploy-literary-handoff-disabled.mjs"
      - "scripts/staging/verify-literary-dormant-roles.mjs"
      - "scripts/check-literary-dormant-owner-fences.mjs"
      - "src/lib/literary-preparation-queue.server.ts"
      - "src/lib/literary-private-publication.server.ts"
      - "src/content-processing.worker.ts"
      - "infra/content-budget/0010_literary_private_publication_retries.sql"
      - "scripts/check-literary-private-publication.mjs"
      - "scripts/check-literary-preparation-queue-owner.mjs"
      - "wrangler.content-literary-prepare.prod-disabled.jsonc"
      - "wrangler.content-literary-infer.prod-disabled.jsonc"
      - ".github/workflows/literary-prod-handoff-dormant-deploy.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-prod-handoff-dormant-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-dormant-production
  cancel-in-progress: false
jobs:
  static-dormant-constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check scripts/staging/deploy-literary-handoff-disabled.mjs
      - run: node --check scripts/staging/verify-literary-dormant-roles.mjs
      - run: node scripts/check-literary-handoff-dormant-config.mjs
      - run: node scripts/check-literary-dormant-owner-fences.mjs
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-preparation-queue-owner.mjs
  deploy-without-trigger:
    needs: static-dormant-constraints
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-private-publication.mjs
      - run: npm run build:content-processing
      - name: Install dormant production literary handoff without cron or public routes
        run: node scripts/staging/deploy-literary-handoff-disabled.mjs
      - name: Deploy dormant literary preparation (private D1/R2, zero triggers)
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-prepare.prod-disabled.jsonc
      - name: Deploy dormant literary inference (private D1/R2, zero triggers)
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-infer.prod-disabled.jsonc
      - name: Verify deployed preparation/inference flags, bindings and routes
        run: node scripts/staging/verify-literary-dormant-roles.mjs
