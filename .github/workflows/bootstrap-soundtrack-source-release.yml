name: Bootstrap verified soundtrack publication

on:
  # Only use production secrets after the authoritative backend has migrated
  # and deployed successfully. Also runs after future safe main releases.
  workflow_run:
    workflows: [deploy-persistence-backend]
    types: [completed]
  # GitHub Actions cron is best-effort; this complements the source curator.
  # All runs share one concurrency group and follow rights/QA/import limits.
  schedule:
    - cron: "37 * * * *"
  # Release protected import-client fixes without unnecessarily redeploying the Worker.
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-soundtrack-source-release.yml"
      - "scripts/soundtracks/drain-verified-imports.py"
      - "scripts/soundtracks/curate-source-license.py"

permissions:
  contents: read

concurrency:
  group: source-license-soundtrack-curation
  cancel-in-progress: false

jobs:
  release:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COVE_SOUNDTRACK_REVIEW_TOKEN: ${{ secrets.COVE_SOUNDTRACK_REVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name != 'workflow_run' && github.sha || github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test fail-closed rights-review boundaries
        run: |
          python scripts/soundtracks/test-curate-source-license.py -q
          python scripts/soundtracks/test-drain-verified-imports.py -q
      - name: Install and verify FFmpeg measurement tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Require scope-limited production review credential
        shell: bash
        run: |
          if [[ "${COVE_SOUNDTRACK_REVIEW_TOKEN:-}" != fore_svc_* ]]; then
            echo "::error::Cove soundtrack-review scope credential is unavailable"
            exit 1
          fi
      - name: Verify, triage, and release up to eight originals
        id: curate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/soundtracks/curate-source-license.py \
            --max-scan 800 --max-tracks 12 --max-triage 80 --max-mib 160 \
            --max-minutes 20 --apply --approve-source-license \
            --output soundtrack-curation-receipts.json
      - name: Immediately import already-approved originals and verify public playback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/soundtracks/drain-verified-imports.py \
            --max-imports 12 --max-minutes 12 --output soundtrack-import-receipts.json
      - name: Preserve non-secret verified import receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundtrack-bootstrap-import-receipts
          path: soundtrack-import-receipts.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve non-secret individual curation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundtrack-bootstrap-curation-receipts
          path: soundtrack-curation-receipts.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail release after independent imports when curation had unresolved errors
        if: always() && steps.curate.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Source curation reported failures. Independent approved originals were still imported; see separate receipts."
          exit 1
