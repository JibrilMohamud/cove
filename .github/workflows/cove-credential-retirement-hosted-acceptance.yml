name: cove-credential-retirement-hosted-acceptance
on:
  pull_request:
    paths:
      - .github/workflows/cove-credential-retirement-hosted-acceptance.yml
      - scripts/release/run-credential-retirement-hosted-acceptance.mjs
      - scripts/release/verify-commons-archived-source-fence.mjs
      - scripts/release/verify-commons-archived-source-fence.test.mjs
      - scripts/soundtracks/migrate-detached-commons-qa.py
      - scripts/soundtracks/test-migrate-detached-commons-qa.py
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact reviewed main SHA after final legacy-reference removal
        type: string
        required: true
      confirm_hosted_replacements:
        description: Run hosted replacement acceptance plus production read-only observation
        type: boolean
        required: true
        default: false
      confirm_detached_commons_migration:
        description: Run detached QA migration only after verified provider revocation
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: cove-credential-retirement-hosted-acceptance
  cancel-in-progress: false
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Require exactly one protected phase on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          HOSTED: ${{ inputs.confirm_hosted_replacements }}
          MIGRATION: ${{ inputs.confirm_detached_commons_migration }}
        run: test "$HOSTED" != "$MIGRATION"
      - run: node scripts/release/run-credential-retirement-hosted-acceptance.mjs --self-test
      - run: node --test scripts/release/verify-commons-archived-source-fence.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/soundtracks/test-migrate-detached-commons-qa.py -q
  hosted-replacements:
    needs: source-contract
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_hosted_replacements == true &&
      inputs.confirm_detached_commons_migration == false &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node scripts/release/run-credential-retirement-hosted-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-retirement-hosted-${{ github.sha }}
          path: artifacts/credential-retirement-hosted/results.json
          if-no-files-found: warn
          retention-days: 45
  detached-commons-migration:
    needs: source-contract
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_hosted_replacements == false &&
      inputs.confirm_detached_commons_migration == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    concurrency:
      group: cove-detached-commons-qa-account
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Require reviewed current main and migrate only detached unapproved QA evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CLOUDFLARE_ACCOUNT_ID: f51e8ccbc394e2d6016ff8c2c303d54b
          COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
          COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
          COVE_CF_USER_TOKENS_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_USER_TOKENS_AUDIT_READ_TOKEN }}
          COVE_CF_QA_D1_MUTATION_TOKEN: ${{ secrets.COVE_CF_QA_D1_MUTATION_TOKEN }}
          COVE_CF_QA_R2_STORAGE_TOKEN: ${{ secrets.COVE_CF_QA_R2_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$REVIEWED_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(gh api repos/JibrilMohamud/cove/git/ref/heads/main --jq .object.sha)" = "$REVIEWED_SHA"
          python scripts/soundtracks/migrate-detached-commons-qa.py
      - name: Require durable migration receipt before accepting retirement evidence
        run: test "$COVE_COMMONS_QA_MIGRATION_VERIFIED" = 1
