name: cove-homepage-public-diagnostic

on:
  push:
    branches: ["diagnostics/cove-homepage-20261017"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Inspect public response structure without retaining content
        env:
          COVE_PUBLIC_URL: https://cove-puce-theta.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.COVE_PUBLIC_URL;
          const requests = [
            { path: "/", language: "en-US,en;q=0.9" },
            { path: "/api/fore/storefront/context", language: "en-US,en;q=0.9" },
            { path: "/api/fore/storefront/page?path=%2F", language: "en-US,en;q=0.9" },
            { path: "/api/fore/catalog?search=&sort=popular&page=1&currency=USD", language: "en-US,en;q=0.9" },
            { path: "/api/fore/storefront/bootstrap", language: "en-US,en;q=0.9" },
            { path: "/", language: "en-US,en;q=0.9" },
            { path: "/", language: "fr-FR,fr;q=0.9" },
            { path: "/api/fore/storefront/context", language: "fr-FR,fr;q=0.9" },
            { path: "/api/fore/storefront/page?path=%2F", language: "fr-FR,fr;q=0.9" },
            { path: "/api/fore/catalog?search=&sort=popular&page=1&currency=USD", language: "fr-FR,fr;q=0.9" },
            { path: "/api/fore/storefront/bootstrap", language: "fr-FR,fr;q=0.9" },
            { path: "/", language: "fr-FR,fr;q=0.9" },
          ];
          for (const { path, language } of requests) {
            const start = performance.now();
            try {
              const response = await fetch(origin + path, {
                headers: { Accept: "text/html,application/json", "Accept-Language": language },
                redirect: "manual",
                signal: AbortSignal.timeout(25_000),
              });
              const ttfbMs = Math.round(performance.now() - start);
              const body = await response.text();
              const result = {
                path,
                language,
                status: response.status,
                ttfbMs,
                totalMs: Math.round(performance.now() - start),
                bytes: Buffer.byteLength(body),
                contentType: response.headers.get("content-type"),
                cacheControl: response.headers.get("cache-control"),
                vercelCache: response.headers.get("x-vercel-cache"),
                backendCache: response.headers.get("x-cove-backend-cache"),
                persistenceAuthority: response.headers.get("x-cove-persistence"),
                serverTiming: response.headers.get("server-timing"),
                exactBookCards: (body.match(/class=["']book-card["']/g) || []).length,
                containsBookCardToken: body.includes("book-card"),
                containsBookGridToken: body.includes("book-grid"),
                containsFindingBooks: body.includes("Finding books"),
              };
              if (path.includes("bootstrap") && response.ok) {
                try {
                  const data = JSON.parse(body);
                  result.catalogBooks = data.catalog?.results?.length ?? null;
                  result.taxonomyIncluded = "taxonomy" in data;
                  result.locale = data.context?.locale ?? null;
                  result.rightsCountry = data.context?.rightsCountry ?? null;
                } catch {
                  result.invalidJson = true;
                }
              }
              if (path.includes("/catalog?") && response.ok) {
                try {
                  const data = JSON.parse(body);
                  result.catalogBooks = data.results?.length ?? null;
                  result.catalogCount = data.count ?? null;
                } catch {
                  result.invalidJson = true;
                }
              }
              if (path.includes("/storefront/context") && response.ok) {
                try {
                  const data = JSON.parse(body);
                  result.rightsCountry = data.rightsCountry || null;
                  result.locale = data.locale || null;
                  result.currency = data.currency || null;
                } catch {
                  result.invalidJson = true;
                }
              }
              if (path.includes("/storefront/page") && response.ok) {
                try {
                  const data = JSON.parse(body);
                  result.pageType = data.pageType || null;
                  result.queryKeys = Object.keys(data.query || {}).sort();
                } catch {
                  result.invalidJson = true;
                }
              }
              console.log(JSON.stringify(result));
            } catch (error) {
              console.log(JSON.stringify({ path, elapsedMs: Math.round(performance.now() - start), error: String(error) }));
            }
          }
          NODE
