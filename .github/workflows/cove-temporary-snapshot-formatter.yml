name: cove-temporary-snapshot-formatter
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cove-temporary-snapshot-formatter.yml"
permissions:
  contents: read
jobs:
  format-reviewed-public-source:
    if: github.repository == 'JibrilMohamud/cove' && github.event.pull_request.head.repo.full_name == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply exact pinned Prettier to only two new snapshot-safety files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --ignore-path .prettierignore --write scripts/performance/real-catalog-snapshot-safety.mjs scripts/performance/real-catalog-snapshot-safety.test.mjs
          npx prettier --ignore-path .prettierignore --check scripts/performance/real-catalog-snapshot-safety.mjs scripts/performance/real-catalog-snapshot-safety.test.mjs
          printf '%s\n' COVE_FORMAT_BEGIN_GUARD
          base64 -w 0 scripts/performance/real-catalog-snapshot-safety.mjs | fold -w 240
          printf '%s\n' COVE_FORMAT_END_GUARD
          printf '%s\n' COVE_FORMAT_BEGIN_TEST
          base64 -w 0 scripts/performance/real-catalog-snapshot-safety.test.mjs | fold -w 240
          printf '%s\n' COVE_FORMAT_END_TEST
# Disposable source-only formatter; delete before final certification.
