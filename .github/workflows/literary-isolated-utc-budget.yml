name: literary-isolated-utc-budget
on:
  pull_request:
    paths:
      - ".github/workflows/literary-isolated-utc-budget.yml"
      - "scripts/staging/roll-literary-isolated-utc-budget.mjs"
      - "scripts/check-literary-utc-budget-rollover.mjs"
  schedule:
    # GitHub's scheduled Actions can be delayed for hours or skipped. Retry
    # the exact protected, idempotent budget-fence rollover during the day.
    # The operator script refuses activation without an active prior UTC day,
    # independent domain proof, valid budget carry and absence of leases.
    - cron: "25 0 * * *"
    - cron: "25 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Approve the exact main SHA before Cloudflare API access."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Explicitly approve this Cloudflare action; never auto-run on source merge."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cove-literary-isolated-utc-budget
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/roll-literary-isolated-utc-budget.mjs
      - run: node scripts/check-literary-utc-budget-rollover.mjs
  protected-rollover:
    needs: static
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Carry frozen primary day and activate only after prior isolated day passed
        run: node scripts/staging/roll-literary-isolated-utc-budget.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literary-utc-budget-${{ github.sha }}
          path: artifacts/literary-cutover/utc-budget-rollover.json
          if-no-files-found: ignore
          retention-days: 30
