name: literary-isolated-utc-budget
on:
  pull_request:
    paths:
      - ".github/workflows/literary-isolated-utc-budget.yml"
      - "scripts/staging/roll-literary-isolated-utc-budget.mjs"
      - "scripts/check-literary-utc-budget-rollover.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-isolated-utc-budget.yml"
  schedule:
    - cron: "25 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-isolated-utc-budget
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/roll-literary-isolated-utc-budget.mjs
      - run: node scripts/check-literary-utc-budget-rollover.mjs
  protected-rollover:
    needs: static
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Carry frozen primary day and activate only after prior isolated day passed
        run: node scripts/staging/roll-literary-isolated-utc-budget.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: literary-utc-budget-${{ github.sha }}
          path: artifacts/literary-cutover/utc-budget-rollover.json
          if-no-files-found: ignore
          retention-days: 30
