name: literary-isolated-utc-budget
on:
  pull_request:
    paths:
      - ".github/workflows/literary-isolated-utc-budget.yml"
      - "scripts/staging/roll-literary-isolated-utc-budget.mjs"
      - "scripts/check-literary-utc-budget-rollover.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-isolated-utc-budget.yml"
      - "scripts/staging/roll-literary-isolated-utc-budget.mjs"
      - "scripts/check-literary-utc-budget-rollover.mjs"
  schedule:
    # Native owner writes at :25; this independent observer never writes.
    - cron: "55 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-isolated-utc-budget
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/roll-literary-isolated-utc-budget.mjs
      - run: node scripts/check-literary-utc-budget-rollover.mjs
  protected-observation:
    needs: static
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 8
    env:
      COVE_BIOSYNC_PROD_D1_READ_TOKEN: ${{ secrets.COVE_BIOSYNC_PROD_D1_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Observe native owner receipt and isolated day fences without mutation
        run: node scripts/staging/roll-literary-isolated-utc-budget.mjs
