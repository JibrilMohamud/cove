name: covereads-owned-ssr-canary-guard
on:
  pull_request:
    paths:
      - "scripts/check-covereads-canary-deny.mjs"
      - "src/cloudflare/staging-auth-gateway.mjs"
      - "wrangler.staging-auth-gateway.test.toml"
      - "wrangler.frontend.production.toml"
      - "wrangler.frontend.staging.toml"
      - "scripts/check-cloudflare-production-candidate.mjs"
      - "scripts/check-cloudflare-ssr-stage-gate.mjs"
      - ".github/workflows/cloudflare-native-ssr-staging.yml"
      - "scripts/performance/cloudflare-concurrency.mjs"
      - ".github/workflows/covereads-owned-ssr-canary-guard.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Assert owned production candidate remains unroutable
        run: |
          node scripts/check-cloudflare-production-candidate.mjs
          node scripts/check-cloudflare-ssr-stage-gate.mjs

  isolated-asset-auth:
    needs: source-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      VERCEL: "0"
      COVE_CLOUDFLARE_SSR_PILOT: "1"
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
      COVE_SSR_PROTECTED_TEST_ORIGIN: "https://cove-asset-auth-gateway.cove-jibrilmohamud.workers.dev"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require isolated deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$COVE_SSR_PROTECTED_TEST_ORIGIN" = "https://cove-asset-auth-gateway.cove-jibrilmohamud.workers.dev"
      - name: Build protected Cloudflare-native SSR
        run: npm run build
      - name: Deploy ONLY ephemeral asset auth Worker (never real stage or public hostnames)
        shell: bash
        run: |
          set -euo pipefail
          # Disable workers.dev on the vulnerable static-assets backend.
          # Only the assets-less gateway can invoke it via service binding.
          cp wrangler.frontend.staging.toml wrangler.frontend.private.test.toml
          sed -i 's/^name = "cove-storefront-ssr-staging"$/name = "cove-asset-auth-stage"/' wrangler.frontend.private.test.toml
          sed -i 's/^workers_dev = true$/workers_dev = false/' wrangler.frontend.private.test.toml
          grep -q '^workers_dev = false
          # The assets-bound staging Worker is NOT a safe public ingress.
          # Deploy a separate asset-less Worker with a service binding to stage.
          # This gateway validates the *same* fresh bearer before ANY route.
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy \
            --config wrangler.staging-auth-gateway.test.toml
          COVE_GATE_TEST_BEARER="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$COVE_GATE_TEST_BEARER"
          echo "COVE_GATE_TEST_BEARER=$COVE_GATE_TEST_BEARER" >> "$GITHUB_ENV"
          printf '%s' "$COVE_GATE_TEST_BEARER" | \
            npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put \
            COVE_SSR_STAGING_GATE_KEY --config wrangler.frontend.private.test.toml
          printf '%s' "$COVE_GATE_TEST_BEARER" | \
            npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put \
            COVE_SSR_STAGING_GATE_KEY --config wrangler.staging-auth-gateway.test.toml
          # Control-plane propagation delay, NO HTTP warming.
          sleep 25
      - name: Prove SSR auth gate precedes real assets and account/mutation routes
        run: node scripts/check-covereads-canary-deny.mjs
      - name: Prove internal static-assets Worker has no public workers.dev route
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            https://cove-asset-auth-stage.cove-jibrilmohamud.workers.dev/manifest.webmanifest || true)"
          if [ "$code" = "200" ]; then
            echo "::error::Unprotected internal asset Worker still serves the manifest directly"
            exit 1
          fi
          echo "PASS: protected asset backend has no public workers.dev manifest route (HTTP $code)"
      - name: Delete ONLY the ephemeral test Worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for name in cove-asset-auth-gateway cove-asset-auth-stage; do
            response="$(curl -sS --max-time 25 -w '\n%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true")"
            code="$(printf '%s' "$response" | tail -n 1)"
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "::error::Ephemeral Worker cleanup failed for $name"
              failures=1
            fi
          done
          exit "$failures"
 wrangler.frontend.private.test.toml
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy \
            --config wrangler.frontend.private.test.toml
          # The assets-bound staging Worker is NOT a safe public ingress.
          # Deploy a separate asset-less Worker with a service binding to stage.
          # This gateway validates the *same* fresh bearer before ANY route.
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy \
            --config wrangler.staging-auth-gateway.test.toml
          COVE_GATE_TEST_BEARER="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$COVE_GATE_TEST_BEARER"
          echo "COVE_GATE_TEST_BEARER=$COVE_GATE_TEST_BEARER" >> "$GITHUB_ENV"
          printf '%s' "$COVE_GATE_TEST_BEARER" | \
            npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put \
            COVE_SSR_STAGING_GATE_KEY --config wrangler.frontend.staging.toml \
            --name cove-asset-auth-stage
          printf '%s' "$COVE_GATE_TEST_BEARER" | \
            npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put \
            COVE_SSR_STAGING_GATE_KEY --config wrangler.staging-auth-gateway.test.toml
          # Control-plane propagation delay, NO HTTP warming.
          sleep 25
      - name: Prove SSR auth gate precedes real assets and account/mutation routes
        run: node scripts/check-covereads-canary-deny.mjs
      - name: Delete ONLY the ephemeral test Worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for name in cove-asset-auth-gateway cove-asset-auth-stage; do
            response="$(curl -sS --max-time 25 -w '\n%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true")"
            code="$(printf '%s' "$response" | tail -n 1)"
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "::error::Ephemeral Worker cleanup failed for $name"
              failures=1
            fi
          done
          exit "$failures"
