name: Temporary content release integration
on:
  push:
    branches:
      - integration/content-commercial-20261020
    paths:
      - ".github/workflows/content-integration-temp.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create isolated three-PR integration candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/regional-epub-asset-repair-20261020 feat/content-processing-isolation-20261020 perf/literary-budget-settlement-20261020
          git merge --no-ff --no-edit origin/fix/regional-epub-asset-repair-20261020
          if ! git merge --no-ff --no-edit origin/feat/content-processing-isolation-20261020; then
            [ "$(git diff --name-only --diff-filter=U)" = "src/persistence-backend.worker.ts" ] || {
              echo "::error::Unexpected content integration conflicts"; exit 1;
            }
            git checkout --ours src/persistence-backend.worker.ts
            python3 - <<'PY'
          from pathlib import Path
          p=Path("src/persistence-backend.worker.ts")
          s=p.read_text()
          mark='    FORE_ASSETS_PER_MINUTE?: string;'
          assert s.count(mark)==1 and 'FORE_CONTENT_PIPELINE_EXTERNAL?: string;' not in s
          s=s.replace(mark,mark+'\n    FORE_CONTENT_PIPELINE_EXTERNAL?: string;')
          old='''      for (const work of [
                () => runStoredAssetTick(env),
                () => verifyAudioStorage(env),
                () => runLiteraryProfileTick(env),
                () => seedMusicProfiles(env),
              ]) {'''
          new='''      // Opt-in externalization only after both dedicated Workers have been
                // deployed and verified. Defaults to today's inline scheduling.
                const external = env.FORE_CONTENT_PIPELINE_EXTERNAL === "1";
                const work = external
                  ? [() => verifyAudioStorage(env), () => seedMusicProfiles(env)]
                  : [
                      () => runStoredAssetTick(env),
                      () => verifyAudioStorage(env),
                      () => runLiteraryProfileTick(env),
                      () => seedMusicProfiles(env),
                    ];
                for (const run of work) {'''
          assert s.count(old)==1
          s=s.replace(old,new)
          assert s.count('          await work();')==1
          s=s.replace('          await work();','          await run();')
          assert 'FORE_REGIONAL_EPUB_REPAIR_ENABLED' in s
          assert 'repairRegionalEpubAssets(env' in s
          p.write_text(s)
          PY
            git add src/persistence-backend.worker.ts
            git commit -m "merge: preserve both EPUB repairs and isolated content cron handoff"
          fi
          git merge --no-ff --no-edit origin/perf/literary-budget-settlement-20261020
          test -f src/features/fore/regional-epub-asset-repair.server.ts
          test -f src/content-processing.worker.ts
          test -f src/lib/literary-budget-settlement.ts
          test -f scripts/check-content-processing-isolation.mjs
          test -f scripts/check-literary-budget-settlement.mjs
          test -f scripts/check-regional-epub-asset-repair.mjs
          git push origin HEAD:integration/content-commercial-20261020
