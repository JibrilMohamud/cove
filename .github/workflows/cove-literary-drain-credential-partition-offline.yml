name: cove-literary-drain-credential-partition-offline
on:
  pull_request:
    paths:
      - ".github/workflows/literary-drain-worker-deploy.yml"
      - ".github/workflows/literary-isolated-replay-handoff-deploy.yml"
      - "scripts/staging/verify-literary-drain-predeploy.mjs"
      - "scripts/staging/verify-literary-drain-workers.mjs"
      - "scripts/staging/verify-literary-replay-upgrade.mjs"
      - "scripts/security/scoped-literary-drain-deploy.test.mjs"
      - ".github/workflows/cove-literary-drain-credential-partition-offline.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-preflight-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test scripts/security/scoped-literary-drain-deploy.test.mjs
      - run: node --check scripts/staging/verify-literary-drain-predeploy.mjs
      - run: node --check scripts/staging/verify-literary-drain-workers.mjs
      - run: node --check scripts/staging/verify-literary-replay-upgrade.mjs
