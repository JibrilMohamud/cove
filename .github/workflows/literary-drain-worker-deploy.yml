name: literary-drain-worker-deploy
on:
  pull_request:
    paths:
      - ".github/workflows/literary-drain-worker-deploy.yml"
      - "wrangler.content-literary-handoff.prod-draining.jsonc"
      - "wrangler.content-literary-prepare.prod-draining.jsonc"
      - "scripts/staging/verify-literary-drain-predeploy.mjs"
      - "scripts/staging/verify-literary-drain-workers.mjs"
      - "scripts/check-literary-drain-deploy-policy.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-drain-worker-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-drain-worker-deploy
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/verify-literary-drain-predeploy.mjs
      - run: node --check scripts/staging/verify-literary-drain-workers.mjs
      - run: node scripts/check-literary-drain-deploy-policy.mjs
  protected-deploy:
    needs: static
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-owner-cutover.mjs
      - run: node scripts/check-literary-preparation-domain.mjs
      - run: node scripts/check-literary-prepare-outbox.mjs
      - run: node scripts/staging/verify-literary-drain-predeploy.mjs
      - run: npm run build:content-processing
      - name: Install guarded private preparation Worker
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-prepare.prod-draining.jsonc
      - name: Install guarded private handoff Worker
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-handoff.prod-draining.jsonc
      - name: Verify private bindings, no ingress, bounded crons
        run: node scripts/staging/verify-literary-drain-workers.mjs
