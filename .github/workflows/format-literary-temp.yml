name: Temporary literary formatter
on:
  push:
    branches:
      - perf/literary-budget-settlement-20261020
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/literary-budget-settlement-20261020
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/literary-budget-settlement.ts src/features/fore/literary-profiles.server.ts scripts/check-literary-budget-settlement.mjs
      - name: Commit scoped formatting
        run: |
          if ! git diff --quiet -- src/lib/literary-budget-settlement.ts src/features/fore/literary-profiles.server.ts scripts/check-literary-budget-settlement.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/literary-budget-settlement.ts src/features/fore/literary-profiles.server.ts scripts/check-literary-budget-settlement.mjs
            git commit -m 'style: format literary budget settlement'
            git push origin HEAD:perf/literary-budget-settlement-20261020
          fi
