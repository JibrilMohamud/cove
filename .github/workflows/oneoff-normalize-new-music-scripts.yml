name: oneoff-normalize-new-music-scripts
on:
  pull_request:
    paths:
      - ".github/workflows/oneoff-normalize-new-music-scripts.yml"
permissions:
  contents: read
jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/secure-zod-v4-20261023'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { ref: fix/secure-zod-v4-20261023 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Normalize previously introduced standalone music tooling
        run: |
          npx prettier --write scripts/build-isolated-music-supply.mjs scripts/check-music-qa-analyzer.mjs scripts/music-qa-analyzer.mjs scripts/music-supply/audio-quality.mjs scripts/music-supply/ingest-reviewed-catalog.mjs scripts/music-supply/qualify-staged-masters.mjs scripts/run-music-qa-batch.mjs scripts/staging/deploy-music-supply-qa-shadow.mjs
      - name: Commit only normalized scripts to security hardening branch
        run: |
          if ! git diff --quiet -- scripts; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add scripts
            git commit -m "style(music): satisfy strict lint on new isolated ingestion and QA scripts"
            git push origin HEAD:refs/heads/fix/secure-zod-v4-20261023
          fi
