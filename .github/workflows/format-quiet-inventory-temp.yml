name: Temporary quiet-inventory formatter
on:
  push:
    branches:
      - feat/quiet-reading-inventory-20261020
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/quiet-reading-inventory-20261020
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/fore/quiet-music-inventory.server.ts scripts/check-quiet-music-inventory.mjs
      - name: Commit scoped formatting
        run: |
          if ! git diff --quiet -- src/features/fore/quiet-music-inventory.server.ts scripts/check-quiet-music-inventory.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/features/fore/quiet-music-inventory.server.ts scripts/check-quiet-music-inventory.mjs
            git commit -m 'style(music): format quiet inventory report and regression'
            git push origin HEAD:feat/quiet-reading-inventory-20261020
          fi
