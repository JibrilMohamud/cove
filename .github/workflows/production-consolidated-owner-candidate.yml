name: Production consolidated owner candidate
on:
  pull_request:
    paths:
      - 'src/storefront-strangler/production-consolidated-*.worker.ts'
      - 'src/storefront-strangler/production-persistence-enrollment.ts'
      - 'scripts/release/*production-consolidation*'
      - 'wrangler.consolidated-*.production-candidate.jsonc'
      - '.github/workflows/production-consolidated-owner-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/release/production-consolidation.test.mjs
      - run: python3 -m unittest scripts.audio_pipeline.test_biosync_production_owner_transport
      - run: python3 -m py_compile scripts/audio_pipeline/biosync_canary.py scripts/audio_pipeline/biosync_production_owner_transport.py
      - run: node scripts/release/build-production-consolidation.mjs
      - name: Exercise exact production-mode BioSync owner with disposable local bindings
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- sh -c 'COVE_MINIFLARE_MODULE="$(dirname "$(command -v wrangler)")/../miniflare" node --no-warnings scripts/release/prove-production-consolidation-biosync-native.mjs'
      - name: Dry-run exact production scripts, never upload or activate
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.consolidated-owner.production-candidate.jsonc
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.consolidated-gateway.production-candidate.jsonc
