name: literary-owner-capability-migration
on:
  pull_request:
    paths:
      - "src/storefront-strangler/literary-owner-*.ts"
      - "src/content-processing.worker.ts"
      - "src/literary-inference-publisher.worker.ts"
      - "src/lib/literary-preparation-domain.server.ts"
      - "scripts/check-literary-*.mjs"
      - "scripts/staging/*literary*capabilities.mjs"
      - "wrangler.*literary*.jsonc"
      - ".github/workflows/literary-owner-capability-migration.yml"
  push:
    branches: [main]
    paths:
      - "src/storefront-strangler/literary-owner-*.ts"
      - "src/content-processing.worker.ts"
      - "src/literary-inference-publisher.worker.ts"
      - "wrangler.*literary*.jsonc"
      - ".github/workflows/literary-owner-capability-migration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-owner-capabilities-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-owner-capabilities.mjs
      - run: node scripts/check-literary-preparation-domain.mjs
      - run: node scripts/check-literary-isolated-inference.mjs
      - run: node scripts/check-literary-private-publication.mjs
      - run: node scripts/check-literary-legacy-reconcile.mjs
      - run: node scripts/check-locked-production-legal-owner.mjs
      - run: npm run typecheck
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_COVE_LITERARY_OWNER_CAPABILITY_MIGRATION_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-storefront-strangler.mjs
      - run: npm run build:content-processing
      - run: node scripts/build-literary-inference-publisher.mjs
      - run: node scripts/staging/provision-literary-owner-capabilities.mjs
      - run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-prepare.prod-draining.jsonc
      - run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-infer.prod-isolated.jsonc
      - run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.literary-publisher.prod-isolated.jsonc
      - run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-handoff.prod-draining.jsonc
      - run: node scripts/staging/verify-literary-private-capabilities.mjs
