name: cloudflare-auth-gateway-source
on:
  pull_request:
    paths:
      - "src/cloudflare/staging-auth-gateway.mjs"
      - "wrangler.staging-auth-gateway.test.toml"
      - ".github/workflows/cloudflare-auth-gateway-source.yml"
  push:
    branches: [main]
    paths:
      - "src/cloudflare/staging-auth-gateway.mjs"
      - "wrangler.staging-auth-gateway.test.toml"
      - ".github/workflows/cloudflare-auth-gateway-source.yml"
permissions:
  contents: read
jobs:
  verify-isolated-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Gateway module syntax
        run: node --check src/cloudflare/staging-auth-gateway.mjs
      - name: "Test only: gateway has no asset/D1/R2 binding or production route"
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.staging-auth-gateway.test.toml
          grep -q '^name = "cove-asset-auth-gateway"$' wrangler.staging-auth-gateway.test.toml
          grep -q '^service = "cove-asset-auth-stage"$' wrangler.staging-auth-gateway.test.toml
          ! grep -Eq '^\[assets\]|^\[\[d1_databases\]\]|^\[\[r2_buckets\]\]|^routes?\s*=' wrangler.staging-auth-gateway.test.toml
          echo "PASS: isolated gateway source, private service binding and no assets or customer routes"
