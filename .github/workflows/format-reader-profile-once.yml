name: Format reader profile redesign once
on:
  push:
    branches: [feat/letterboxd-inspired-reader-profiles-20261101]
    paths: [.github/workflows/format-reader-profile-once.yml]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Apply project formatting
        run: |
          npx prettier --write src/routes/community.tsx src/features/fore/CommunityProfileRoute.tsx src/features/fore/ReaderProfileOverview.tsx src/features/fore/ReaderProfileSections.tsx src/features/fore/ReaderProfileRail.tsx src/features/fore/ReaderProfileBits.tsx src/features/fore/reader-profile.css src/features/fore/reader-profile-cards.css src/features/fore/reader-profile-shelves.css scripts/check-reader-profile-redesign.mjs
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/community.tsx src/features/fore/CommunityProfileRoute.tsx src/features/fore/ReaderProfileOverview.tsx src/features/fore/ReaderProfileSections.tsx src/features/fore/ReaderProfileRail.tsx src/features/fore/ReaderProfileBits.tsx src/features/fore/reader-profile.css src/features/fore/reader-profile-cards.css src/features/fore/reader-profile-shelves.css scripts/check-reader-profile-redesign.mjs
          git commit -m "style(community): format new reader profile components"
          git push origin HEAD:refs/heads/feat/letterboxd-inspired-reader-profiles-20261101
