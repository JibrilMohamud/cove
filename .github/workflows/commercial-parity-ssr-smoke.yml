name: commercial-parity-ssr-smoke
on:
  push:
    branches:
      - perf/anonymous-context-one-read-20261020
    paths:
      - "scripts/check-storefront-bootstrap.mjs"
      - "src/server.ts"
      - "scripts/staging/stage-http-transport.mjs"
      - "src/features/fore/localization.server.ts"
      - "src/features/fore/storefront-anonymous-catalog.server.ts"
      - "scripts/staging/check-anonymous-context-one-read.mjs"
      - "scripts/staging/check-commercial-parity-ssr.mjs"
      - "scripts/staging/check-commercial-parity-rps.mjs"
      - "scripts/staging/check-anonymous-homepage-prefetch.mjs"
      - "src/features/fore/storefront-anonymous-bootstrap.server.ts"
      - "src/features/fore/api.server.ts"
      - "src/features/fore/anonymous-context-singleflight.server.ts"
      - "scripts/staging/check-anonymous-context-singleflight.mjs"
      - "src/features/fore/taxonomy.server.ts"
      - "wrangler.commercial-parity.stage.toml"
      - ".github/workflows/commercial-parity-ssr-smoke.yml"
permissions:
  contents: read
concurrency:
  group: cove-commercial-parity-protected-ssr
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
      VERCEL: "0"
      COVE_CLOUDFLARE_SSR_PILOT: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report canonical formatting for changed sources
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import prettier from "prettier";
          const files = [
            "src/features/fore/storefront-anonymous-catalog.server.ts",
            "scripts/staging/stage-http-transport.mjs",
            "scripts/staging/check-anonymous-context-singleflight.mjs",
            "scripts/staging/check-anonymous-homepage-prefetch.mjs",
            "scripts/staging/check-commercial-parity-rps.mjs",
            "scripts/staging/check-commercial-parity-ssr.mjs",
            "scripts/staging/check-commercial-parity-state.mjs",
            "scripts/staging/reconstruct-d1-schema-only.mjs",
            "scripts/staging/seed-commercial-parity.mjs",
            "scripts/staging/verify-schema-only-export.mjs",
            "src/features/fore/anonymous-context-singleflight.server.ts",
            "src/features/fore/api.server.ts",
            "src/features/fore/search.server.ts",
            "src/features/fore/taxonomy.server.ts",
            "src/server.ts",
            "src/features/fore/storefront-anonymous-bootstrap.server.ts",
            "scripts/check-storefront-bootstrap.mjs",
            ".github/workflows/commercial-parity-ssr-smoke.yml"
          ];
          for (const path of files) {
            const source = fs.readFileSync(path, "utf8");
            const options = await prettier.resolveConfig(path);
            const formatted = await prettier.format(source, { ...options, filepath: path });
            if (source !== formatted)
              {
                let start = 0;
                while (start < source.length && source[start] === formatted[start]) start++;
                let suffix = 0;
                while (suffix < source.length - start &&
                  source[source.length - 1 - suffix] === formatted[formatted.length - 1 - suffix]) suffix++;
                console.log("COVE_FORMAT_DELTA " + JSON.stringify({
                  path, start, end: source.length - suffix,
                  encodedContent: encodeURIComponent(formatted.slice(start, formatted.length - suffix))
                }));
              }
          }
          NODE
      - name: Check canonical localization parity and one-read context
        run: node scripts/staging/check-anonymous-context-one-read.mjs
      - name: Verify full catalog parity, private guards and live denial
        run: node scripts/check-storefront-bootstrap.mjs
      - name: Guard merchandising and locale parity of parallel page read
        run: node scripts/staging/check-anonymous-homepage-prefetch.mjs
      - name: Verify strict in-flight only presentation deduplication
        run: node scripts/staging/check-anonymous-context-singleflight.mjs
      - name: Assert isolated fixture and immutable cloud bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -q 'database_id = "ce0e67b7-692d-44c6-94dc-7f324e7c5421"' wrangler.commercial-parity.stage.toml
          ! grep -q '4bd657ac-8789-403e-a28c-93aba8d0a989' wrangler.commercial-parity.stage.toml
          grep -q 'bucket_name = "cove-commercial-parity-media-20261020"' wrangler.commercial-parity.stage.toml
          grep -q 'COVE_SSR_STAGING = "1"' wrangler.commercial-parity.stage.toml
      - name: Build current candidate Cloudflare-native SSR
        run: npm run build
      - name: Deploy protected ephemeral stage and run strict rights/TTFB probes
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            npx wrangler@4.151.0 delete --config wrangler.commercial-parity.stage.toml --force || true
          }
          trap cleanup EXIT
          npx wrangler@4.151.0 deploy --config wrangler.commercial-parity.stage.toml
          STAGE_TOKEN=$(openssl rand -hex 32)
          printf %s "$STAGE_TOKEN" | npx wrangler@4.151.0 secret put COVE_SSR_STAGING_GATE_KEY \
            --config wrangler.commercial-parity.stage.toml
          export COVE_SSR_STAGING_GATE_KEY="$STAGE_TOKEN"
          # Both measurements must run on the SAME protected isolated
          # deployment, even if the strict burst SLO fails. Report failures
          # without concealing one test by aborting the other prematurely.
          set +e
          node scripts/staging/check-commercial-parity-ssr.mjs
          burst_status=$?
          node scripts/staging/check-commercial-parity-rps.mjs
          mixed_status=$?
          COVE_STAGE_HTTP2=1 node scripts/staging/check-commercial-parity-ssr.mjs
          h2_burst_status=$?
          COVE_STAGE_HTTP2=1 node scripts/staging/check-commercial-parity-rps.mjs
          h2_mixed_status=$?
          set -e
          if [ "$burst_status" -ne 0 ] || [ "$mixed_status" -ne 0 ] || \
             [ "$h2_burst_status" -ne 0 ] || [ "$h2_mixed_status" -ne 0 ]; then exit 1; fi
      - name: Retain sanitized aggregate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-commercial-parity-ssr
          path: |
            artifacts/commercial-parity-ssr-smoke*.json
            artifacts/commercial-parity-mixed-rps*.json
          if-no-files-found: warn
          retention-days: 14
