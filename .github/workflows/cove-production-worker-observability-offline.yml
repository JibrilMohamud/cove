name: cove-production-worker-observability-offline
on:
  pull_request:
    branches: [main]
    paths:
      - wrangler.backend.production.toml
      - .github/workflows/deploy-persistence-backend.yml
      - .github/workflows/cove-production-worker-observability-offline.yml
      - src/features/fore/api.server.ts
      - src/persistence-backend.worker.ts
      - scripts/staging/check-protected-production-worker-observability.test.mjs
permissions:
  contents: read
jobs:
  protected-config-and-log-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test scripts/staging/check-protected-production-worker-observability.test.mjs
      - run: git diff --check
