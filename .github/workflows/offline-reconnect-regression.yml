name: offline-reconnect-regression
on:
  pull_request:
    paths:
      - "public/sw.js"
      - "src/offline-entry.tsx"
      - "scripts/check-offline-shell.mjs"
      - ".github/workflows/offline-reconnect-regression.yml"
  push:
    branches: [main]
    paths:
      - "public/sw.js"
      - "src/offline-entry.tsx"
      - "scripts/check-offline-shell.mjs"
      - ".github/workflows/offline-reconnect-regression.yml"
permissions:
  contents: read
jobs:
  preserve-downloads-and-reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove offline fallback, no-store reconnect and preserved book storage
        run: node scripts/check-offline-shell.mjs
