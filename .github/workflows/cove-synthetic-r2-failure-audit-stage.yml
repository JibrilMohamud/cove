name: cove-synthetic-r2-failure-audit-stage-check
on:
  push:
    branches:
      - perf/stage-synthetic-audit-r2-20261114
    paths:
      - src/features/fore/api.server.ts
      - src/features/fore/synthetic-failure-audit-r2.stage.ts
      - scripts/check-synthetic-failure-audit-r2.mjs
      - docs/architecture/canonical-writer-review.json
      - docs/architecture/2026-11-14-synthetic-r2-audit-source-attestation.json
      - .github/workflows/cove-synthetic-r2-failure-audit-stage.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Synthetic-only R2 503 audit eligibility, data minimization and fallback
        run: node scripts/check-synthetic-failure-audit-r2.mjs
      - name: Verify canonical writer sites and independent source re-attestation
        run: |
          node scripts/reconcile-canonical-writers.mjs
          node scripts/rebase-canonical-writer-review.mjs --review-attestation=docs/architecture/2026-11-14-synthetic-r2-audit-source-attestation.json
      - name: Require project formatting for experiment-only source
        run: npx prettier --check src/features/fore/synthetic-failure-audit-r2.stage.ts scripts/check-synthetic-failure-audit-r2.mjs
      - name: Build actual staging backend bundle without deploying
        run: npm run build:backend
