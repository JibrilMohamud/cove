name: cove-stage-owner-point-d1-100rps
on:
  push:
    branches: [perf/stage-owner-point-d1-100rps-20261115]
    paths:
      - scripts/staging/owner-point-d1-benchmark-fixture.mjs
      - scripts/staging/causal-triad-stage.worker.mjs
      - scripts/staging/causal-triad-stage.worker.test.mjs
      - scripts/staging/private-causal-triad.worker.mjs
      - scripts/staging/private-causal-triad.worker.test.mjs
      - scripts/staging/run-private-causal-triad.mjs
      - .github/workflows/cove-stage-owner-point-d1-100rps.yml
permissions:
  contents: read
concurrency:
  group: cove-isolated-causal-catalog-stage-driver
  cancel-in-progress: false
jobs:
  point-shaped-primary-d1-capacity:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_SYNTHETIC_D1_ID: e4cbb0ef-6288-4fa1-9dbb-fb42fe01d4f3
      COVE_SYNTHETIC_POINT_BENCH: "1"
      COVE_ALLOW_SAFE_RESTORE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify synthetic-only worker guards and immutable fixture boundary
        run: |
          node --test scripts/staging/causal-triad-stage.worker.test.mjs
          node --test scripts/staging/private-causal-triad.worker.test.mjs
          node --check scripts/staging/owner-point-d1-benchmark-fixture.mjs
          node --check scripts/staging/run-private-causal-triad.mjs
          node scripts/reconcile-canonical-writers.mjs
          npx prettier --check scripts/staging/owner-point-d1-benchmark-fixture.mjs scripts/staging/causal-triad-stage.worker.mjs scripts/staging/causal-triad-stage.worker.test.mjs scripts/staging/private-causal-triad.worker.mjs scripts/staging/run-private-causal-triad.mjs
      - name: Require isolated deployment credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install ephemeral 25-row D1 positive-SHAPED benchmark (never authorizing)
        run: node scripts/staging/owner-point-d1-benchmark-fixture.mjs --install
      - name: Strict 1/4/8/16/32, 50RPS and two 100RPS synthetic D1 phases
        run: node scripts/staging/run-private-causal-triad.mjs --point-only-100rps
      - name: Restore exact original private driver on every exit
        if: always()
        run: node scripts/staging/run-private-causal-triad.mjs --restore-only
      - name: Drop all five temporary synthetic D1 benchmark tables on every exit
        if: always()
        run: node scripts/staging/owner-point-d1-benchmark-fixture.mjs --destroy
      - name: Archive full offered/valid counts, latency tails and stage-only attribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-stage-owner-point-25-d1-${{ github.run_id }}
          path: artifacts/causal-triad-stage/
          retention-days: 14
          if-no-files-found: ignore
