name: cove-protected-stage-canonical-rights-differential
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/staging/check-protected-canonical-real-d1-differential.mjs"
      - "scripts/staging/rights-differential-coverage.mjs"
      - "scripts/staging/rights-differential-coverage.test.mjs"
      - "scripts/staging/check-protected-canonical-rights-source.mjs"
      - "scripts/staging/check-actual-rights-contract-fixture.mjs"
      - "scripts/staging/rights-resolver-sqlite-fixture.py"
      - "src/features/fore/rights.server.ts"
      - ".github/workflows/cove-protected-stage-canonical-rights-differential.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "The exact approved main commit; source drift denies the live QA audit"
        required: true
        type: string
      confirm:
        description: "Type STAGE_RIGHTS_DIFF to request protected READ-ONLY synthetic D1 testing"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cove-protected-stage-canonical-rights-differential
  cancel-in-progress: false
jobs:
  offline-safety:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - name: Prove bounded fixed stage-D1 transport and strict policy-cohort completeness
        run: |
          node --check scripts/staging/check-protected-canonical-real-d1-differential.mjs
          node --test scripts/staging/rights-differential-coverage.test.mjs
          node scripts/staging/check-protected-canonical-rights-source.mjs
      - name: Exercise current canonical TypeScript rights/contract resolver offline
        run: node scripts/staging/check-actual-rights-contract-fixture.mjs
      - run: git diff --check
  protected-stage-only:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'STAGE_RIGHTS_DIFF' &&
      inputs.reviewed_main_sha == github.sha
    needs: [offline-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cove-production-release-audit
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Reject source drift or unexpected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.reviewed_main_sha }}"
          test "${{ github.ref }}" = "refs/heads/main"
      - run: npm ci --no-audit --no-fund
      - name: Require independent D1 Read-only credential (fixed stage D1 ID in script)
        shell: bash
        env:
          COVE_CF_STAGE_D1_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_D1_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${#COVE_CF_STAGE_D1_READ_TOKEN}" -lt 20 ]; then
            echo "::error title=Missing protected stage D1 Read token::Install a dedicated D1 Read-only token. Cloudflare account-token D1 Read may be account-wide; the audit script strictly pins the synthetic D1 ID. Do NOT substitute the deploy or primary-write token."
            exit 1
          fi
      - name: Differentially compare required legal policy cohorts (READ ONLY)
        run: node scripts/staging/check-protected-canonical-real-d1-differential.mjs
        env:
          COVE_CF_STAGE_D1_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
          COVE_SYNTHETIC_D1_ID: e4cbb0ef-6288-4fa1-9dbb-fb42fe01d4f3
          COVE_SYNTHETIC_OWNER_DIFF_ONLY: "1"
