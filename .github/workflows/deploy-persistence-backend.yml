name: deploy-persistence-backend

on:
  # Dependency-lock or workflow-only changes must never silently execute
  # production D1 migrations and backend deploys. Use workflow_dispatch for
  # such releases after explicit validation.
  push:
    branches: [main]
    paths:
      - "src/persistence-backend.worker.ts"
      - "src/persistence-backend-entry.worker.ts"
      - "src/lib/catalog-ingestion-backpressure.ts"
      - "scripts/check-catalog-ingestion-backpressure.mjs"
      - "src/features/fore/**"
      - "scripts/check-isolated-http-metric.mjs"
      - "scripts/check-production-http-metric-wiring.mjs"
      # Store.tsx changes only the browser/SSR presentation. Its source is
      # absent from the persistence Worker's backend bundle: do not redeploy
      # and rerun primary D1 migrations for this optional UI enhancement.
      - "!src/features/fore/Store.tsx"
      # Vercel-only gateway proxy changes never require D1 migrations or a
      # persistence Worker redeployment. Backend changes are listed above.
      - "src/storefront-strangler/backend-owner-attestation-entrypoint.ts"
      # src/server.ts is the Vercel frontend gateway, not persistence code.
      # Frontend-only releases must not auto-run production D1 migrations.
      - "scripts/build-persistence-backend.mjs"
      - "drizzle/*.sql"
      - "wrangler.backend.production.toml"
      - "package.json"
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Cloudflare Worker name. Use the existing owner Worker name to preserve its other secrets."
        required: true
        default: "cove-persistence-backend"
        type: string
      d1_database_id:
        description: "Cove production D1 database UUID"
        required: true
        default: "4bd657ac-8789-403e-a28c-93aba8d0a989"
        type: string
      d1_database_name:
        description: "Existing Cove production D1 database name"
        required: true
        default: "cove-production"
        type: string
      r2_bucket_name:
        description: "Cove production R2 bucket name"
        required: true
        default: "cove-production-media"
        type: string
      public_url:
        description: "Canonical public Vercel origin"
        required: true
        default: "https://cove-puce-theta.vercel.app"
        type: string
      apply_migrations:
        description: "Apply pending Cove D1 migrations before deployment"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cove-persistence-production
  cancel-in-progress: false

jobs:
  deploy:
    # Do not apply production D1 migrations while synthetic cold/100-RPS
    # acceptance or a live principal audit is using the same primary D1.
    # Keep the existing workflow-level deployment serialization too.
    concurrency:
      group: cove-exclusive-real-primary-cold-acceptance
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate deployment inputs
        shell: bash
        env:
          WORKER_NAME: ${{ inputs.worker_name || 'cove-persistence-backend' }}
          D1_DATABASE_ID: ${{ inputs.d1_database_id || '4bd657ac-8789-403e-a28c-93aba8d0a989' }}
          D1_DATABASE_NAME: ${{ inputs.d1_database_name || 'cove-production' }}
          R2_BUCKET_NAME: ${{ inputs.r2_bucket_name || 'cove-production-media' }}
          PUBLIC_URL: ${{ inputs.public_url || 'https://cove-puce-theta.vercel.app' }}
        run: |
          set -euo pipefail
          [[ "$WORKER_NAME" =~ ^[a-zA-Z0-9_-]{1,63}$ ]] || { echo "Invalid Worker name"; exit 1; }
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "Invalid D1 database ID"; exit 1; }
          [[ "$D1_DATABASE_NAME" =~ ^[a-zA-Z0-9_-]{1,64}$ ]] || { echo "Invalid D1 database name"; exit 1; }
          [[ "$R2_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "Invalid R2 bucket name"; exit 1; }
          node -e '
            const u = new URL(process.env.PUBLIC_URL);
            if (u.protocol !== "https:" || u.username || u.password || u.pathname !== "/" || u.search || u.hash) {
              throw new Error("public_url must be an HTTPS origin with no path, credentials, query, or fragment");
            }
          '

      - name: Verify strict production guest-catalog release probe behavior
        run: node --test scripts/wait-live-storefront-catalog.test.mjs

      - name: Strict ephemeral Worker denied-token readiness contract
        run: node --test scripts/staging/strict-credential-denial.test.mjs
      - name: Strict ephemeral verifier method and route denial
        run: node --test scripts/staging/strict-ephemeral-route-denial.test.mjs

      - name: Verify private HTTP metrics isolation before production deployment
        run: |
          node scripts/check-isolated-http-metric.mjs
          node scripts/check-production-http-metric-wiring.mjs

      - name: Build persistence Worker
        run: npm run build:backend

      - name: Write deployment config
        shell: bash
        env:
          WORKER_NAME: ${{ inputs.worker_name || 'cove-persistence-backend' }}
          D1_DATABASE_ID: ${{ inputs.d1_database_id || '4bd657ac-8789-403e-a28c-93aba8d0a989' }}
          D1_DATABASE_NAME: ${{ inputs.d1_database_name || 'cove-production' }}
          R2_BUCKET_NAME: ${{ inputs.r2_bucket_name || 'cove-production-media' }}
          PUBLIC_URL: ${{ inputs.public_url || 'https://cove-puce-theta.vercel.app' }}
        run: |
          set -euo pipefail
          # Only the exact canonical Worker+primary-D1 pair may move
          # non-identifying SUCCESSFUL public GET metrics off D1. Staging,
          # clone deployments and arbitrary Worker names remain opted out.
          ANON_METRICS="0"
          if [ "$WORKER_NAME" = "cove-persistence-backend" ] && [ "$D1_DATABASE_ID" = "4bd657ac-8789-403e-a28c-93aba8d0a989" ]; then
            ANON_METRICS="1"
          fi
          cat > wrangler.backend.deploy.toml <<EOF
          name = "$WORKER_NAME"
          main = "backend-dist/worker.js"
          compatibility_date = "2026-09-01"
          workers_dev = true
          keep_vars = true

          [limits]
          cpu_ms = 300_000

          # Public anonymous first-paint admission only, never customer or
          # commerce authorization. The independent staging namespace is 731903.
          [[ratelimits]]
          name = "COVE_STOREFRONT_READ_LIMITER"
          namespace_id = "991731904"

          [ratelimits.simple]
          limit = 180
          period = 60

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          migrations_dir = "drizzle"

          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "$R2_BUCKET_NAME"

          [[r2_buckets]]
          binding = "SOUNDS_PRESENTATION"
          bucket_name = "cove-sounds-private-presentation"

          [[kv_namespaces]]
          binding = "SOUNDS_PRESENTATION_KV"
          id = "544267f3cf604c1d8976f1b06d258e24"

          [[analytics_engine_datasets]]
          binding = "SOUNDS_ANALYTICS"
          dataset = "cove_sounds_funnel"

          # Performance aggregates only: method, allowlisted route, status,
          # numeric duration; no identity, URL query, IP, token or book IDs.
          [[analytics_engine_datasets]]
          binding = "OPS_ANALYTICS"
          dataset = "cove_public_http_ops"

          [ai]
          binding = "AI"

          [vars]
          FORE_PUBLIC_URL = "$PUBLIC_URL"
          FORE_ENVIRONMENT = "production"
          FORE_AUTH_MODE = "supabase"
          COVE_PUBLIC_ANON_HTTP_TELEMETRY = "$ANON_METRICS"
          COVE_OPS_TELEMETRY_MODE = "analytics-engine"
          FORE_DEFAULT_TERRITORY = "US"
          FORE_CATALOG_PAGES_PER_TICK = "5"
          FORE_CATALOG_EPUBS_PER_TICK = "0"
          FORE_ASSETS_PER_MINUTE = "32"
          FORE_AUDIO_COMPUTE_MODE = "paused"
          FORE_AUDIO_MONTHLY_SECONDS = "3600"
          FORE_AUDIO_MIN_INTERVAL_SECONDS = "86400"

          [secrets]
          required = ["FORE_INGESTION_SIGNING_KEY", "FORE_BACKEND_TOKEN_SHA256"]

          [triggers]
          crons = ["* * * * *", "*/5 * * * *", "*/10 * * * *", "7-57/10 * * * *", "23 * * * *", "17 3 * * *", "41 4 * * *"]
          EOF

          if [ "$WORKER_NAME" = "cove-persistence-backend" ] && [ "$D1_DATABASE_ID" = "4bd657ac-8789-403e-a28c-93aba8d0a989" ]; then
            cat >> wrangler.backend.deploy.toml <<'EOF'

          [[durable_objects.bindings]]
          name = "LEGAL_AUTHORITY"
          class_name = "CoveLegalAuthority"
          script_name = "cove-legal-authority-production"
          EOF
          fi

      # Worker secrets are owned by Cloudflare. Wrangler preserves them on deploy.
      # Keep dashboard-owned configuration (including existing audio URLs) intact.
      - name: Check deployment credentials
        id: deploy_auth
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped until CLOUDFLARE_API_TOKEN is configured in repository Actions secrets."
          fi

      - name: Apply pending D1 migrations
        # Code/cron push releases must not run unrelated production D1 migrations.
        # Only an explicitly requested workflow dispatch may apply schema changes.
        if: ${{ steps.deploy_auth.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
          D1_DATABASE_ID: ${{ inputs.d1_database_id || '4bd657ac-8789-403e-a28c-93aba8d0a989' }}
        run: node scripts/staging/retry-production-d1-migrations.mjs

      - name: Verify exact disabled production owner before binding
        if: ${{ steps.deploy_auth.outputs.enabled == 'true' && (inputs.worker_name == '' || inputs.worker_name == 'cove-persistence-backend') && (inputs.d1_database_id == '' || inputs.d1_database_id == '4bd657ac-8789-403e-a28c-93aba8d0a989') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
        run: node scripts/check-production-owner-binding.mjs --before-deploy

      - name: Deploy persistence Worker
        if: ${{ steps.deploy_auth.outputs.enabled == 'true' }}
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "d26430caa63ec55f6612e32f36aca5e9"
          command: deploy --config wrangler.backend.deploy.toml --keep-vars

      - name: Verify production persistence binding after deployment
        if: ${{ steps.deploy_auth.outputs.enabled == 'true' && (inputs.worker_name == '' || inputs.worker_name == 'cove-persistence-backend') && (inputs.d1_database_id == '' || inputs.d1_database_id == '4bd657ac-8789-403e-a28c-93aba8d0a989') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
        run: node scripts/check-production-owner-binding.mjs --after-deploy

      - name: Prove live production backend credential and disabled owner handshake
        if: ${{ steps.deploy_auth.outputs.enabled == 'true' && (inputs.worker_name == '' || inputs.worker_name == 'cove-persistence-backend') && (inputs.d1_database_id == '' || inputs.d1_database_id == '4bd657ac-8789-403e-a28c-93aba8d0a989') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
        run: node scripts/prove-production-owner-handshake.mjs

      - name: Require consecutive live catalog responses after backend deployment
        # Credential/DO handshake alone did not catch the burst of 5xx during
        # the next production storefront probe. Keep release red until actual
        # live rights-filtered public catalog reads succeed twice in a row.
        # No cached or invented book data is accepted.
        if: ${{ steps.deploy_auth.outputs.enabled == 'true' && (inputs.worker_name == '' || inputs.worker_name == 'cove-persistence-backend') && (inputs.d1_database_id == '' || inputs.d1_database_id == '4bd657ac-8789-403e-a28c-93aba8d0a989') }}
        env:
          COVE_PUBLIC_URL: ${{ inputs.public_url || 'https://cove-puce-theta.vercel.app' }}
          COVE_CATALOG_CONSECUTIVE_SUCCESSES: "2"
          COVE_CATALOG_READINESS_ATTEMPTS: "8"
        run: node scripts/wait-live-storefront-catalog.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-owner-handshake-${{ github.run_id }}
          path: artifacts/production-owner-handshake/
          if-no-files-found: ignore

      - name: Deployment summary
        if: ${{ steps.deploy_auth.outputs.enabled == 'true' }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          WORKER_NAME: ${{ inputs.worker_name || 'cove-persistence-backend' }}
        run: |
          {
            echo "## Cove persistence backend deployed"
            echo
            echo "- Worker: $WORKER_NAME"
            if [ -n "${DEPLOYMENT_URL:-}" ]; then
              echo "- Deployment URL: $DEPLOYMENT_URL"
              echo '- Set Vercel `FORE_BACKEND_URL` to this Worker origin.'
            else
              echo '- Read the Wrangler deploy output above for the Worker URL and set it as Vercel `FORE_BACKEND_URL`.'
            fi
            echo '- Vercel keeps `FORE_BACKEND_TOKEN`; Cloudflare checks the matching protected `FORE_BACKEND_TOKEN_SHA256` Worker secret.'
            echo '- Cloudflare keeps the private `FORE_INGESTION_SIGNING_KEY`; Vercel keeps the matching public `FORE_INGESTION_VERIFY_JWK`.'
          } >> "$GITHUB_STEP_SUMMARY"
