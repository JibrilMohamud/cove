name: cove-scoped-cloudflare-credentials-offline
on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-native-ssr-staging.yml"
      - ".github/workflows/cove-stage-protected-worker-rollback.yml"
      - ".github/workflows/cloudflare-paired-release-freeze.yml"
      - ".github/workflows/deploy-locked-fast-storefront-gateway.yml"
      - ".github/workflows/deploy-persistence-backend.yml"
      - ".github/workflows/paid-legal-full-schema-private-qa.yml"
      - ".github/workflows/legal-authority-private-qa.yml"
      - "scripts/staging/prove-private-legal-owner.mjs"
      - "scripts/staging/legal-qa-cloudflare-credentials.mjs"
      - "scripts/staging/legal-qa-cloudflare-credentials.test.mjs"
      - "scripts/staging/prove-private-paid-owner.mjs"
      - "scripts/staging/paid-qa-cloudflare-credentials.mjs"
      - "scripts/staging/paid-qa-cloudflare-credentials.test.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway.worker.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway.test.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway-config.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway-config.test.mjs"
      - "scripts/release/production-persistence-manual-only.test.mjs"
      - "scripts/staging/check-protected-persistence-deploy-guard.mjs"
      - ".github/workflows/strangler-stage-core-deploy.yml"
      - ".github/workflows/strangler-stage-private-bucket-provision.yml"
      - "scripts/staging/provision-strangler-private-r2.mjs"
      - "scripts/security/scoped-cloudflare-credentials.test.mjs"
      - ".github/workflows/cove-scoped-cloudflare-credentials-offline.yml"
      - "scripts/audit-live-canonical-d1-principals.mjs"
      - "scripts/test-live-canonical-d1-principals.mjs"
      - "scripts/check-live-production-cutover.mjs"
      - "scripts/check-production-owner-binding.mjs"
      - ".github/workflows/deployed-canonical-d1-principal-audit.yml"
      - ".github/workflows/production-cutover-topology-audit.yml"
      - "scripts/security/cloudflare-readonly-audit-token-split.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-native-ssr-staging.yml"
      - ".github/workflows/cove-stage-protected-worker-rollback.yml"
      - ".github/workflows/cloudflare-paired-release-freeze.yml"
      - ".github/workflows/deploy-locked-fast-storefront-gateway.yml"
      - ".github/workflows/deploy-persistence-backend.yml"
      - ".github/workflows/paid-legal-full-schema-private-qa.yml"
      - ".github/workflows/legal-authority-private-qa.yml"
      - "scripts/staging/prove-private-legal-owner.mjs"
      - "scripts/staging/legal-qa-cloudflare-credentials.mjs"
      - "scripts/staging/legal-qa-cloudflare-credentials.test.mjs"
      - "scripts/staging/prove-private-paid-owner.mjs"
      - "scripts/staging/paid-qa-cloudflare-credentials.mjs"
      - "scripts/staging/paid-qa-cloudflare-credentials.test.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway.worker.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway.test.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway-config.mjs"
      - "scripts/staging/synthetic-qa-d1-gateway-config.test.mjs"
      - "scripts/release/production-persistence-manual-only.test.mjs"
      - "scripts/staging/check-protected-persistence-deploy-guard.mjs"
      - ".github/workflows/strangler-stage-core-deploy.yml"
      - ".github/workflows/strangler-stage-private-bucket-provision.yml"
      - "scripts/staging/provision-strangler-private-r2.mjs"
      - "scripts/security/scoped-cloudflare-credentials.test.mjs"
      - ".github/workflows/cove-scoped-cloudflare-credentials-offline.yml"
      - "scripts/audit-live-canonical-d1-principals.mjs"
      - "scripts/test-live-canonical-d1-principals.mjs"
      - "scripts/check-live-production-cutover.mjs"
      - "scripts/check-production-owner-binding.mjs"
      - ".github/workflows/deployed-canonical-d1-principal-audit.yml"
      - ".github/workflows/production-cutover-topology-audit.yml"
      - "scripts/security/cloudflare-readonly-audit-token-split.test.mjs"
permissions:
  contents: read
jobs:
  check-scoped-staging-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prove stage Worker deployment and R2/D1 credential isolation without secrets
        run: |
          node --check scripts/staging/provision-strangler-private-r2.mjs
          node --check scripts/staging/prove-private-paid-owner.mjs
          node --test scripts/staging/paid-qa-cloudflare-credentials.test.mjs
          node --test scripts/staging/synthetic-qa-d1-gateway.test.mjs
          node --test scripts/staging/synthetic-qa-d1-gateway-config.test.mjs
          node --test scripts/staging/legal-qa-cloudflare-credentials.test.mjs
          node --check scripts/staging/prove-private-legal-owner.mjs
          node --test scripts/security/scoped-cloudflare-credentials.test.mjs
          node --test scripts/security/cloudflare-readonly-audit-token-split.test.mjs
          node --test scripts/test-live-canonical-d1-principals.mjs
          node --test scripts/check-live-production-cutover.test.mjs
