name: cove-scoped-cloudflare-credentials-offline
on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-native-ssr-staging.yml"
      - ".github/workflows/cove-stage-protected-worker-rollback.yml"
      - ".github/workflows/cloudflare-paired-release-freeze.yml"
      - ".github/workflows/deploy-locked-fast-storefront-gateway.yml"
      - ".github/workflows/deploy-persistence-backend.yml"
      - "scripts/release/production-persistence-manual-only.test.mjs"
      - "scripts/staging/check-protected-persistence-deploy-guard.mjs"
      - ".github/workflows/strangler-stage-core-deploy.yml"
      - ".github/workflows/strangler-stage-private-bucket-provision.yml"
      - "scripts/staging/provision-strangler-private-r2.mjs"
      - "scripts/security/scoped-cloudflare-credentials.test.mjs"
      - ".github/workflows/cove-scoped-cloudflare-credentials-offline.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-native-ssr-staging.yml"
      - ".github/workflows/cove-stage-protected-worker-rollback.yml"
      - ".github/workflows/cloudflare-paired-release-freeze.yml"
      - ".github/workflows/deploy-locked-fast-storefront-gateway.yml"
      - ".github/workflows/deploy-persistence-backend.yml"
      - "scripts/release/production-persistence-manual-only.test.mjs"
      - "scripts/staging/check-protected-persistence-deploy-guard.mjs"
      - ".github/workflows/strangler-stage-core-deploy.yml"
      - ".github/workflows/strangler-stage-private-bucket-provision.yml"
      - "scripts/staging/provision-strangler-private-r2.mjs"
      - "scripts/security/scoped-cloudflare-credentials.test.mjs"
      - ".github/workflows/cove-scoped-cloudflare-credentials-offline.yml"
permissions:
  contents: read
jobs:
  check-scoped-staging-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prove stage Worker deployment and R2/D1 credential isolation without secrets
        run: |
          node --check scripts/staging/provision-strangler-private-r2.mjs
          node --test scripts/security/scoped-cloudflare-credentials.test.mjs
