name: audio-v2-production-smoke-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audio-v2-production-smoke-once.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SIGNING_KEY: ${{ secrets.FORE_INGESTION_SIGNING_KEY }}
      COVE_ORIGIN: https://cove-puce-theta.vercel.app

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Baseline audio queue state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute cove-production --remote --json --command             "SELECT kind,status,COUNT(*) count,MAX(updated_at) newest FROM audio_jobs WHERE kind IN ('track','align') GROUP BY kind,status ORDER BY kind,status;"

      - name: Enqueue signed v2 track and alignment work
        shell: bash
        run: |
          set -euo pipefail
          sign_post() {
            local path="$1"
            local timestamp signature response
            timestamp="$(node -e 'process.stdout.write(String(Date.now()))')"
            signature="$(
              TIMESTAMP="$timestamp" REQUEST_PATH="$path" node <<'NODE'
          const { createPrivateKey, sign } = require("node:crypto");
          const jwk = JSON.parse(process.env.SIGNING_KEY);
          const key = createPrivateKey({ key: jwk, format: "jwk" });
          const message = `${process.env.TIMESTAMP}\nPOST\n${process.env.REQUEST_PATH}`;
          const signature = sign("sha256", Buffer.from(message), {
            key,
            dsaEncoding: "ieee-p1363",
          });
          process.stdout.write(signature.toString("base64url"));
          NODE
            )"
            response="$(
              curl --fail-with-body --silent --show-error                 -X POST "${COVE_ORIGIN}${path}"                 -H "x-cove-ingestion-timestamp: ${timestamp}"                 -H "x-cove-ingestion-signature: ${signature}"
            )"
            RESPONSE="$response" node <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE);
          if (!payload.ok || !payload.queued || payload.queueMode !== "push") {
            throw new Error("Cove audio v2 producer did not confirm a push-mode queue enqueue");
          }
          console.log(JSON.stringify({
            ok: payload.ok,
            queued: payload.queued,
            queueMode: payload.queueMode,
            kind: payload.kind,
            requestedMaxJobs: payload.requestedMaxJobs,
          }));
          NODE
          }

          sign_post "/api/fore/internal/ingestion/audio-track"
          sign_post "/api/fore/internal/ingestion/audio-align"

      - name: Verify push subscriber claims durable jobs
        shell: bash
        run: |
          set -euo pipefail
          sleep 25
          npx wrangler d1 execute cove-production --remote --json --command             "SELECT kind,status,COUNT(*) count,MAX(updated_at) newest FROM audio_jobs WHERE kind IN ('track','align') GROUP BY kind,status ORDER BY kind,status;"
          npx wrangler d1 execute cove-production --remote --json --command             "SELECT id,kind,status,attempts,substr(last_error,1,240) last_error,updated_at FROM audio_jobs WHERE kind IN ('track','align') ORDER BY updated_at DESC LIMIT 12;"
