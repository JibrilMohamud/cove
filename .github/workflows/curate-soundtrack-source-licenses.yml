name: Curate source-license soundtracks

on:
  # PR smoke runs are read-only and do not grant untrusted forks secrets.
  pull_request:
    paths:
      - ".github/workflows/curate-soundtrack-source-licenses.yml"
      - "scripts/soundtracks/**"
  # Safe deployment smoke run (read-only even when the scoped credential exists).
  push:
    branches: [main]
    paths:
      - ".github/workflows/curate-soundtrack-source-licenses.yml"
      - "scripts/soundtracks/**"
  schedule:
    # Independently run bounded rights/FFmpeg checks hourly, staggered from the bootstrap.
    # The bootstrap concurrently verifies real R2 playback; this run never scrapes FMA/Musopen.
    # Scheduled GitHub Actions times are approximate.
    - cron: "19 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect candidates without downloading or changing production
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A read-only PR/push smoke must never cancel or displace a real scheduled
  # license-and-R2 apply run. Production writers still share the same lock
  # with bootstrap and historical-policy reconsideration.
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && format('source-license-soundtrack-ci-{0}', github.ref) || 'source-license-soundtrack-curation' }}
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Never expose the production review credential to code checked out for a PR.
      COVE_SOUNDTRACK_REVIEW_TOKEN: ${{ github.event_name != 'pull_request' && secrets.COVE_SOUNDTRACK_REVIEW_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify curation safety tests
        run: |
          python scripts/soundtracks/test-curate-source-license.py -q
          python scripts/soundtracks/test-commons-structured-credits.py -q
          python scripts/soundtracks/test-verify-production-playback.py -q
          python scripts/soundtracks/test-drain-verified-imports.py -q
      - name: Install and verify FFmpeg tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: Decode synthetic audio and validate FFmpeg measurement output
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i 'sine=frequency=420:duration=6:sample_rate=44100' -c:a libvorbis -q:a 4 /tmp/cove-audio-smoke.ogg -y
          python scripts/soundtracks/measure-audio.py /tmp/cove-audio-smoke.ogg --output /tmp/cove-audio-smoke.json
          python -c 'import json; r=json.load(open("/tmp/cove-audio-smoke.json")); assert r["decodedFully"] and r["durationSeconds"] >= 5 and r["truePeakDbfs"] <= 0'
      - name: Skip safely when no scoped credential is configured
        if: env.COVE_SOUNDTRACK_REVIEW_TOKEN == ''
        run: echo 'Scoped soundtrack-review secret missing; production unchanged.'
      - name: Curate and measure original files
        if: env.COVE_SOUNDTRACK_REVIEW_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          args=(--max-scan 800 --max-tracks 12 --max-triage 80 --max-mib 160 --max-minutes 20 --output soundtrack-curation-receipts.json)
          if [[ '${{ github.event_name }}' == 'schedule' || '${{ inputs.dry_run }}' == 'false' ]]; then
            args+=(--apply --approve-source-license)
          fi
          python scripts/soundtracks/curate-source-license.py "${args[@]}"
      - name: Drain approved R2 originals and verify public byte-range playback
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && env.COVE_SOUNDTRACK_REVIEW_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/soundtracks/drain-verified-imports.py \
            --max-imports 8 --max-minutes 12 --output soundtrack-import-receipts.json
      - name: Preserve non-secret playable import receipts
        if: always() && env.COVE_SOUNDTRACK_REVIEW_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: soundtrack-curation-import-receipts
          path: soundtrack-import-receipts.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload non-secret receipts
        if: always() && env.COVE_SOUNDTRACK_REVIEW_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: soundtrack-curation-receipts
          path: soundtrack-curation-receipts.json
          if-no-files-found: ignore
          retention-days: 14
