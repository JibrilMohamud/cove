name: literary-prepare-outbox
on:
  pull_request:
    paths:
      - "src/lib/literary-prepare-outbox.server.ts"
      - "src/lib/literary-preparation-domain.server.ts"
      - "src/content-processing.worker.ts"
      - "infra/content-budget/0004_literary_handoff_outbox_primary.sql"
      - "scripts/check-literary-prepare-outbox.mjs"
      - ".github/workflows/literary-prepare-outbox.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "src/lib/literary-prepare-outbox.server.ts"
      - "src/lib/literary-preparation-domain.server.ts"
      - "src/content-processing.worker.ts"
      - "infra/content-budget/0004_literary_handoff_outbox_primary.sql"
      - "scripts/check-literary-prepare-outbox.mjs"
      - ".github/workflows/literary-prepare-outbox.yml"
      - "package.json"
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:literary-prepare-outbox
      - run: npm run test:literary-preparation-domain
      - run: npm run test:literary-prepared-projection
      - run: npm run test:content-processing-isolation
      - run: npm run build:content-processing
      - run: npx eslint src/lib/literary-prepare-outbox.server.ts src/lib/literary-preparation-domain.server.ts src/content-processing.worker.ts
      - run: npx prettier --check src/lib/literary-prepare-outbox.server.ts scripts/check-literary-prepare-outbox.mjs
