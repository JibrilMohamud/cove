name: cove-protected-zero-traffic-worker-upload

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/release/zero-traffic-worker-version-fence.mjs
      - scripts/release/zero-traffic-worker-version-fence.test.mjs
      - scripts/release/protected-zero-traffic-worker-upload.mjs
      - scripts/release/protected-zero-traffic-worker-upload.source.test.mjs
      - .github/workflows/cove-protected-zero-traffic-worker-upload.yml
  workflow_dispatch:
    inputs:
      confirm_zero_traffic_only:
        description: "Upload archived version only. No deployments, migrations, customer traffic, rights or payments."
        required: true
        type: boolean
        default: false
      reviewed_source_sha:
        description: "Enter the exact approved main source SHA; any later source drift fails closed."
        required: true
        type: string
        default: "a3fd303da6f7418ceec574e0c158d62fe1245984"

permissions:
  contents: read

concurrency:
  group: cove-exclusive-real-primary-cold-acceptance
  queue: max
  cancel-in-progress: false

jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify immutable traffic pin, resource parity and protected workflow
        run: |
          node --test scripts/release/zero-traffic-worker-version-fence.test.mjs scripts/release/protected-zero-traffic-worker-upload.source.test.mjs
          node --check scripts/release/protected-zero-traffic-worker-upload.mjs
          git diff --check

  upload_archived_only:
    if: ${{ github.repository == 'JibrilMohamud/cove' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_zero_traffic_only == true && inputs.reviewed_source_sha == 'a3fd303da6f7418ceec574e0c158d62fe1245984' }}
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Distinct, manually installed Workers Scripts Write credential.
      # Never reuse the broad CLOUDFLARE_API_TOKEN with D1/Token Admin rights.
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_WORKERS_VERSION_UPLOAD_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_APPROVED_DIAGNOSTIC_SOURCE: ${{ inputs.reviewed_source_sha }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify frozen reviewed source and production version 451 at exactly 100%
        run: node scripts/release/protected-zero-traffic-worker-upload.mjs preflight
      - name: Build reviewed Worker; NO customer release
        run: npm run build:backend
      - name: Upload an INACTIVE version only, never deploy traffic
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- wrangler versions upload \
            --config wrangler.backend.deploy.toml --keep-vars \
            --tag "cove-privacy-diag-${GITHUB_RUN_ID}" \
            --message "Cove reviewed anonymous 503 diagnostic version ${GITHUB_RUN_ID}; NO DEPLOY"
      - name: Verify one archived version, exact binding parity, unchanged 100% production pin
        run: node scripts/release/protected-zero-traffic-worker-upload.mjs verify
      - name: ALWAYS verify no customer Worker traffic or owner activation changed
        if: always()
        run: node scripts/release/protected-zero-traffic-worker-upload.mjs fence
      - name: Archive public identifiers only; no credential, SQL or customer data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-protected-zero-traffic-${{ github.run_id }}
          path: artifacts/protected-zero-traffic-worker-upload/evidence.json
          retention-days: 14
          if-no-files-found: ignore
