name: music-openverse-api-diagnostic-one-time
on:
  push:
    branches:
      - fix/music-openverse-query-compat-20261024
permissions:
  contents: read
jobs:
  inspect-public-search-filters:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Compare public Openverse source/category/license filter behavior
        shell: bash
        run: |
          python - <<'PY'
          import collections,json,time,urllib.parse,urllib.request
          base="https://api.openverse.org/v1/audio/"
          agent={"User-Agent":"CoveOpenLicenseDiagnostic/1.0 (https://cove-puce-theta.vercel.app/help)","Accept":"application/json"}
          probes=[
            ("stats",base+"stats/"),
            ("all-piano",base+"?"+urllib.parse.urlencode({"q":"piano","page":1,"page_size":20})),
            ("source",base+"?"+urllib.parse.urlencode({"q":"piano","source":"wikimedia_audio","page":1,"page_size":20})),
            ("license",base+"?"+urllib.parse.urlencode({"q":"piano","source":"wikimedia_audio","license":"by,by-sa,cc0","page":1,"page_size":20})),
            ("category",base+"?"+urllib.parse.urlencode({"q":"piano","source":"wikimedia_audio","category":"music","page":1,"page_size":20})),
            ("all-filters",base+"?"+urllib.parse.urlencode({"q":"piano","source":"wikimedia_audio","category":"music","license":"by,by-sa,cc0","page":1,"page_size":20})),
            ("general-filters",base+"?"+urllib.parse.urlencode({"q":"piano","category":"music","license":"by,by-sa,cc0","page":1,"page_size":20})),
          ]
          for label,url in probes:
            try:
              req=urllib.request.Request(url,headers=agent)
              with urllib.request.urlopen(req,timeout=20) as response:
                d=json.load(response)
                if label=="stats":
                  names=[{"source":x.get("source_name"),"count":x.get("media_count")} for x in d if isinstance(x,dict) and "wikimedia" in str(x.get("source_name","")).lower()] if isinstance(d,list) else []
                  print(json.dumps({"probe":label,"wikimediaSources":names}))
                else:
                  records=d.get("results",[])
                  sources=collections.Counter(str(x.get("source","")) for x in records)
                  commons=sum("commons.wikimedia.org" in str(x.get("foreign_landing_url","")) for x in records)
                  print(json.dumps({"probe":label,"count":d.get("result_count"),"returned":len(records),"sourceCounts":dict(sources),"commonsLanding":commons}))
            except Exception as error:
              print(json.dumps({"probe":label,"errorType":type(error).__name__,"httpCode":getattr(error,"code",None)}))
            time.sleep(2)
          PY
