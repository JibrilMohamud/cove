name: private-trust-owner-retirement
on:
  pull_request:
    paths:
      - "src/features/fore/publishing-trust.server.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/publication-owner-routing.server.ts"
      - "src/storefront-strangler/canonical-owner-command-gateway.ts"
      - "docs/architecture/canonical-writer-review.json"
      - "scripts/check-retired-private-trust-owner.mjs"
      - ".github/workflows/private-trust-owner-retirement.yml"
permissions: {contents: read}
jobs:
  qa-owner-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-retired-private-trust-owner.mjs
      - run: node scripts/reconcile-canonical-writers.mjs
      - run: npm run typecheck
