name: publish-cloudflare-worker-artifact

on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact approved main SHA required for protected action."
        required: true
        type: string
      confirm_artifact_publish:
        description: "Explicitly approve this protected noncustomer operation."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-cloudflare-worker-artifact
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_artifact_publish == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact approved main source before build and privileged activity
        env:
          EXPECTED_SHA: ${{ inputs.reviewed_main_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build persistence Worker
        run: npm run build:backend
      - name: Publish bundle to artifact branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp backend-dist/worker.js "$tmp/worker.js"
          printf '%s\n' "$GITHUB_SHA" > "$tmp/SOURCE_COMMIT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cloudflare-worker-artifact
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$tmp/worker.js" ./worker.js
          cp "$tmp/SOURCE_COMMIT" ./SOURCE_COMMIT
          git add worker.js SOURCE_COMMIT
          git commit -m "Build persistence Worker $GITHUB_SHA"
          git push origin HEAD:cloudflare-worker-artifact --force
