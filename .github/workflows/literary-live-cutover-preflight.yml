name: literary-live-cutover-preflight
on:
  pull_request:
    paths:
      - ".github/workflows/literary-live-cutover-preflight.yml"
      - "scripts/staging/audit-literary-cutover-preflight.mjs"
      - "scripts/check-literary-live-cutover-preflight.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-live-cutover-preflight.yml"
      - "scripts/staging/audit-literary-cutover-preflight.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-primary-readonly-cutover
  cancel-in-progress: false
jobs:
  no-credentials-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/audit-literary-cutover-preflight.mjs
      - run: node scripts/check-literary-live-cutover-preflight.mjs
  protected-live-readonly-audit:
    needs: no-credentials-static-validation
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Audit primary and independent literary domain without any write
        run: node scripts/staging/audit-literary-cutover-preflight.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: literary-production-readonly-cutover-${{ github.sha }}
          path: artifacts/literary-cutover/live-readonly-preflight.json
          if-no-files-found: warn
          retention-days: 30
