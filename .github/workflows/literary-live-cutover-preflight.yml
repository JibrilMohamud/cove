name: literary-live-cutover-preflight
on:
  pull_request:
    paths:
      - ".github/workflows/literary-live-cutover-preflight.yml"
      - "scripts/staging/audit-literary-cutover-preflight.mjs"
      - "scripts/staging/literary-cutover-readonly-credentials.mjs"
      - "scripts/staging/literary-cutover-readonly-credentials.test.mjs"
      - "scripts/check-literary-live-cutover-preflight.mjs"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main commit; changes fail closed."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Authorize protected Cloudflare action; not automatic on merge."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cove-literary-primary-readonly-cutover
  cancel-in-progress: false
jobs:
  no-credentials-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/audit-literary-cutover-preflight.mjs
      - run: node --test scripts/staging/literary-cutover-readonly-credentials.test.mjs
      - run: node scripts/check-literary-live-cutover-preflight.mjs
  protected-live-readonly-audit:
    needs: no-credentials-static-validation
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_CF_PRODUCTION_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_PRODUCTION_AUDIT_READ_TOKEN }}
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_WORKERS_VERSION_UPLOAD_TOKEN: ${{ secrets.COVE_CF_WORKERS_VERSION_UPLOAD_TOKEN }}
      COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Reject broad token and require four independent scoped Cloudflare readers
        run: node --input-type=module -e 'import {checkedLiteraryCutoverReadOnlyCredentials} from "./scripts/staging/literary-cutover-readonly-credentials.mjs"; checkedLiteraryCutoverReadOnlyCredentials(process.env);'
      - name: Audit primary and independent literary domain without any write
        run: node scripts/staging/audit-literary-cutover-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literary-production-readonly-cutover-${{ github.sha }}
          path: artifacts/literary-cutover/live-readonly-preflight.json
          if-no-files-found: warn
          retention-days: 30
