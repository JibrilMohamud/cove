name: production-cutover-topology-audit

on:
  pull_request:
    paths:
      - "scripts/check-live-production-cutover*.mjs"
      - "scripts/check-production-owner-binding.mjs"
      - "scripts/release/topology-readonly-transport.mjs"
      - "scripts/release/topology-readonly-transport.test.mjs"
      - "scripts/test-production-owner-binding.mjs"
      - ".github/workflows/production-cutover-topology-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/check-live-production-cutover*.mjs"
      - "scripts/check-production-owner-binding.mjs"
      - "scripts/release/topology-readonly-transport.mjs"
      - "scripts/release/topology-readonly-transport.test.mjs"
      - "scripts/test-production-owner-binding.mjs"
      - "wrangler.frontend.production.toml"
      - ".github/workflows/production-cutover-topology-audit.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA; drift refuses live metadata reads."
        type: string
        required: true
      confirm_readonly_topology_audit:
        description: "Authorize fixed read-only Worker/routing metadata requests."
        type: boolean
        required: true
        default: false
      release_gate:
        description: "Fail closed and report that complete external release certification remains required"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify no new canonical writers and test topology safety policy
        run: |
          node --check scripts/check-live-production-cutover.mjs
          node --test scripts/check-live-production-cutover.test.mjs
          node --test scripts/release/topology-readonly-transport.test.mjs
          node scripts/test-production-owner-binding.mjs
          node scripts/check-canonical-writer-closure.mjs --no-new-writers

  live-cloudflare:
    needs: static
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_readonly_topology_audit == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 8
    env:
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_WORKERS_TOPOLOGY_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_TOPOLOGY_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_ZONE_ID: "07e218b2e74bc522122e0994b8e37576"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Refuse source drift and missing independent readers
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.reviewed_main_sha }}"
          test "${#COVE_CF_WORKERS_METADATA_READ_TOKEN}" -ge 20
          test "${#COVE_CF_WORKERS_TOPOLOGY_READ_TOKEN}" -ge 20
          test "$COVE_CF_WORKERS_METADATA_READ_TOKEN" != "$COVE_CF_WORKERS_TOPOLOGY_READ_TOKEN"
      - name: Run live read-only production topology safety audit
        run: |
          echo "### Production topology safety audit — NOT a release certificate" >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-production-owner-binding.mjs --after-deploy
          if [[ "${{ inputs.release_gate || 'false' }}" == "true" ]]; then
            node scripts/check-live-production-cutover.mjs --release-gate
          else
            node scripts/check-live-production-cutover.mjs --audit
          fi
