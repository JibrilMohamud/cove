name: audio-pipeline-health-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audio-pipeline-health-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe internal Vercel audio service
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
            https://cove-puce-theta.vercel.app/api/fore/audio-pipeline-health
