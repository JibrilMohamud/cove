name: cove-failclosed-error-telemetry-offline
on:
  pull_request:
    branches: [main]
    paths:
      - src/features/fore/failclosed-error-telemetry.ts
      - src/features/fore/api.server.ts
      - scripts/staging/check-failclosed-error-telemetry.test.mjs
      - .github/workflows/cove-failclosed-error-telemetry-offline.yml
permissions:
  contents: read
jobs:
  isolated-nonauthoritative-error-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/staging/check-failclosed-error-telemetry.test.mjs
      - run: npm run build:backend
      - run: npm run typecheck
      - run: git diff --check
