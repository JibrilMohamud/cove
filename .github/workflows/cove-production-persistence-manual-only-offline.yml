name: cove-production-persistence-manual-only-offline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-persistence-backend.yml"
      - ".github/workflows/cove-production-persistence-manual-only-offline.yml"
      - "scripts/release/production-persistence-manual-only.test.mjs"

permissions:
  contents: read

jobs:
  enforce-no-automatic-live-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test scripts/release/production-persistence-manual-only.test.mjs
      - run: git diff --check
