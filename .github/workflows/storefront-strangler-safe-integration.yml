name: storefront-strangler-safe-integration
on:
  pull_request:
    paths:
      - "src/storefront-strangler/**"
      - "scripts/build-storefront-strangler.mjs"
      - "scripts/check-storefront-strangler.mjs"
      - "scripts/test-storefront-strangler-browser.mjs"
      - "scripts/performance/strangler-integrated-acceptance.mjs"
      - "wrangler.storefront-strangler.stage.jsonc"
      - ".github/workflows/storefront-strangler-safe-integration.yml"
      - "docs/architecture/SAFE_THIN_MAIN_INTEGRATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-evaluation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Emit deterministic performance harness formatting corrections
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import prettier from "prettier";
          for (const path of [
            "scripts/performance/strangler-integrated-acceptance.mjs",
            "src/storefront-strangler/synthetic-client.ts",
          ]) {
            const raw = fs.readFileSync(path, "utf8");
            const opts = await prettier.resolveConfig(path);
            const formatted = await prettier.format(raw, { ...opts, filepath: path });
            if (formatted !== raw)
              console.log("COVE_FORMAT " + JSON.stringify({ path, content: encodeURIComponent(formatted) }));
          }
          NODE
      - name: Strict formatting for release harness
        run: npx prettier --check scripts/performance/strangler-integrated-acceptance.mjs src/storefront-strangler/synthetic-client.ts
      - name: Prove config isolation, bearer delegation, primary rights and revocation
        run: node scripts/check-storefront-strangler.mjs
      - name: Protect current checkout, reader and legal rights
        run: |
          npm run test:rights
          npm run test:commerce
      - name: Ensure dependency-only integration cannot trigger production backend deploy
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const raw = fs.readFileSync(".github/workflows/deploy-persistence-backend.yml", "utf8");
          const push = raw.split("  push:")[1]?.split("  workflow_dispatch:")[0] || "";
          assert.ok(push.includes("src/persistence-backend.worker.ts"));
          assert.ok(!push.includes('"package-lock.json"'));
          assert.ok(!push.includes('".github/workflows/deploy-persistence-backend.yml"'));
          console.log("PASS: dependency-only main merge cannot auto-deploy persistence.");
          NODE
      - name: Install Chromium for progressive interaction QA
        run: npx playwright install --with-deps chromium
      - name: Verify interactive catalog, search, locale, discovery and CORE fallbacks
        run: node scripts/test-storefront-strangler-browser.mjs
      - name: Compile isolated Worker without application dependencies
        run: node scripts/build-storefront-strangler.mjs
      - name: Typecheck all source without changing production build
        run: npm run typecheck
      - name: Dry-run non-routable stage only (never publish)
        env:
          CLOUDFLARE_SEND_METRICS: "false"
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.storefront-strangler.stage.jsonc

  hosted-acceptance:
    needs: isolated-evaluation-only
    # Only the reviewed same-repository release candidate may receive a
    # scoped Cloudflare token. Forked PRs and other branches cannot deploy.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 253 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/fast-storefront-live-parity-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for deployed stage mobile-LCP measurements
        run: npx playwright install --with-deps chromium
      - name: Build immutable, isolated interactive Worker
        run: node scripts/build-storefront-strangler.mjs
      - name: Independently verify 3 cold, 1/4/8/16/32 and 100 RPS
        run: node scripts/performance/strangler-integrated-acceptance.mjs
      - name: Preserve failed and successful raw measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-strangler-acceptance-${{ github.sha }}
          path: artifacts/strangler-acceptance/results.json
          retention-days: 30
          if-no-files-found: warn
# No production route, production database, scheduled job, or migration.
