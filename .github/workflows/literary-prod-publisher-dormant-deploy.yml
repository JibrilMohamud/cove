name: literary-prod-publisher-dormant-deploy
on:
  pull_request:
    paths:
      - "wrangler.literary-publisher.prod-disabled.jsonc"
      - "src/literary-inference-publisher.worker.ts"
      - "src/lib/literary-isolated-inference.server.ts"
      - "scripts/build-literary-inference-publisher.mjs"
      - "scripts/check-literary-dormant-publisher-config.mjs"
      - "scripts/staging/verify-literary-publisher-disabled.mjs"
      - ".github/workflows/literary-prod-publisher-dormant-deploy.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main commit; changes fail closed."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Authorize protected Cloudflare action; not automatic on merge."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cove-literary-dormant-publisher
  cancel-in-progress: false
jobs:
  static-disabled-config:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/verify-literary-publisher-disabled.mjs
      - run: node scripts/check-literary-dormant-publisher-config.mjs
  deploy-no-routes-no-secrets:
    needs: static-disabled-config
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_PROD_MAINTENANCE_TOKEN }}
      COVE_CF_STAGE_D1_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_D1_READ_TOKEN }}
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Independently verify temporary exact-Worker production maintenance authorization
        env:
          COVE_CF_PROD_MAINTENANCE_TOKEN: ${{ secrets.COVE_CF_PROD_MAINTENANCE_TOKEN }}
          COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
        run: node scripts/release/verify-temporary-worker-maintenance.mjs literary-publisher
      - name: Reject reused or missing dormant publisher principals
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$COVE_CF_STAGE_D1_READ_TOKEN"
          test -n "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
          test "$CLOUDFLARE_API_TOKEN" != "$COVE_CF_STAGE_D1_READ_TOKEN"
          test "$CLOUDFLARE_API_TOKEN" != "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
          test "$COVE_CF_STAGE_D1_READ_TOKEN" != "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
      - run: node scripts/check-literary-publisher-gateway.mjs
      - name: Reject cutover-in-progress before dormant publisher deployment
        run: node scripts/staging/verify-literary-publisher-disabled.mjs pre
      - run: node scripts/build-literary-inference-publisher.mjs
      - name: Deploy private disabled literary publisher
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.literary-publisher.prod-disabled.jsonc
      - name: Verify no public ingress, schedules, tokens or processing
        run: node scripts/staging/verify-literary-publisher-disabled.mjs post
