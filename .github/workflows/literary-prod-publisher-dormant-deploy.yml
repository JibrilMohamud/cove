name: literary-prod-publisher-dormant-deploy
on:
  pull_request:
    paths:
      - "wrangler.literary-publisher.prod-disabled.jsonc"
      - "src/literary-inference-publisher.worker.ts"
      - "src/lib/literary-isolated-inference.server.ts"
      - "scripts/build-literary-inference-publisher.mjs"
      - "scripts/check-literary-dormant-publisher-config.mjs"
      - "scripts/staging/verify-literary-publisher-disabled.mjs"
      - ".github/workflows/literary-prod-publisher-dormant-deploy.yml"
  push:
    branches: [main]
    paths:
      - "wrangler.literary-publisher.prod-disabled.jsonc"
      - "src/literary-inference-publisher.worker.ts"
      - "scripts/check-literary-dormant-publisher-config.mjs"
      - ".github/workflows/literary-prod-publisher-dormant-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-dormant-publisher
  cancel-in-progress: false
jobs:
  static-disabled-config:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/verify-literary-publisher-disabled.mjs
      - run: node scripts/check-literary-dormant-publisher-config.mjs
  deploy-no-routes-no-secrets:
    needs: static-disabled-config
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-publisher-gateway.mjs
      - name: Reject cutover-in-progress before dormant publisher deployment
        run: node scripts/staging/verify-literary-publisher-disabled.mjs pre
      - run: node scripts/build-literary-inference-publisher.mjs
      - name: Deploy private disabled literary publisher
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.literary-publisher.prod-disabled.jsonc
      - name: Verify no public ingress, schedules, tokens or processing
        run: node scripts/staging/verify-literary-publisher-disabled.mjs post
