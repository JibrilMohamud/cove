name: production-external-preflight
on:
  pull_request:
    paths:
      - "scripts/check-production-external-preflight.mjs"
      - "scripts/check-production-external-preflight.test.mjs"
      - ".github/workflows/production-external-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enforce legal-owner, Stripe and D1 exclusive-writer prerequisites
        run: node scripts/check-production-external-preflight.test.mjs
  inspect-live-dependencies:
    needs: fail-closed-unit
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-readonly-audit
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STRIPE_LIVE_RESTRICTED_READ_KEY: ${{ secrets.STRIPE_LIVE_RESTRICTED_READ_KEY }}
      COVE_STRIPE_WEBHOOK_URL: "https://www.covereads.com/api/fore/stripe/webhook"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit every deployed Worker binding and LIVE Stripe webhook, without mutations
        run: node scripts/check-production-external-preflight.mjs --live
      - name: Scope of successful preflight
        if: success()
        run: |
          echo "This verifies only external Cloudflare/Stripe configuration, NOT legal rights, live payment/refund, rollback or geographic performance certification." >> "$GITHUB_STEP_SUMMARY"
