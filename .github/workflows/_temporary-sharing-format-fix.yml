name: temporary-sharing-format-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'Temporarily format sharing fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format and commit
        run: |
          npx prettier --write src/features/fore/Reader.tsx src/features/fore/Sharing.tsx src/features/fore/Collections.tsx src/features/fore/social.server.ts scripts/check-reader-sharing-offline.mjs scripts/check-sharing-erasure.mjs scripts/check-social-reading-ecosystem.mjs scripts/browser-qa/sharing.spec.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fore/Reader.tsx src/features/fore/Sharing.tsx src/features/fore/Collections.tsx src/features/fore/social.server.ts scripts/check-reader-sharing-offline.mjs scripts/check-sharing-erasure.mjs scripts/check-social-reading-ecosystem.mjs scripts/browser-qa/sharing.spec.mjs
          git commit -m "Temporarily format sharing fixes"
          git push
