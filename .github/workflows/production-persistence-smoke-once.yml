name: production-persistence-smoke-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-persistence-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Cove production and Worker edge
        shell: bash
        run: |
          set -euo pipefail
          public="https://cove-puce-theta.vercel.app/api/fore/health/ready"
          backend="https://cove-persistence-backend.cove-jibrilmohamud.workers.dev/__cove/health"

          probe () {
            name="$1"
            url="$2"
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors               -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            {
              echo "=== $name ==="
              echo "status=$status"
              cat "$headers"
              echo "--- body ---"
              head -c 5000 "$body"
              echo
            } >> smoke.txt
          }

          probe public "$public"
          probe backend-unauthenticated "$backend"
          cat smoke.txt

          public_status="$(awk '/^=== public ===/{f=1;next} f&&/^status=/{print substr($0,8);exit}' smoke.txt)"
          backend_status="$(awk '/^=== backend-unauthenticated ===/{f=1;next} f&&/^status=/{print substr($0,8);exit}' smoke.txt)"

          # Direct Worker execution should reject missing Cove gateway auth itself with 401.
          test "$backend_status" = "401"
          # The public proxy should be healthy only after the gateway path is working.
          test "$public_status" = "200"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cove-production-persistence-smoke
          path: smoke.txt
          if-no-files-found: error
          retention-days: 1
