name: production-persistence-smoke-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-persistence-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Cove persistence cutover
        shell: bash
        run: |
          set -euo pipefail
          base="https://cove-puce-theta.vercel.app"
          hh="$(mktemp)"; hb="$(mktemp)"
          ch="$(mktemp)"; cb="$(mktemp)"

          curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
            -D "$hh" -o "$hb" "$base/api/fore/health/ready"

          curl --fail-with-body --silent --show-error --retry 4 --retry-all-errors \
            -D "$ch" -o "$cb" "$base/api/fore/catalog?page=1"

          echo "=== health headers ==="
          cat "$hh"
          echo "=== health body ==="
          cat "$hb"
          echo
          echo "=== catalog headers ==="
          cat "$ch"
          echo "=== catalog prefix ==="
          head -c 2000 "$cb"
          echo

          grep -qi '^x-cove-persistence: remote-d1-r2' "$hh"
          grep -qi '^x-cove-persistence: remote-d1-r2' "$ch"

          node --input-type=module - "$hb" "$cb" <<'NODE'
          import fs from "node:fs";
          const [healthPath, catalogPath] = process.argv.slice(2);
          const health = JSON.parse(fs.readFileSync(healthPath, "utf8"));
          const catalog = JSON.parse(fs.readFileSync(catalogPath, "utf8"));
          if (health.database !== true) throw new Error("D1 health is not true");
          if (health.objectStorage !== true) throw new Error("R2 health is not true");
          if (!Array.isArray(catalog.results)) throw new Error("Catalog results missing");
          NODE
