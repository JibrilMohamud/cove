name: production-persistence-smoke-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-persistence-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Cove production persistence
        shell: bash
        run: |
          set -euo pipefail
          base="https://cove-puce-theta.vercel.app"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --retry 2 --retry-all-errors             -D "$headers" -o "$body" -w '%{http_code}'             "$base/api/fore/health/ready")"
          {
            echo "status=$status"
            echo "=== headers ==="
            cat "$headers"
            echo "=== body ==="
            head -c 5000 "$body"
            echo
          } | tee smoke.txt
          test "$status" = "200"
          grep -qi '^x-cove-persistence: remote-d1-r2' "$headers"
          node --input-type=module - "$body" <<'NODE'
          import fs from "node:fs";
          const health = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (health.database !== true) throw new Error("Health response is not backed by D1");
          NODE

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cove-production-persistence-smoke
          path: smoke.txt
          if-no-files-found: error
          retention-days: 1
