name: cove-stage-d1-revision-floor-100rps
on:
  push:
    branches: [perf/stage-d1-revision-floor-20261115]
    paths:
      - scripts/staging/causal-triad-stage.worker.mjs
      - scripts/staging/causal-triad-stage.worker.test.mjs
      - scripts/staging/private-causal-triad.worker.mjs
      - scripts/staging/private-causal-triad.worker.test.mjs
      - scripts/staging/run-private-causal-triad.mjs
      - .github/workflows/cove-stage-d1-revision-floor-100rps.yml
permissions:
  contents: read
concurrency:
  group: cove-isolated-causal-catalog-stage-driver
  cancel-in-progress: false
jobs:
  synthetic-minimal-primary-floor:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_ALLOW_SAFE_RESTORE: "1"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Reject unauthorized / nonfixture D1 and corrupted revision
        run: |
          node --test scripts/staging/causal-triad-stage.worker.test.mjs
          node --test scripts/staging/private-causal-triad.worker.test.mjs
          node scripts/reconcile-canonical-writers.mjs
      - name: Reject changed source formatting or invalid runner
        run: |
          node --check scripts/staging/run-private-causal-triad.mjs
          npx prettier --write scripts/staging/causal-triad-stage.worker.mjs scripts/staging/causal-triad-stage.worker.test.mjs scripts/staging/run-private-causal-triad.mjs
          git diff --exit-code -- scripts/staging/causal-triad-stage.worker.mjs scripts/staging/causal-triad-stage.worker.test.mjs scripts/staging/run-private-causal-triad.mjs
      - name: Require protected staging credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Measure one-row D1 1-32 bursts, 50RPS and two strict 100RPS phases
        run: node scripts/staging/run-private-causal-triad.mjs --revision-only-100rps
      - name: Restore pinned original private driver on EVERY exit
        if: always()
        run: node scripts/staging/run-private-causal-triad.mjs --restore-only
      - name: Archive exact counts, latency tails, failures and rollback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-synthetic-d1-revision-floor-${{ github.run_id }}
          path: artifacts/causal-triad-stage/
          if-no-files-found: ignore
          retention-days: 14
