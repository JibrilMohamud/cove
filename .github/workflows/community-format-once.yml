name: Temporary Community formatter
on:
  push:
    branches:
      - feat/community-reading-room-redesign-2026-11-01
    paths:
      - .github/workflows/community-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Apply repository Prettier
        run: npx prettier --write src/features/fore/CommunityArena.tsx src/features/fore/community-arena-experience.css src/features/fore/social.server.ts scripts/check-community-arena.mjs
      - name: Commit formatting only
        run: |
          git diff --check
          if git diff --quiet -- src/features/fore/CommunityArena.tsx src/features/fore/community-arena-experience.css src/features/fore/social.server.ts scripts/check-community-arena.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/fore/CommunityArena.tsx src/features/fore/community-arena-experience.css src/features/fore/social.server.ts scripts/check-community-arena.mjs
          git commit -m "style(community): apply repository Prettier formatting"
          git push origin HEAD:refs/heads/feat/community-reading-room-redesign-2026-11-01
