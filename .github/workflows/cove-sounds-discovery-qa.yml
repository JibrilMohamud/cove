name: cove-sounds-discovery-qa
on:
  pull_request:
    paths:
      - "src/features/fore/CoveSounds.tsx"
      - "src/features/fore/cove-sounds-snapshot.server.ts"
      - "src/features/fore/cove-sounds-analytics.server.ts"
      - "src/features/fore/cove-sounds-attribution.ts"
      - "src/features/fore/Commerce.tsx"
      - "src/features/fore/commerce.server.ts"
      - "scripts/check-cove-sounds-verified-attribution.mjs"
      - "scripts/staging/report-cove-sounds-verified-conversion.mjs"
      - "drizzle/0082_cove_sounds_verified_purchase_attribution.sql"
      - "src/storefront-strangler/sounds-publication.worker.ts"
      - "scripts/check-cove-sounds-snapshot.mjs"
      - "src/features/fore/social.server.ts"
      - "scripts/browser-qa/sounds-discovery.spec.mjs"
      - "src/features/fore/cove-sounds.css"
      - "src/features/fore/cove-sounds-stations.ts"
      - "src/features/fore/App.tsx"
      - "src/routeTree.gen.ts"
      - "src/routes/sounds.tsx"
      - "src/routes/sounds_.$slug.tsx"
      - "scripts/check-cove-sounds-discovery.mjs"
      - "scripts/staging/check-cove-sounds-public.mjs"
      - ".github/workflows/cove-sounds-discovery-qa.yml"
  push:
    branches: [main]
    paths:
      - "src/features/fore/CoveSounds.tsx"
      - "src/features/fore/cove-sounds-snapshot.server.ts"
      - "src/features/fore/cove-sounds-analytics.server.ts"
      - "src/features/fore/cove-sounds-attribution.ts"
      - "src/features/fore/Commerce.tsx"
      - "src/features/fore/commerce.server.ts"
      - "scripts/check-cove-sounds-verified-attribution.mjs"
      - "scripts/staging/report-cove-sounds-verified-conversion.mjs"
      - "drizzle/0082_cove_sounds_verified_purchase_attribution.sql"
      - "src/storefront-strangler/sounds-publication.worker.ts"
      - "scripts/check-cove-sounds-snapshot.mjs"
      - "src/features/fore/social.server.ts"
      - "scripts/browser-qa/sounds-discovery.spec.mjs"
      - "src/features/fore/cove-sounds.css"
      - "src/features/fore/cove-sounds-stations.ts"
      - "src/features/fore/App.tsx"
      - "src/routes/sounds.tsx"
      - "src/routes/sounds_.$slug.tsx"
      - "scripts/check-cove-sounds-discovery.mjs"
      - "scripts/staging/check-cove-sounds-public.mjs"
      - ".github/workflows/cove-sounds-discovery-qa.yml"
permissions:
  contents: read
concurrency:
  group: cove-sounds-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  rights-boundaries-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Enforce Cove Sounds discovery rights and no-auto-play boundaries
        run: |
          node scripts/check-cove-sounds-discovery.mjs
          node scripts/check-cove-sounds-snapshot.mjs
          node scripts/check-cove-sounds-verified-attribution.mjs
          node scripts/staging/report-cove-sounds-verified-conversion.mjs --self-test
      - name: Compile and verify all route and client imports
        run: npm run build
      - name: Verify live public Cove Sounds station and authorized isolated data
        run: node scripts/staging/check-cove-sounds-public.mjs
