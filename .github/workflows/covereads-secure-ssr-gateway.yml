name: covereads-secure-ssr-gateway
on:
  pull_request:
    paths:
      - "scripts/check-covereads-canary-deny.mjs"
      - "scripts/check-staging-auth-gateway.mjs"
      - "scripts/check-covereads-owned-canary-live.mjs"
      - "scripts/covereads-owned-canary-domain.mjs"
      - "src/cloudflare/staging-auth-gateway.mjs"
      - "wrangler.staging-auth-gateway.test.toml"
      - "wrangler.frontend.production.toml"
      - "wrangler.frontend.staging.toml"
      - "scripts/check-cloudflare-production-candidate.mjs"
      - "scripts/check-cloudflare-ssr-stage-gate.mjs"
      - ".github/workflows/covereads-secure-ssr-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cove-private-asset-stage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify gate source and production remains disabled
        run: |
          node scripts/check-cloudflare-production-candidate.mjs
          node scripts/check-cloudflare-ssr-stage-gate.mjs
          node scripts/check-staging-auth-gateway.mjs

  isolated-asset-auth:
    needs: source-fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      VERCEL: "0"
      COVE_CLOUDFLARE_SSR_PILOT: "1"
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
      COVE_SSR_PROTECTED_TEST_ORIGIN: "https://cove-asset-auth-gateway.cove-jibrilmohamud.workers.dev"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require isolated deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$COVE_SSR_PROTECTED_TEST_ORIGIN" = "https://cove-asset-auth-gateway.cove-jibrilmohamud.workers.dev"
      - name: Build Cloudflare-native SSR
        run: npm run build
      - name: Deploy private assets Worker and public auth-only gateway
        shell: bash
        run: |
          set -euo pipefail
          # The assets-bound backend must have NO public workers.dev ingress.
          cp wrangler.frontend.staging.toml wrangler.frontend.private.test.toml
          sed -i 's/^name = "cove-storefront-ssr-staging"$/name = "cove-asset-auth-stage"/' wrangler.frontend.private.test.toml
          sed -i 's/^workers_dev = true$/workers_dev = false/' wrangler.frontend.private.test.toml
          grep -q '^name = "cove-asset-auth-stage"$' wrangler.frontend.private.test.toml
          grep -q '^workers_dev = false$' wrangler.frontend.private.test.toml
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.frontend.private.test.toml
          # The public gateway has NO static assets and only a service binding.
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.staging-auth-gateway.test.toml
          COVE_GATE_TEST_BEARER="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$COVE_GATE_TEST_BEARER"
          echo "COVE_GATE_TEST_BEARER=$COVE_GATE_TEST_BEARER" >> "$GITHUB_ENV"
          printf '%s' "$COVE_GATE_TEST_BEARER" | npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put COVE_SSR_STAGING_GATE_KEY --config wrangler.frontend.private.test.toml
          printf '%s' "$COVE_GATE_TEST_BEARER" | npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put COVE_SSR_STAGING_GATE_KEY --config wrangler.staging-auth-gateway.test.toml
          # No HTTP prewarm. The first HTTP will be a counted auth check.
          sleep 30
      - name: Verify missing/forged credential, authorized manifest, denial of mutation and no direct backend
        run: node scripts/check-covereads-canary-deny.mjs
      - name: Attach ONLY protected gateway to owned canary domain
        run: node scripts/covereads-owned-canary-domain.mjs attach
      - name: Verify owned TLS canary cannot expose any anonymous static assets
        run: node scripts/check-covereads-owned-canary-live.mjs
      - name: Strict licensed SSR cold-path check through owned Cloudflare ingress
        shell: bash
        env:
          COVE_SSR_STAGING_ORIGIN: "https://ssr-canary.covereads.com"
        run: |
          set -euo pipefail
          export COVE_SSR_STAGING_GATE_KEY="$COVE_GATE_TEST_BEARER"
          node scripts/check-cloudflare-ssr-staging.mjs
      - name: Strict 1/4/8/16 concurrent licensed SSR check on owned ingress
        shell: bash
        env:
          COVE_SSR_STAGING_ORIGIN: "https://ssr-canary.covereads.com"
        run: |
          set -euo pipefail
          export COVE_SSR_STAGING_GATE_KEY="$COVE_GATE_TEST_BEARER"
          node scripts/performance/cloudflare-concurrency.mjs
      - name: Install Chromium for owned-domain LCP and hydration gate
        run: npx playwright install --with-deps chromium
      - name: Check browser hydration and mobile-4G LCP through owned ingress
        shell: bash
        env:
          COVE_SSR_STAGING_ORIGIN: "https://ssr-canary.covereads.com"
        run: |
          set -euo pipefail
          export COVE_SSR_STAGING_GATE_KEY="$COVE_GATE_TEST_BEARER"
          node scripts/performance/cloudflare-browser.mjs
      - name: Upload owned canary performance evidence even after a failed hard gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covereads-owned-ssr-performance
          path: |
            artifacts/cloudflare-ssr-staging-performance.json
            artifacts/cloudflare-concurrency-performance.json
            artifacts/cloudflare-browser-performance.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Detach owned canary and delete ONLY the two ephemeral test Workers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No token to verify temporary Worker cleanup"
            exit 1
          fi
          # Even if canary security fails, detach custom domain first.
          node scripts/covereads-owned-canary-domain.mjs detach || failures=1
          for name in cove-asset-auth-gateway cove-asset-auth-stage; do
            response="$(curl --retry 3 --retry-delay 2 -sS --max-time 25 -w '\n%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true")"
            code="$(printf '%s' "$response" | tail -n 1)"
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "::error::Ephemeral Worker cleanup failed for $name (HTTP $code)"
              failures=1
            fi
          done
          exit "$failures"
