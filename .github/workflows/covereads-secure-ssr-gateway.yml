name: covereads-secure-ssr-gateway
on:
  pull_request:
    paths:
      - "src/storefront-strangler/**"
      - "scripts/staging/prepare-owned-storefront.mjs"
      - "scripts/staging/isolated-presentation-read*.mjs"
      - "scripts/staging/seed-versioned-presentation.mjs"
      - "scripts/check-owned-storefront-integration.mjs"
      - "scripts/check-isolated-homepage-authority.mjs"
      - "scripts/staging/isolated-membership-profile.mjs"
      - "scripts/staging/owned-storefront-rollback*.mjs"
      - "scripts/performance/visual-cover-fixtures*"
      - "scripts/performance/check-owned-ssr-capacity.mjs"
      - "scripts/performance/check-owned-ssr-capacity.test.mjs"
      - "scripts/performance/*owned-geo*"
      - "scripts/performance/prepare-owned-cold-trial.mjs"
      - "scripts/check-covereads-canary-deny.mjs"
      - "scripts/check-staging-auth-gateway.mjs"
      - "scripts/check-covereads-owned-canary-live.mjs"
      - "scripts/test-staging-empty-catalog-response.mjs"
      - "scripts/check-storefront-thrown-admission.mjs"
      - "scripts/check-storefront-hedged.mjs"
      - "src/lib/staging-empty-catalog-response.ts"
      - "src/storefront-strangler/failure.ts"
      - "scripts/staging/strict-owned-canary-denial*.mjs"
      - "scripts/covereads-owned-canary-domain.mjs"
      - "src/cloudflare/staging-auth-gateway.mjs"
      - "src/server.ts"
      - "src/lib/persistence-backend.ts"
      - "scripts/check-storefront-inflight-metadata.mjs"
      - "scripts/check-storefront-completed-public-metadata.mjs"
      - "scripts/check-storefront-metadata-request-lifetime.mjs"
      - "scripts/check-storefront-request-read-batch.mjs"
      - "scripts/check-storefront-public-display-cache.mjs"
      - "src/features/fore/storefront-*.ts"
      - "src/features/fore/localization.server.ts"
      - "src/features/fore/search.server.ts"
      - "src/features/fore/catalog-model.server.ts"
      - "src/features/fore/Store.tsx"
      - "wrangler.staging-auth-gateway.test.toml"
      - "wrangler.frontend.production.toml"
      - "wrangler.frontend.staging.toml"
      - "scripts/check-cloudflare-production-candidate.mjs"
      - "scripts/check-cloudflare-ssr-stage-gate.mjs"
      - ".github/workflows/covereads-secure-ssr-gateway.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact approved main SHA for this protected staging run."
        required: true
        type: string
      confirm_isolated_stage_only:
        description: "Run only the isolated staging load; never change customer traffic or primary D1."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cove-owned-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify integrated prepared homepage and isolated authority
        run: |
          node scripts/check-isolated-homepage-authority.mjs
          node scripts/check-owned-storefront-integration.mjs
      - name: Verify isolated read-only preparation and provider failure handling
        run: node --test scripts/staging/isolated-presentation-read.test.mjs
      - name: Reject false regional evidence and unsafe geographic measurement requests
        run: node --test scripts/performance/owned-geo.test.mjs
      - name: Verify strict owned canary edge-denial retry contract
        run: node --test scripts/staging/strict-owned-canary-denial.test.mjs scripts/staging/owned-storefront-rollback.test.mjs
      - name: Reject HTTP 200 for staging home without live rights shelf
        run: node scripts/test-staging-empty-catalog-response.mjs
      - name: Distinguish thrown edge quota from genuine D1 7429 overload
        run: node scripts/check-storefront-thrown-admission.mjs
      - name: Prove metadata reads stay owned by each Worker request
        run: |
          node scripts/check-storefront-inflight-metadata.mjs
          node scripts/check-storefront-completed-public-metadata.mjs
          node scripts/check-storefront-metadata-request-lifetime.mjs
          node scripts/check-storefront-request-read-batch.mjs
          node scripts/check-storefront-public-display-cache.mjs
      - name: Classify only verified D1 7429 without exposing exception data
        run: node scripts/check-storefront-hedged.mjs
      - name: Verify gate source and production remains disabled
        run: |
          node scripts/check-cloudflare-production-candidate.mjs
          node scripts/check-cloudflare-ssr-stage-gate.mjs
          node scripts/check-staging-auth-gateway.mjs
          node --test scripts/performance/check-owned-ssr-capacity.test.mjs

  isolated-asset-auth:
    needs: source-fail-closed
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_isolated_stage_only == true &&
      inputs.reviewed_main_sha == github.sha
    concurrency:
      group: cove-exclusive-real-primary-cold-acceptance
      queue: max
      cancel-in-progress: false
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVE_OWNED_PREPARED_ACCEPTANCE: "1"
      VERCEL: "0"
      COVE_CLOUDFLARE_SSR_PILOT: "1"
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN }}
      COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
      COVE_REAL_CATALOG_SNAPSHOT_D1_ID: "15ce2ea3-17f8-4d99-9015-a78a6a3af05d"
      COVE_REAL_CATALOG_SNAPSHOT_D1_NAME: "cove-real-catalog-snapshot-20261125"
      CLOUDFLARE_SEND_METRICS: "false"
      COVE_SSR_PROTECTED_TEST_ORIGIN: "https://cove-asset-auth-gateway.cove-jibrilmohamud.workers.dev"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require exact reviewed main SHA before stage credentials or build
        env:
          EXPECTED_SHA: ${{ inputs.reviewed_main_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require isolated deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$COVE_SSR_PROTECTED_TEST_ORIGIN" = "https://cove-asset-auth-gateway.cove-jibrilmohamud.workers.dev"
      - name: Verify previously populated catalog and retired importer
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/staging/real-catalog-copy-receipt.mjs --verify
      - name: Build Cloudflare-native SSR and shared prepared renderer
        run: |
          npm run build
          node scripts/build-storefront-strangler.mjs
      - name: Deploy isolated typed authority, shared homepage, private application and protected ingress
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging/prepare-owned-storefront.mjs
          trap 'rm -f .owned-*-secrets.json' EXIT
          wr() { npm exec --yes --package=wrangler@4.151.0 -- wrangler "$@"; }
          wr deploy --config wrangler.owned-authority.run.json --secrets-file .owned-authority-secrets.json
          wr deploy --config wrangler.owned-homepage.run.json --secrets-file .owned-homepage-secrets.json
          wr deploy --config wrangler.owned-application.run.json --secrets-file .owned-gate-secrets.json
          wr deploy --config wrangler.owned-gateway.run.json --secrets-file .owned-gate-secrets.json
          # Control-plane settling only; first HTTP remains counted.
          sleep 75
      - name: Verify missing/forged credential, authorized manifest, denial of mutation and no direct backend
        run: node scripts/check-covereads-canary-deny.mjs
      - name: Attach ONLY protected gateway to owned canary domain
        run: node scripts/covereads-owned-canary-domain.mjs attach
      - name: Verify owned TLS canary cannot expose any anonymous static assets
        id: owned-security
        run: node scripts/check-covereads-owned-canary-live.mjs
      - name: Pin every isolated serving version before cold redeployments
        run: node scripts/staging/owned-storefront-rollback.mjs capture
      - name: Strict licensed SSR cold-path check through owned Cloudflare ingress
        shell: bash
        env:
          COVE_SSR_STAGING_ORIGIN: "https://ssr-canary.covereads.com"
        run: |
          set -euo pipefail
          export COVE_SSR_STAGING_GATE_KEY="$COVE_GATE_TEST_BEARER"
          node scripts/check-cloudflare-ssr-staging.mjs
      - name: Independently cold-deploy exact 1/4/8/16/32 concurrency bursts
        if: ${{ !cancelled() && steps.owned-security.outcome == 'success' }}
        shell: bash
        env:
          COVE_SSR_STAGING_ORIGIN: "https://ssr-canary.covereads.com"
        run: |
          set -euo pipefail
          failures=0
          for concurrency in 1 4 8 16 32; do
            # Rotation/settling is control-plane-only. The first serving HTTP
            # request(s) form the entire counted cold burst, with no retries.
            if node scripts/performance/prepare-owned-cold-trial.mjs; then
              # GitHub applies GITHUB_ENV only between steps; import only our
              # two exact private variable values without shell evaluation.
              export COVE_SSR_STAGING_GATE_KEY="$(node --input-type=module -e 'import fs from "node:fs";const rows=fs.readFileSync(process.env.GITHUB_ENV,"utf8").trim().split("\n");process.stdout.write(rows.filter(x=>x.startsWith("COVE_SSR_STAGING_GATE_KEY=")).at(-1).split("=")[1])')"
              if ! COVE_OWNED_CAPACITY_MODE=cold-burst COVE_OWNED_COLD_CONCURRENCY="$concurrency" node scripts/performance/check-owned-ssr-capacity.mjs; then
                failures=$((failures + 1))
              fi
            else
              failures=$((failures + 1))
            fi
          done
          test "$failures" -eq 0
      - name: Strict 1/4/8/16/32 and two complete 100-RPS phases on owned ingress
        if: ${{ !cancelled() && steps.owned-security.outcome == 'success' }}
        shell: bash
        env:
          COVE_SSR_STAGING_ORIGIN: "https://ssr-canary.covereads.com"
        run: |
          set -euo pipefail
          export COVE_SSR_STAGING_GATE_KEY="$COVE_GATE_TEST_BEARER"
          node scripts/performance/check-owned-ssr-capacity.mjs
      - name: Install Chromium for owned-domain LCP and hydration gate
        if: ${{ !cancelled() && steps.owned-security.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Repeat actual owned catalog bursts through ORD, LAX, IAD and DFW
        if: ${{ !cancelled() && steps.owned-security.outcome == 'success' }}
        run: node scripts/performance/check-owned-geo.mjs
      - name: Check browser hydration and mobile-4G LCP through owned ingress
        if: ${{ !cancelled() && steps.owned-security.outcome == 'success' }}
        shell: bash
        env:
          COVE_SSR_STAGING_ORIGIN: "https://ssr-canary.covereads.com"
        run: |
          set -euo pipefail
          export COVE_SSR_STAGING_GATE_KEY="$COVE_GATE_TEST_BEARER"
          node scripts/performance/cloudflare-browser.mjs
      - name: Restore pinned isolated serving versions and verify rights path and asset denial
        if: ${{ !cancelled() && steps.owned-security.outcome == 'success' }}
        run: node scripts/staging/owned-storefront-rollback.mjs restore
      - name: Upload owned canary performance evidence even after a failed hard gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covereads-owned-ssr-performance
          path: |
            artifacts/cloudflare-ssr-staging-performance.json
            artifacts/owned-ssr-capacity-performance*.json
            artifacts/cloudflare-browser-performance.json
            artifacts/owned-storefront/
          if-no-files-found: ignore
          retention-days: 14
      - name: Detach owned canary and delete ONLY the four isolated test Workers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::No token to verify temporary Worker cleanup"
            exit 1
          fi
          rm -f .owned-*-secrets.json
          # Even if canary security fails, detach custom domain first.
          node scripts/covereads-owned-canary-domain.mjs detach || failures=1
          for name in cove-asset-auth-gateway cove-asset-auth-stage cove-owned-homepage-stage cove-owned-homepage-authority cove-owned-geo-measurement; do
            response="$(curl --retry 3 --retry-delay 2 -sS --max-time 25 -w '\n%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true")"
            code="$(printf '%s' "$response" | tail -n 1)"
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "::error::Ephemeral Worker cleanup failed for $name (HTTP $code)"
              failures=1
            fi
          done
          exit "$failures"
      - name: Retire run-scoped presentation helper
        if: always()
        run: node scripts/staging/stage-presentation-storage.mjs --cleanup real
