name: security

# CodeQL is managed by GitHub default setup; do not duplicate advanced CodeQL actions here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Secret scan
        run: npm run security:secret-scan
      - name: Static analysis (strict formatting plus legacy-error non-regression)
        run: npm run lint
      - name: Strict TypeScript validation
        run: npm run typecheck
      - name: Vercel preview build cost guard and production-safety regressions
        run: node --test scripts/vercel-ignore-build.test.mjs
      - name: Security/domain regressions
        run: npm run test:security-sync
      - name: Persistence backend regressions
        run: npm run test:persistence-backend
      - name: Reading statistics and audiobook regressions
        run: node scripts/check-reading-statistics.mjs
      - name: ISO currency zero/two/three-decimal regressions
        run: npm run test:currency-minor-units
      - name: Large-library pagination and account-isolation regressions
        run: npm run test:large-library
      - name: Alert recovery and isolated physical restore drill
        run: npm run test:global-ops
      - name: Offline reading, account restoration and reader-safe notifications
        run: npm run test:reader-recovery
      - name: Paginated private account data and cross-user isolation
        run: |
          npm run test:account-pagination
          node scripts/check-revoked-device-registration.mjs
      - name: Full wired-label coverage in all five supported locales
        run: npm run test:localization-coverage
      - name: Reading UI localization and content pipeline behavior
        run: |
          npm run test:ui-localization
          npm run test:content-coverage
          npm run test:storefront-bootstrap
          npm run test:social-reading
          npm run test:stripe-webhooks
      - name: Seven-day licensed EPUB signed-receipt regressions
        run: |
          npm run test:licensed-epub
          node scripts/check-commercial-epub-token-buyer-scope.mjs
          node scripts/check-commercial-epub-asset-scope.mjs
      - name: Notification delivery and opt-out regressions
        run: npm run test:notifications-delivery
      - name: Customer support, status and recovery regressions
        run: npm run test:commercial-experience
      - name: Search, updater and public caching regressions
        run: |
          npm run test:search-updater-cache
          node scripts/check-public-search-count-scope.mjs
          node scripts/check-catalog-ingestion-backpressure.mjs
          node scripts/check-catalog-added-sort-index.mjs
          node scripts/check-taxonomy-presentation-count-cache.mjs
          node scripts/check-taxonomy-count-refresh-lease.mjs
          node scripts/check-sparse-taxonomy-rights-counts.mjs
          node scripts/check-secondary-channel-index.mjs
          node scripts/check-external-identifier-index.mjs
          node scripts/check-live-channel-zero-grant-gate.mjs
          node scripts/check-bounded-cached-rights-recheck.mjs
          node scripts/check-facet-cache-identity.mjs
          npm run test:recommendations
          node scripts/check-literary-genre-rights-query.mjs
      - name: Reader, sharing privacy and offline authorization regressions
        run: npm run test:reader-sharing-offline
      - name: Direct sharing, group discussions and account erasure
        run: npm run test:sharing-erasure
      - name: Hosted BioSync chunk regressions
        run: npm run test:biosync-chunks
      - name: Python audio pipeline syntax
        run: python3 -m py_compile scripts/audio_pipeline/*.py
      - name: Source-license curation safety regression tests
        run: python3 scripts/soundtracks/test-curate-source-license.py -v
      - name: External soundtrack provider rights/QA intake regression tests
        run: python3 scripts/soundtracks/test-external-source-intake.py -v
      - name: Provider-supplied soundtrack release and revocation tests
        run: node scripts/check-soundtrack-external.mjs
      - name: Authorized supplier delivery and resume safety tests
        run: python3 scripts/soundtracks/test-submit-authorized-provider.py -v
      - name: Build
        run: npm run build
      - name: Build persistence backend
        run: npm run build:backend
      - name: CycloneDX SBOM
        run: npm run security:sbom
      - uses: actions/upload-artifact@v4
        with: { name: security-sbom, path: artifacts/sbom.cdx.json, if-no-files-found: error }
  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci && npm run build
      - name: Package build output
        run: tar -czf fore-build.tgz dist .output 2>/dev/null || tar -czf fore-build.tgz dist
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: fore-build.tgz }
