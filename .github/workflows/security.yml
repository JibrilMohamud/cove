name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Secret scan
        run: npm run security:secret-scan
      - name: Static analysis and type safety
        run: npm run lint && npm run typecheck
      - name: Security/domain regressions
        run: npm run test:security-sync
      - name: Persistence backend regressions
        run: npm run test:persistence-backend
      - name: Python audio pipeline syntax
        run: python3 -m py_compile scripts/audio_pipeline/*.py
      - name: Build
        run: npm run build
      - name: Build persistence backend
        run: npm run build:backend
      - name: CycloneDX SBOM
        run: npm run security:sbom
      - uses: actions/upload-artifact@v7
        with: {name: security-sbom, path: artifacts/sbom.cdx.json, if-no-files-found: error}
  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci && npm run build
      - name: Package build output
        run: tar -czf fore-build.tgz dist .output 2>/dev/null || tar -czf fore-build.tgz dist
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: fore-build.tgz}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/analyze@v3
