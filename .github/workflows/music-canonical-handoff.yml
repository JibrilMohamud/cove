name: music-canonical-handoff
on:
  pull_request:
    paths:
      - "drizzle/0080_music_supply_handoff.sql"
      - "src/lib/music-canonical-handoff.ts"
      - "src/persistence-backend.worker.ts"
      - "scripts/check-music-canonical-handoff.mjs"
      - "scripts/check-music-canonical-replay.mjs"
      - "scripts/music-supply/replay-music-supply-handoff.mjs"
      - ".github/workflows/music-canonical-handoff.yml"
permissions:
  contents: read
jobs:
  strict-nonplayable-canonical-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-music-canonical-handoff.mjs
      - run: node scripts/check-music-canonical-replay.mjs
      - run: npm run typecheck
      - run: npm run test:rights
      - run: npm run test:soundtracks
      - run: npx eslint src/lib/music-canonical-handoff.ts scripts/check-music-canonical-handoff.mjs scripts/check-music-canonical-replay.mjs scripts/music-supply/replay-music-supply-handoff.mjs
      - run: npx prettier --check src/lib/music-canonical-handoff.ts scripts/check-music-canonical-handoff.mjs scripts/check-music-canonical-replay.mjs scripts/music-supply/replay-music-supply-handoff.mjs
