name: literary-budget-settlement
on:
  pull_request:
    paths:
      - "src/lib/literary-budget-settlement.ts"
      - "src/lib/literary-job-settlement.server.ts"
      - "src/lib/literary-isolated-inference.server.ts"
      - "infra/content-budget/0009_job_settlements_and_ai_usage.sql"
      - "scripts/check-literary-job-settlement.mjs"
      - "src/features/fore/literary-profiles.server.ts"
      - "scripts/check-literary-budget-settlement.mjs"
      - ".github/workflows/literary-budget-settlement.yml"
      - "package.json"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:literary-budget-settlement
      - run: node scripts/check-literary-job-settlement.mjs
      - run: npm run test:literary-profiles
      - run: npx eslint src/lib/literary-budget-settlement.ts src/lib/literary-job-settlement.server.ts src/features/fore/literary-profiles.server.ts src/lib/literary-isolated-inference.server.ts scripts/check-literary-job-settlement.mjs
      - run: npx prettier --check src/lib/literary-budget-settlement.ts src/lib/literary-job-settlement.server.ts src/features/fore/literary-profiles.server.ts src/lib/literary-isolated-inference.server.ts scripts/check-literary-budget-settlement.mjs scripts/check-literary-job-settlement.mjs
