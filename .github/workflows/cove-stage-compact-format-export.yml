name: cove-private-compact-format-export
on:
  push:
    branches: [perf/stage-single-authority-catalog-20261114]
    paths: [.github/workflows/cove-stage-compact-format-export.yml]
permissions: { contents: read }
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Emit exact project-format-only diff for safe source updates
        run: |
          npx prettier --write src/features/fore/search.server.ts src/features/fore/api.server.ts scripts/staging/check-single-authority-catalog-stage.mjs
          node --input-type=module - <<'NODE'
          import { execFileSync } from "node:child_process";
          const diff = execFileSync("git", ["diff", "--", "src/features/fore/search.server.ts", "src/features/fore/api.server.ts", "scripts/staging/check-single-authority-catalog-stage.mjs"], { encoding: "utf8" });
          console.log("__COVE_COMPACT_PRETTIER_DIFF_START__" + Buffer.from(diff).toString("base64") + "__COVE_COMPACT_PRETTIER_DIFF_END__");
          NODE
