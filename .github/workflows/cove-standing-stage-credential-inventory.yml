name: cove-standing-stage-credential-inventory
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/release/audit-standing-stage-credential*'
      - 'infra/detached-staging-resources.json'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact current reviewed main SHA
        required: true
        type: string
      require_zero:
        description: Fail if any legacy or unresolved computed secret dependency remains
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test scripts/release/audit-standing-stage-credential.test.mjs
      - run: node scripts/release/audit-standing-stage-credential.mjs
      - name: Require zero source dependencies (not hosted or physical certification)
        if: github.event_name == 'workflow_dispatch' && inputs.require_zero == true
        env:
          EXPECTED: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          node scripts/release/audit-standing-stage-credential.mjs --require-zero
