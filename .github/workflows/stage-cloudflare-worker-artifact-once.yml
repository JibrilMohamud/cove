name: stage-cloudflare-worker-artifact-once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage-cloudflare-worker-artifact-once.yml

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stage verified Worker artifact into private R2
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors -X POST https://cove-artifact-stager.cove-jibrilmohamud.workers.dev/stage-d4c75f08)
          echo "$response"
          echo "$response" | grep -F '"ok":true'
          echo "$response" | grep -F '"sourceCommit":"d4c75f084ae2667f46d9e9d87d3bad5b12e6f485"'
