name: cove-protected-real-rights-spot-readonly
on:
  push:
    branches: [audit/protected-real-rights-spot-20261116]
    paths:
      - scripts/release/check-protected-production-rights-spot.mjs
      - scripts/vercel-ignore-build.mjs
      - scripts/check-vercel-one-shot-audit-no-deploy.mjs
      - .github/workflows/cove-protected-real-rights-spot-readonly.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cove-protected-real-rights-spot-readonly.yml
      - scripts/release/check-protected-production-rights-spot.mjs
      - scripts/release/protected-d1-read-throttle.mjs
      - scripts/release/protected-d1-read-throttle.test.mjs
      - scripts/release/protected-rights-witness-policy.mjs
      - scripts/release/protected-rights-witness-policy.test.mjs
      - docs/architecture/protected-production-rights-spot-audit-runbook.md
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RIGHTS_SPOT_AUDIT to request protected 8-allow + 4-suspended + 4-territory-denied rights check"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cove-protected-primary-d1-legal-audit
  cancel-in-progress: false
jobs:
  offline-safety:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check scripts/release/check-protected-production-rights-spot.mjs
      - name: Prove exact-pinned audit-only merge skips storefront redeployment, no other commit does
        run: node --no-warnings scripts/check-vercel-one-shot-audit-no-deploy.mjs
      - name: Fail-closed read-only and protected invocation self-tests
        run: node --no-warnings scripts/release/check-protected-production-rights-spot.mjs --self-test
      - name: Prove global D1 request pacing, Retry-After, and overload fail closed
        run: node --test scripts/release/protected-d1-read-throttle.test.mjs
      - name: Prove real suspended-grant denial witnesses cannot be omitted or counted as allowed
        run: node --test scripts/release/protected-rights-witness-policy.test.mjs
      - run: git diff --check
  protected-live-audit:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'RIGHTS_SPOT_AUDIT'
    needs: [offline-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cove-production-release-audit
    steps:
      # Secrets are available only after GitHub authorizes this environment.
      # Keep the credential OUT of checkout, npm ci, and general job env.
      - name: Require protected Cloudflare D1 Read token before running any dependencies
        shell: bash
        env:
          COVE_CF_PRODUCTION_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_PRODUCTION_AUDIT_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COVE_CF_PRODUCTION_AUDIT_READ_TOKEN:-}" ]; then
            echo "::error title=Missing protected D1 Read token::Configure COVE_CF_PRODUCTION_AUDIT_READ_TOKEN as a GitHub Environment secret under cove-production-release-audit; use a least-privilege Cloudflare D1 Read token. No rights were checked."
            exit 1
          fi
          if [ "${#COVE_CF_PRODUCTION_AUDIT_READ_TOKEN}" -lt 20 ]; then
            echo "::error title=Invalid protected D1 Read token::The configured environment secret is too short. Replace it with a valid, D1 Read-only Cloudflare API token. Do not paste tokens in logs."
            exit 1
          fi
          echo "Protected D1 Read credential is present; its value is not printed."
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bounded 8-allow + 4-suspended + 4-AU-territory-denied audit, NO MUTATIONS
        run: node --no-warnings scripts/release/check-protected-production-rights-spot.mjs --live
        env:
          CF_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
          COVE_PRODUCTION_D1_ID: 4bd657ac-8789-403e-a28c-93aba8d0a989
          COVE_PRODUCTION_LEGAL_AUDIT_ONLY: '1'
          COVE_CF_PRODUCTION_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_PRODUCTION_AUDIT_READ_TOKEN }}
