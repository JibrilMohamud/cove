name: cove-public-cache-rights-offline

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/fore/public-api-cache.server.ts"
      - "scripts/check-search-updater-cache.mjs"
      - ".github/workflows/cove-public-cache-rights-offline.yml"

permissions:
  contents: read

jobs:
  cache-rights-privacy:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify immediate cache bypass after mocked rights withdrawal and fixed-only logs
        run: node scripts/check-search-updater-cache.mjs
      - name: Strict source formatting for changed files
        run: npx prettier --check src/features/fore/public-api-cache.server.ts scripts/check-search-updater-cache.mjs
      - name: Strict TypeScript validation
        run: npm run typecheck
