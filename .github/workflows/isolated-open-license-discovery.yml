name: isolated-open-license-discovery

on:
  pull_request:
    paths:
      - "scripts/soundtracks/commons-structured-credits.py"
      - "scripts/soundtracks/discover-openverse-commons.py"
      - "scripts/soundtracks/test-discover-openverse-commons.py"
      - "scripts/soundtracks/test-commons-structured-credits.py"
      - "infra/music/0004_open_catalog_candidates.sql"
      - ".github/workflows/isolated-open-license-discovery.yml"
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cove-isolated-open-discovery
  cancel-in-progress: false

jobs:
  test-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m py_compile scripts/soundtracks/commons-structured-credits.py scripts/soundtracks/discover-openverse-commons.py
      - run: python scripts/soundtracks/test-commons-structured-credits.py -q
      - run: python scripts/soundtracks/test-discover-openverse-commons.py -q

  read-only-candidate-discovery:
    needs: test-no-network
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_MUSIC_OPEN_DISCOVERY_ENABLED: ${{ vars.COVE_MUSIC_OPEN_DISCOVERY_ENABLED }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Query one permitted Openverse page and corroborate exact Commons files
        shell: bash
        run: |
          set -euo pipefail
          args=(--queries 2 --max-verifications 12 --output openverse-commons-candidates.json)
          if [[ "${COVE_MUSIC_OPEN_DISCOVERY_ENABLED:-0}" == "1" ]]; then
            if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
              echo "::error::Opt-in detached discovery missing Cloudflare D1 writer"
              exit 1
            fi
            args+=(--apply-isolated)
          fi
          python scripts/soundtracks/discover-openverse-commons.py "${args[@]}"
      - name: Archive non-publishable source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cove-discovered-open-license-candidates
          path: openverse-commons-candidates.json
          if-no-files-found: ignore
          retention-days: 14
