name: strangler-data-plane-preflight
on:
  pull_request:
    paths:
      - "scripts/staging/check-strangler-data-plane-preflight.mjs"
      - "scripts/staging/check-strangler-synthetic-producer-sql.mjs"
      - "wrangler.storefront-candidate-producer.stage.jsonc"
      - "wrangler.storefront-strangler.stage.jsonc"
      - ".github/workflows/strangler-data-plane-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-stage-resource-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check read-only preflight scripts compile without Cloudflare credentials
        run: |
          node --check scripts/staging/check-strangler-data-plane-preflight.mjs
          node --check scripts/staging/check-strangler-synthetic-producer-sql.mjs
      - name: Prove staging resources cannot reference production D1
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const files = [
            "wrangler.storefront-strangler.stage.jsonc",
            "wrangler.storefront-candidate-producer.stage.jsonc",
          ];
          for (const file of files) {
            const stage = JSON.parse(fs.readFileSync(file, "utf8"));
            assert.equal(stage.d1_databases?.[0]?.database_id, "e4cbb0ef-6288-4fa1-9dbb-fb42fe01d4f3");
            assert.notEqual(stage.d1_databases?.[0]?.database_id, "4bd657ac-8789-403e-a28c-93aba8d0a989");
            assert.equal(stage.workers_dev, false);
            assert.equal(stage.preview_urls, false);
          }
          console.log("PASS: source-only stage identity isolation; no live Cloudflare acceptance claimed.");
          NODE
  verify-existing-isolated-stage-resources:
    needs: verify-static-stage-resource-identities
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_COVE_STRANGLER_DATA_PLANE_PREFLIGHT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check existing isolated D1 R2 and CORE resources using GET only
        run: node scripts/staging/check-strangler-data-plane-preflight.mjs
      - name: Check producer SQL in isolated staging D1 (read-only)
        run: node scripts/staging/check-strangler-synthetic-producer-sql.mjs

# No deploy, auto-provision, mutation, migration, cron, domain or public Worker route.
