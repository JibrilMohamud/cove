name: temporary-sharing-format-diagnostics
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format changed files and print patch
        run: |
          npx prettier --write src/features/fore/Reader.tsx src/features/fore/Sharing.tsx src/features/fore/Collections.tsx src/features/fore/social.server.ts scripts/check-reader-sharing-offline.mjs scripts/check-sharing-erasure.mjs scripts/check-social-reading-ecosystem.mjs scripts/browser-qa/sharing.spec.mjs
          git diff -- src/features/fore/Reader.tsx src/features/fore/Sharing.tsx src/features/fore/Collections.tsx src/features/fore/social.server.ts scripts/check-reader-sharing-offline.mjs scripts/check-sharing-erasure.mjs scripts/check-social-reading-ecosystem.mjs scripts/browser-qa/sharing.spec.mjs
