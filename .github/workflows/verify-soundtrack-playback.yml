name: Verify production soundtrack playback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-soundtrack-playback.yml"
      - "scripts/soundtracks/verify-production-playback.py"
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cove-live-soundtrack-playback-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe real published audio and attribution
        shell: bash
        run: |
          set -euo pipefail
          args=(--sample 12 --output soundtrack-playback-receipt.json)
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            args+=(--strict-target)
          fi
          python scripts/soundtracks/verify-production-playback.py "${args[@]}"
      - name: Keep non-secret live playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundtrack-playback-health
          path: soundtrack-playback-receipt.json
          if-no-files-found: ignore
          retention-days: 30
