name: cove-hardening-oneoff-format
on:
  pull_request:
    paths:
      - ".github/workflows/cove-hardening-oneoff-format.yml"
permissions:
  contents: read
jobs:
  format-hardening-files:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/regional-epub-rights-hash-settlement-20261023'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { ref: fix/regional-epub-rights-hash-settlement-20261023 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/check-literary-budget-settlement.mjs src/lib/literary-budget-settlement.ts scripts/check-regional-epub-asset-repair.mjs src/features/fore/regional-epub-asset-repair.server.ts
      - name: Commit formatting only to hardening branch
        run: |
          if ! git diff --quiet -- scripts/check-literary-budget-settlement.mjs src/lib/literary-budget-settlement.ts scripts/check-regional-epub-asset-repair.mjs src/features/fore/regional-epub-asset-repair.server.ts; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add scripts/check-literary-budget-settlement.mjs src/lib/literary-budget-settlement.ts scripts/check-regional-epub-asset-repair.mjs src/features/fore/regional-epub-asset-repair.server.ts
            git commit -m "style: align defensive EPUB and literary assertions with Prettier"
            git push origin HEAD:refs/heads/fix/regional-epub-rights-hash-settlement-20261023
          fi
