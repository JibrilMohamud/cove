name: one-time browser worker format
on:
  push:
    paths:
      - ".github/workflows/format-service-worker-once.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'JibrilMohamud/cove' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Format service worker with pinned project Prettier
        run: |
          npm exec -- prettier --write public/sw.js drizzle.config.ts vite.config.ts
          npm exec -- prettier --check public/sw.js drizzle.config.ts vite.config.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/sw.js drizzle.config.ts vite.config.ts
          if git diff --cached --quiet; then
            echo "Files already satisfy Prettier."
            exit 0
          fi
          git commit -m "style: apply pinned Prettier to Cove service worker and build configs"
          git push origin HEAD:main
