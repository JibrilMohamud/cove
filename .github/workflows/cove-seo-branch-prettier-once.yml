name: cove-seo-branch-prettier-once
on:
  push:
    branches:
      - perf/seo-version-fenced-count-projection-20261117
    paths:
      - .github/workflows/cove-seo-branch-prettier-once.yml
permissions:
  contents: write
concurrency:
  group: cove-seo-prettier-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format-only:
    if: github.repository == 'JibrilMohamud/cove' && github.ref == 'refs/heads/perf/seo-version-fenced-count-projection-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: perf/seo-version-fenced-count-projection-20261117
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only existing SEO source/test files
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            scripts/check-seo-count-projection.mjs \
            scripts/check-seo-owner-denial-epoch.mjs \
            scripts/check-seo-primary-d1-count-cas.mjs \
            src/features/fore/seo-count-projection-producer.ts \
            src/features/fore/seo-count-projection.ts \
            src/features/fore/seo.server.ts \
            src/storefront-strangler/seo-owner-denial-epoch.ts \
            src/storefront-strangler/seo-owner-denial-read.server.ts \
            src/storefront-strangler/seo-primary-d1-counts.server.ts
      - name: Commit formatting to this non-production draft branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "perf/seo-version-fenced-count-projection-20261117"
          git add -- \
            scripts/check-seo-count-projection.mjs \
            scripts/check-seo-owner-denial-epoch.mjs \
            scripts/check-seo-primary-d1-count-cas.mjs \
            src/features/fore/seo-count-projection-producer.ts \
            src/features/fore/seo-count-projection.ts \
            src/features/fore/seo.server.ts \
            src/storefront-strangler/seo-owner-denial-epoch.ts \
            src/storefront-strangler/seo-owner-denial-read.server.ts \
            src/storefront-strangler/seo-primary-d1-counts.server.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(seo): conform staged count fence files to Prettier baseline'
          git push origin HEAD:refs/heads/perf/seo-version-fenced-count-projection-20261117
# One-shot temporary workflow. Remove after the format commit is verified.
