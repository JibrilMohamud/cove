name: strangler-stage-private-bucket-provision
on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact approved main SHA for one isolated stage bucket."
        type: string
        required: true
      confirm_isolated_stage_bucket:
        description: "Approve one prevalidated private QA R2 bucket, no production D1 mutation."
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: cove-strangler-stage-bucket-provision
  cancel-in-progress: false

jobs:
  provision-strictly-named-staging-bucket:
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_isolated_stage_bucket == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_STAGE_R2_PROVISION_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Provision exact private stage bucket only when absent
        run: node scripts/staging/provision-strangler-private-r2.mjs

# Creates at most one stage-only private R2 bucket. No D1 writes, deployments,
# public R2 access, DNS, routes, worker publication or runtime flag changes.
