name: strangler-stage-private-bucket-provision
on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA; isolated R2 staging only."
        required: true
        type: string
      confirm_isolated_stage_only:
        description: "Approve one named private R2 staging bucket only."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cove-strangler-stage-bucket-provision
  cancel-in-progress: false

jobs:
  provision-strictly-named-staging-bucket:
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.reviewed_main_sha == github.sha &&
      inputs.confirm_isolated_stage_only == true
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      COVE_CF_STAGE_D1_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_D1_READ_TOKEN }}
      COVE_CF_STAGE_R2_BUCKET_PROVISION_TOKEN: ${{ secrets.COVE_CF_STAGE_R2_BUCKET_PROVISION_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Provision exact private stage bucket only when absent
        run: node scripts/staging/provision-strangler-private-r2.mjs

# Creates at most one stage-only private R2 bucket. No D1 writes, deployments,
# public R2 access, DNS, routes, worker publication or runtime flag changes.
