name: strangler-stage-private-bucket-provision
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cove-strangler-stage-bucket-provision
  cancel-in-progress: false

jobs:
  provision-strictly-named-staging-bucket:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_COVE_STAGE_R2_PROVISION_TOKEN }}
    steps:
      - name: Require dedicated scoped Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Dedicated CLOUDFLARE_COVE_STAGE_R2_PROVISION_TOKEN is required; no broad-token fallback."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Provision exact private stage bucket only when absent
        run: node scripts/staging/provision-strangler-private-r2.mjs

# Creates at most one stage-only private R2 bucket. No D1 writes, deployments,
# public R2 access, DNS, routes, worker publication or runtime flag changes.
