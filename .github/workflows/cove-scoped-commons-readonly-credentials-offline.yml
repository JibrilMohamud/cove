name: cove-scoped-commons-readonly-credentials-offline
on:
  pull_request:
    paths:
      - ".github/workflows/isolated-commons-audio-technical-qa.yml"
      - ".github/workflows/isolated-open-license-discovery.yml"
      - "scripts/security/scoped-commons-readonly-credential.test.mjs"
      - ".github/workflows/cove-scoped-commons-readonly-credentials-offline.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/isolated-commons-audio-technical-qa.yml"
      - ".github/workflows/isolated-open-license-discovery.yml"
      - "scripts/security/scoped-commons-readonly-credential.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test scripts/security/scoped-commons-readonly-credential.test.mjs
