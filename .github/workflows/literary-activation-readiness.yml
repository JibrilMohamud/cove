name: literary-activation-readiness
on:
  pull_request:
    paths:
      - "scripts/staging/audit-literary-activation-readiness.mjs"
      - "scripts/check-literary-activation-readiness.mjs"
      - ".github/workflows/literary-activation-readiness.yml"
  push:
    branches: [main]
    paths:
      - "scripts/staging/audit-literary-activation-readiness.mjs"
      - "scripts/check-literary-activation-readiness.mjs"
      - ".github/workflows/literary-activation-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-activation-readonly
  cancel-in-progress: false
jobs:
  static-readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/audit-literary-activation-readiness.mjs
      - run: node scripts/check-literary-activation-readiness.mjs
  protected-activation-readonly:
    needs: static-readonly-contract
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Inspect live worker/budget/lease readiness without writes
        run: node scripts/staging/audit-literary-activation-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literary-activation-readonly-${{ github.sha }}
          path: artifacts/literary-cutover/activation-readonly.json
          if-no-files-found: warn
          retention-days: 30
