name: literary-activation-readiness
on:
  pull_request:
    paths:
      - "scripts/staging/audit-literary-activation-readiness.mjs"
      - "scripts/staging/literary-activation-readonly-auth.mjs"
      - "scripts/check-literary-activation-readiness.mjs"
      - ".github/workflows/literary-activation-readiness.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Approve the exact main SHA before Cloudflare API access."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Explicitly approve this Cloudflare action; never auto-run on source merge."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cove-literary-activation-readonly
  cancel-in-progress: false
jobs:
  static-readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/audit-literary-activation-readiness.mjs
      - run: node --check scripts/staging/literary-activation-readonly-auth.mjs
      - run: node scripts/check-literary-activation-readiness.mjs
  protected-activation-readonly:
    needs: static-readonly-contract
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_PRODUCTION_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_PRODUCTION_AUDIT_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Require independent provider-enforced read-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${#COVE_CF_WORKERS_METADATA_READ_TOKEN}" -ge 20 || { echo "::error::Protected Workers Metadata Read token unavailable"; exit 1; }
          test "${#COVE_CF_PRODUCTION_AUDIT_READ_TOKEN}" -ge 20 || { echo "::error::Protected D1 Read token unavailable"; exit 1; }
      - name: Inspect live worker/budget/lease readiness without writes
        run: node scripts/staging/audit-literary-activation-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literary-activation-readonly-${{ github.sha }}
          path: artifacts/literary-cutover/activation-readonly.json
          if-no-files-found: warn
          retention-days: 30
