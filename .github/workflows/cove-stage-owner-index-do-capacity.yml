name: cove-stage-owner-index-do-capacity
on:
  push:
    branches: [perf/stage-owner-index-do-capacity-20261115]
    paths:
      - src/storefront-strangler/owner-do-capacity.stage.ts
      - src/storefront-strangler/owner-catalog-authorized-set.stage.ts
      - src/storefront-strangler/owner-catalog-incremental-index.stage.ts
      - scripts/staging/prepare-owner-do-capacity.mjs
      - scripts/staging/run-owner-index-do-capacity.mjs
      - scripts/staging/deploy-owner-index-do-capacity.mjs
      - scripts/staging/cleanup-owner-do-capacity.mjs
      - .github/workflows/cove-stage-owner-index-do-capacity.yml
permissions:
  contents: read
concurrency:
  group: cove-isolated-staged-owner-do-capacity
  cancel-in-progress: false
jobs:
  real-owner-sql-isolated-do:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify actual canonical unified legal-owner SQL regressions and staging-only scripts
        run: |
          node scripts/check-commercial-storefront-owner.mjs
          node scripts/check-commercial-legal-authority.mjs
          node scripts/check-market-authority-closure.mjs
          node --check scripts/staging/prepare-owner-do-capacity.mjs
          node --check scripts/staging/run-owner-index-do-capacity.mjs
          node --check scripts/staging/deploy-owner-index-do-capacity.mjs
          node scripts/staging/deploy-owner-index-do-capacity.mjs --self-test
          node --check scripts/staging/cleanup-owner-do-capacity.mjs
          git diff --check
      - name: Require isolated staging deployment token
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Generate isolated run-specific DO namespace, expiring gate and bundled real owner SQL
        run: |
          node scripts/staging/prepare-owner-do-capacity.mjs
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const cfg=JSON.parse(readFileSync("wrangler.owner-do-capacity.generated.jsonc","utf8"));
          assert.equal(cfg.name,"cove-owner-do-capacity-"+process.env.GITHUB_RUN_ID+"-a"+process.env.GITHUB_RUN_ATTEMPT);
          assert.equal(cfg.workers_dev,true);
          assert.equal(cfg.preview_urls,false);
          assert.deepEqual(cfg.routes,[]);
          assert.equal(cfg.d1_databases,undefined);
          assert.equal(cfg.services,undefined);
          assert.equal(cfg.durable_objects.bindings.length,1);
          assert.equal(cfg.durable_objects.bindings[0].class_name,"StageUnifiedOwner");
          assert.ok(Number(cfg.vars.COVE_OWNER_DO_EXPIRES_AT)-Date.now()<900001);
          console.log("PASS: synthetic owner DO has no production database, customer route or persistent gate");
          '
      - name: Deploy fresh expiring, gated, isolated Durable Object
        run: node scripts/staging/deploy-owner-index-do-capacity.mjs
      - name: Strict hosted 1/4/8/16/32, 50RPS and two 100RPS mixed paid/free owner read campaigns
        run: node scripts/staging/run-owner-index-do-capacity.mjs
      - name: Delete run-specific Worker and verify absence even when tests fail
        if: always()
        run: node scripts/staging/cleanup-owner-do-capacity.mjs
      - name: Archive stage-only timing and denial evidence, never secrets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-isolated-owner-index-do-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/owner-do-stage/evidence.json
          retention-days: 14
          if-no-files-found: ignore
