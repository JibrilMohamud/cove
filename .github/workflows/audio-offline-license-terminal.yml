name: audio-offline-license-terminal
on:
  pull_request:
    paths:
      - "drizzle/0088_audio_offline_license_terminal_guard.sql"
      - "scripts/check-audio-offline-license-terminal.mjs"
      - ".github/workflows/audio-offline-license-terminal.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/0088_audio_offline_license_terminal_guard.sql"
      - "scripts/check-audio-offline-license-terminal.mjs"
      - ".github/workflows/audio-offline-license-terminal.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refuse-stale-offline-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run exact canonical audio offline license migration regression
        run: node scripts/check-audio-offline-license-terminal.mjs
      - name: Refuse new unowned rights writers
        run: node scripts/check-canonical-writer-closure.mjs --no-new-writers
