name: production-legal-owner-locked
on:
  pull_request:
    paths:
      - "wrangler.legal-authority.production-locked.jsonc"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/production-disabled-owner-attestation.ts"
      - "scripts/check-production-disabled-owner-attestation.mjs"
      - "src/storefront-strangler/backend-owner-attestation-entrypoint.ts"
      - "scripts/prove-production-owner-handshake.mjs"
      - "scripts/check-locked-production-legal-owner.mjs"
      - ".github/workflows/production-legal-owner-locked.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main commit; changes fail closed."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Authorize protected Cloudflare action; not automatic on merge."
        required: true
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: production-legal-owner-locked
  cancel-in-progress: false

jobs:
  prove-locked-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Confirm production authority is unrouteable, QA-ineligible, and disabled
        run: |
          node scripts/check-locked-production-legal-owner.mjs
          node scripts/check-production-disabled-owner-attestation.mjs
          node scripts/check-canonical-writer-closure.mjs --no-new-writers
          node scripts/check-legal-authority-owner.mjs
          node scripts/check-legal-primary-write-lock.mjs
      - name: Compile production owner from the pinned existing legal authority
        run: node scripts/build-storefront-strangler.mjs
      - name: Dry-run private production owner only
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.legal-authority.production-locked.jsonc

  deploy-locked-owner:
    needs: prove-locked-owner
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "07e218b2e74bc522122e0994b8e37576"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify mandatory disable state again before deployment
        run: node scripts/check-locked-production-legal-owner.mjs
      - run: node scripts/build-storefront-strangler.mjs
      - name: Deploy isolated, unroutable, QA-ineligible production owner
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.legal-authority.production-locked.jsonc
      - name: Verify live disabled binding and original public routing
        run: |
          node scripts/check-locked-production-legal-owner.mjs --live
          node scripts/check-live-production-cutover.mjs --audit
      - name: Summarize scope
        run: |
          echo "Deployed production owner namespace is DISABLED; ONLY a secret-authenticated, nonauthorizing disabled-state challenge may return 200. Rights, payments and delivery operations return 503." >> "$GITHUB_STEP_SUMMARY"
          echo "A verified persistence binding may target this DISABLED owner; positive publishing, public routing and customer cutover remain blocked." >> "$GITHUB_STEP_SUMMARY"
