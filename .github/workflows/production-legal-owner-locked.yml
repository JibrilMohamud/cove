name: production-legal-owner-locked
on:
  pull_request:
    paths:
      - "wrangler.legal-authority.production-locked.jsonc"
      - "scripts/check-locked-production-legal-owner.mjs"
      - ".github/workflows/production-legal-owner-locked.yml"
  push:
    branches: [main]
    paths:
      - "wrangler.legal-authority.production-locked.jsonc"
      - "scripts/check-locked-production-legal-owner.mjs"
      - ".github/workflows/production-legal-owner-locked.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-legal-owner-locked
  cancel-in-progress: false

jobs:
  prove-locked-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Confirm production authority is unrouteable, QA-ineligible, and disabled
        run: |
          node scripts/check-locked-production-legal-owner.mjs
          node scripts/check-canonical-writer-closure.mjs --no-new-writers
          node scripts/check-legal-authority-owner.mjs
          node scripts/check-legal-primary-write-lock.mjs
      - name: Compile production owner from the pinned existing legal authority
        run: node scripts/build-storefront-strangler.mjs
      - name: Dry-run private production owner only
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.legal-authority.production-locked.jsonc

  deploy-locked-owner:
    needs: prove-locked-owner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "07e218b2e74bc522122e0994b8e37576"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify mandatory disable state again before deployment
        run: node scripts/check-locked-production-legal-owner.mjs
      - run: node scripts/build-storefront-strangler.mjs
      - name: Deploy isolated, unroutable, QA-ineligible production owner
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.legal-authority.production-locked.jsonc
      - name: Verify live disabled binding and original public routing
        run: |
          node scripts/check-locked-production-legal-owner.mjs --live
          node scripts/check-live-production-cutover.mjs --audit
      - name: Summarize scope
        run: |
          echo "Deployed production owner namespace is DISABLED; all owner operations return 503." >> "$GITHUB_STEP_SUMMARY"
          echo "No persistence LEGAL_AUTHORITY binding, positive publishing, route, or customer production cutover." >> "$GITHUB_STEP_SUMMARY"
