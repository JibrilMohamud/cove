name: publication-source-isolation-qa
on:
  pull_request:
    paths:
      - "scripts/staging/check-publication-feed-live.mjs"
      - "scripts/staging/publication-source-readiness*.mjs"
      - "scripts/staging/verify-pinned-publication-capture*.mjs"
      - "src/storefront-strangler/publication-capture.server.ts"
      - "src/storefront-strangler/publication-capture.worker.ts"
      - "src/storefront-strangler/publication-feed.server.ts"
      - "src/storefront-strangler/publication-driver.worker.ts"
      - "scripts/check-publication-feed.mjs"
      - "scripts/staging/verify-canonical-readonly-service.mjs"
      - "infra/publication-source/**"
      - "wrangler.publication-capture.stage.jsonc"
      - "wrangler.publication-export.stage.jsonc"
      - ".github/workflows/publication-source-isolation-qa.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA for protected Cloudflare operations"
        type: string
        required: true
      confirm_protected_cloudflare_action:
        description: "Explicitly approve protected staging or production Cloudflare operation"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cove-publication-source-isolation-qa
  cancel-in-progress: false
jobs:
  offline-publication-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-publication-feed.mjs
      - run: node --check scripts/staging/check-publication-feed-live.mjs
      - run: node --test scripts/staging/verify-pinned-publication-capture.test.mjs scripts/staging/publication-source-readiness.test.mjs
  physically-isolated-publication:
    needs: offline-publication-boundary
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN }}
      COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Verify provider-enforced canonical reader before capture
        run: node scripts/staging/verify-canonical-readonly-service.mjs --require-distinct-inventory
      - run: node scripts/build-storefront-strangler.mjs
      - name: Backfill an independent source and publish two fenced R2 generations
        run: node scripts/staging/check-publication-feed-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-source-isolation-${{ github.sha }}
          path: artifacts/publication-feed/
          retention-days: 30
