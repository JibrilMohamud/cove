name: cove-stage-single-authority-format-export
on:
  push:
    branches: [perf/stage-single-authority-catalog-20261114]
    paths: [.github/workflows/cove-stage-format-single-authority-runner.yml]
permissions: { contents: read }
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Capture exact Prettier diff without mutating repository
        run: |
          npx prettier --write scripts/staging/run-single-authority-catalog-ab.mjs
          node --input-type=module - <<'NODE'
          import { execFileSync } from "node:child_process";
          const diff = execFileSync("git", ["diff", "--", "scripts/staging/run-single-authority-catalog-ab.mjs"], { encoding: "utf8" });
          console.log("__COVE_SINGLE_READ_FORMAT_START__" + Buffer.from(diff).toString("base64") + "__COVE_SINGLE_READ_FORMAT_END__");
          NODE
