name: temporary-literary-prepared-import-stage
on:
  push:
    branches:
      - feat/isolated-literary-preparation-20261020
    paths:
      - "scripts/staging/literary-prepared-import-two-d1-smoke.ts"
      - ".github/workflows/temporary-literary-prepared-import-stage.yml"
permissions:
  contents: read
concurrency:
  group: cove-literary-prepared-import-two-d1
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hosted primary authority import, active deny, revocation, cleanup
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Missing Cloudflare staging token"; exit 1; }
          npx esbuild scripts/staging/literary-prepared-import-two-d1-smoke.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=./prepared-import.mjs
          cat > prepared-import.toml <<'EOF'
          name = "cove-prepared-import-smoke-20261020"
          main = "./prepared-import.mjs"
          compatibility_date = "2026-10-09"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "cove-content-repair-stage-20261020"
          database_id = "dbcc0d95-8ca2-4036-ad78-49dbc0ee4b38"
          [[d1_databases]]
          binding = "CONTENT_DB"
          database_name = "cove-literary-budget-stage-20261020"
          database_id = "7a26c27d-966c-468a-a3ad-d06cfff68010"
          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "cove-content-repair-stage-20261020"
          EOF
          cleanup() { npx wrangler delete --config prepared-import.toml --force || true; }
          trap cleanup EXIT
          npx wrangler deploy --config prepared-import.toml
          TOKEN=$(openssl rand -hex 40)
          printf %s "$TOKEN" | npx wrangler secret put SMOKE_TOKEN --config prepared-import.toml
          sleep 6
          BODY=$(curl --retry 5 --retry-all-errors --retry-delay 2 --fail-with-body --silent --show-error --max-time 55 \
            -H "x-smoke-token: $TOKEN" -X POST \
            "https://cove-prepared-import-smoke-20261020.cove-jibrilmohamud.workers.dev/__isolated-import-smoke")
          echo "$BODY"
          node -e 'const r=JSON.parse(process.argv[1]); if(!r.pass || !r.imported || !r.activeDenyBlocked || !r.revokedBlocked)process.exit(1)' "$BODY"
