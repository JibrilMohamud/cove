name: deployed-canonical-d1-principal-audit
on:
  pull_request:
    paths:
      - "scripts/audit-live-canonical-d1-principals.mjs"
      - "scripts/test-live-canonical-d1-principals.mjs"
      - "scripts/check-exclusive-canonical-d1-write-fence.mjs"
      - "src/storefront-strangler/canonical-d1-write-fence.ts"
      - "src/persistence-backend.worker.ts"
      - "docs/architecture/deployed-canonical-d1-baseline.json"
      - "docs/architecture/historical-publication-capture-d1-isolation-20261029.json"
      - "wrangler.content-literary-handoff.prod-disabled.jsonc"
      - "wrangler.content-literary-prepare.prod-disabled.jsonc"
      - ".github/workflows/deployed-canonical-d1-principal-audit.yml"
      - ".github/workflows/covereads-secure-ssr-gateway.yml"
  push:
    branches: [main]
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact main commit SHA to inspect"
        type: string
        required: true
      confirm_readonly_cloudflare_audit:
        description: "Approve complete live read-only Worker and zone route audit"
        type: boolean
        required: true
        default: false
      release_gate:
        description: "Fail closed unless independent external production certification is supplied"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-canonical-d1-fleet-audit
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Verify deployed D1 principal scanner is strict and self-certification impossible
        run: |
          node --check scripts/audit-live-canonical-d1-principals.mjs
          node --test scripts/test-live-canonical-d1-principals.mjs
      - name: Verify canonical D1 owner-exclusive execution fence rejects direct mutations on API and cron
        run: |
          npm ci --no-audit --no-fund
          node scripts/check-exclusive-canonical-d1-write-fence.mjs

  live:
    needs: regression
    # The secure SSR and staging workflows temporarily attach canonical D1 to
    # authenticated test Workers. Do not audit mid-deploy, and never suppress
    # evidence if a failed cleanup leaves their privileges behind.
    concurrency:
      group: cove-exclusive-real-primary-cold-acceptance
      queue: max
      cancel-in-progress: false
    # Secrets must not be shared with pull requests.
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_readonly_cloudflare_audit == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_ZONE_ID: "07e218b2e74bc522122e0994b8e37576"
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_ZONE_ROUTES_READ_TOKEN: ${{ secrets.COVE_CF_ZONE_ROUTES_READ_TOKEN }}
      COVE_D1_FLEET_AUDIT_OUTPUT: artifacts/cove-live-canonical-d1-principals.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Read-only audit of ALL deployed Worker bindings and execution triggers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
          test -n "$COVE_CF_ZONE_ROUTES_READ_TOKEN"
          test "$COVE_CF_WORKERS_METADATA_READ_TOKEN" != "$COVE_CF_ZONE_ROUTES_READ_TOKEN"
          if [[ "${{ inputs.release_gate || 'false' }}" == "true" ]]; then
            node scripts/audit-live-canonical-d1-principals.mjs --release-gate
          else
            node scripts/audit-live-canonical-d1-principals.mjs --audit
          fi
      - name: Preserve audit evidence even when release gate rejects deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cove-live-canonical-d1-principal-inventory
          path: artifacts/cove-live-canonical-d1-principals.json
          retention-days: 30
          if-no-files-found: warn
      - name: Explain the production ownership boundary
        if: always()
        run: |
          echo '### Production canonical D1 principal inventory (read-only)' >> "$GITHUB_STEP_SUMMARY"
          echo 'This report measures deployed Worker bindings, schedules, ingress, and service references. It cannot prove SQL mutation, isolate credentials, certify Stripe/rights grants, or authorize release.' >> "$GITHUB_STEP_SUMMARY"
