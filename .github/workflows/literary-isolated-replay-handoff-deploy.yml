name: literary-isolated-replay-handoff-deploy
on:
  pull_request:
    paths:
      - ".github/workflows/literary-isolated-replay-handoff-deploy.yml"
      - "scripts/staging/verify-literary-replay-upgrade.mjs"
      - "src/lib/literary-legacy-reconcile.server.ts"
      - "src/lib/literary-prepare-outbox.server.ts"
      - "scripts/check-literary-legacy-reconcile.mjs"
      - "scripts/check-literary-replay-upgrade-contract.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-isolated-replay-handoff-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-replay-handoff-upgrade
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/verify-literary-replay-upgrade.mjs
      - run: node scripts/check-literary-replay-upgrade-contract.mjs
  protected-redeploy:
    needs: static
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-legacy-reconcile.mjs
      - run: node scripts/check-literary-prepare-outbox.mjs
      - run: node scripts/staging/verify-literary-replay-upgrade.mjs
      - run: npm run build:content-processing
      - name: Upgrade owner-fenced private handoff without changing owner
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-handoff.prod-draining.jsonc
      - run: node scripts/staging/verify-literary-drain-workers.mjs
