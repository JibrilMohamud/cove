name: literary-isolated-replay-handoff-deploy
on:
  pull_request:
    paths:
      - ".github/workflows/literary-isolated-replay-handoff-deploy.yml"
      - "scripts/staging/verify-literary-replay-upgrade.mjs"
      - "src/lib/literary-legacy-reconcile.server.ts"
      - "src/lib/literary-prepare-outbox.server.ts"
      - "scripts/check-literary-legacy-reconcile.mjs"
      - "scripts/check-literary-replay-upgrade-contract.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-isolated-replay-handoff-deploy.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA for protected Cloudflare operations"
        type: string
        required: true
      confirm_protected_cloudflare_action:
        description: "Explicitly approve protected stage/production Cloudflare operation"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cove-literary-replay-handoff-upgrade
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/verify-literary-replay-upgrade.mjs
      - run: node scripts/check-literary-replay-upgrade-contract.mjs
  protected-redeploy:
    needs: static
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_PROD_MAINTENANCE_TOKEN }}
      COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Independently verify temporary exact-Worker production maintenance authorization
        env:
          COVE_CF_PROD_MAINTENANCE_TOKEN: ${{ secrets.COVE_CF_PROD_MAINTENANCE_TOKEN }}
          COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
        run: node scripts/release/verify-temporary-worker-maintenance.mjs literary-replay
      - name: Require separate Worker deploy, D1/R2 read and Worker metadata principals
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$COVE_CF_STAGE_DATA_PLANE_READ_TOKEN"
          test -n "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
          test "$CLOUDFLARE_API_TOKEN" != "$COVE_CF_STAGE_DATA_PLANE_READ_TOKEN"
          test "$CLOUDFLARE_API_TOKEN" != "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
          test "$COVE_CF_STAGE_DATA_PLANE_READ_TOKEN" != "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
      - run: node scripts/check-literary-legacy-reconcile.mjs
      - run: node scripts/check-literary-prepare-outbox.mjs
      - run: node scripts/staging/verify-literary-replay-upgrade.mjs
      - run: npm run build:content-processing
      - name: Upgrade owner-fenced private handoff without changing owner
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.content-literary-handoff.prod-draining.jsonc
      - run: node scripts/staging/verify-literary-drain-workers.mjs
