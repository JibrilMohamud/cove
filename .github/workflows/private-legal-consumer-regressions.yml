name: private-legal-consumer-regressions
on:
  pull_request:
    paths:
      - "src/features/fore/commerce.server.ts"
      - "src/features/fore/delivery.server.ts"
      - "src/features/fore/commercial-audio.server.ts"
      - "src/features/fore/api.server.ts"
      - "src/storefront-strangler/legal-consumer-fence.server.ts"
      - "src/storefront-strangler/paid-settlement-publication.server.ts"
      - "scripts/check-legal-consumer-fence.mjs"
      - "scripts/check-staged-paid-settlement.mjs"
      - "scripts/check-customer-media-owner-order.mjs"
      - ".github/workflows/private-legal-consumer-regressions.yml"
  push:
    branches: [main]
    paths:
      - "src/features/fore/commerce.server.ts"
      - "src/features/fore/delivery.server.ts"
      - "src/features/fore/commercial-audio.server.ts"
      - "src/features/fore/api.server.ts"
      - "src/storefront-strangler/legal-consumer-fence.server.ts"
      - "src/storefront-strangler/paid-settlement-publication.server.ts"
      - "scripts/check-legal-consumer-fence.mjs"
      - "scripts/check-staged-paid-settlement.mjs"
      - "scripts/check-customer-media-owner-order.mjs"
      - ".github/workflows/private-legal-consumer-regressions.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-customer-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Legal consumer, paid owner settlement, refund and outage regression
        run: |
          node scripts/check-legal-consumer-fence.mjs
          node scripts/check-staged-paid-settlement.mjs
          node scripts/check-customer-media-owner-order.mjs
          node scripts/check-canonical-writer-closure.mjs --no-new-writers
      - name: Check no production stage owner binding
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const prod=fs.readFileSync("wrangler.frontend.production.toml","utf8");
          assert.doesNotMatch(prod,/COVE_LEGAL_CONSUMER_STAGE_ENABLED|COVE_RIGHTS_OWNER_SECRET|LEGAL_AUTHORITY|LEGAL_QUARANTINE_WRITER/);
          console.log("PASS: protected customer owner is opt-in QA only");
          '
