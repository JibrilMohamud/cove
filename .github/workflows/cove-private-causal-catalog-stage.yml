name: cove-private-causal-catalog-stage
on:
  push:
    branches:
      - diag/controlled-catalog-triad-20261114
    paths:
      - scripts/staging/private-causal-triad.worker.mjs
      - scripts/staging/private-causal-triad.worker.test.mjs
      - scripts/staging/causal-triad-stage.worker.mjs
      - scripts/staging/run-private-causal-triad.mjs
      - .github/workflows/cove-private-causal-catalog-stage.yml
permissions:
  contents: read
concurrency:
  group: cove-isolated-causal-catalog-stage-driver
  cancel-in-progress: false
jobs:
  worker-runtime-comparison:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_ALLOW_SAFE_RESTORE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prove all four private controls reject missing credentials and production D1
        run: |
          node --test scripts/staging/private-causal-triad.worker.test.mjs
          node --test scripts/staging/causal-triad-stage.worker.test.mjs
      - name: Verify stage-only deployment credentials exist
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "No Cloudflare test credential; cannot run"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Four-path private Worker runtime first-byte and load comparison
        run: node scripts/staging/run-private-causal-triad.mjs
      - name: Mandatory safe rollback, even if the probe fails
        if: always()
        run: node scripts/staging/run-private-causal-triad.mjs --restore-only
      - name: Persist diagnostic evidence without secrets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-causal-four-path-stage-${{ github.run_id }}
          path: artifacts/causal-triad-stage/
          if-no-files-found: ignore
          retention-days: 14
