name: cove-cloudflare-credential-partition-offline
on:
  pull_request:
    paths:
      - scripts/staging/prove-private-paid-owner.mjs
      - .github/workflows/paid-legal-full-schema-private-qa.yml
      - .github/workflows/deployed-canonical-d1-principal-audit.yml
      - .github/workflows/production-cutover-topology-audit.yml
      - .github/workflows/deploy-persistence-backend.yml
      - scripts/release/cloudflare-credential-partition.test.mjs
      - .github/workflows/cove-cloudflare-credential-partition-offline.yml
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - run: node --test scripts/release/cloudflare-credential-partition.test.mjs
