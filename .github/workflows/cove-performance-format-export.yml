name: cove-performance-format-export
on:
  pull_request:
    paths:
      - .github/workflows/cove-performance-format-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Format performance-only JavaScript without pushing
        run: |
          npx prettier --write \
            scripts/performance/d1-span-attribution.mjs \
            scripts/performance/d1-span-attribution.test.mjs \
            scripts/performance/check-architecture-review-ledger.mjs \
            scripts/staging/causal-triad-stage.worker.mjs \
            scripts/staging/causal-triad-stage.worker.test.mjs
      - name: Export formatted source to this restricted PR job log for review
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          for (const name of [
            "scripts/performance/d1-span-attribution.mjs",
            "scripts/performance/d1-span-attribution.test.mjs",
            "scripts/performance/check-architecture-review-ledger.mjs",
            "scripts/staging/causal-triad-stage.worker.mjs",
            "scripts/staging/causal-triad-stage.worker.test.mjs",
          ])
            console.log("__COVE_FORMAT_START__" + name + "__" + fs.readFileSync(name).toString("base64") + "__COVE_FORMAT_END__");
          NODE
