name: isolated-commons-audio-technical-qa

on:
  pull_request:
    paths:
      - "scripts/soundtracks/qualify-isolated-commons.py"
      - "scripts/soundtracks/test-qualify-isolated-commons.py"
      - "scripts/soundtracks/test-isolated-commons-real-audio.py"
      - "scripts/soundtracks/queue-open-review-cases.py"
      - "scripts/soundtracks/test-queue-open-review-cases.py"
      - "infra/music/0006_open_technical_qa.sql"
      - ".github/workflows/isolated-commons-audio-technical-qa.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/isolated-commons-audio-technical-qa.yml"
      - "scripts/soundtracks/qualify-isolated-commons.py"
      - "scripts/soundtracks/test-qualify-isolated-commons.py"
  workflow_dispatch:
  schedule:
    - cron: "55 7,13,19,1 * * *"

permissions:
  contents: read

concurrency:
  group: cove-isolated-commons-audio-technical-qa
  cancel-in-progress: false

jobs:
  no-network-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m py_compile scripts/soundtracks/qualify-isolated-commons.py scripts/soundtracks/queue-open-review-cases.py
      - run: python scripts/soundtracks/test-queue-open-review-cases.py -q
      - run: python scripts/soundtracks/test-qualify-isolated-commons.py -q
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - run: python scripts/soundtracks/test-isolated-commons-real-audio.py


  detached-one-original-dry-run:
    needs: no-network-safety-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COVE_MUSIC_OPEN_QA_APPLY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Require an isolated account credential and leave all publication flags off
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$COVE_MUSIC_OPEN_QA_APPLY" = 0
          command -v ffmpeg
          command -v ffprobe
      - name: Verify one live Commons original and all audio frames (no R2 or D1 writes)
        run: python scripts/soundtracks/qualify-isolated-commons.py --max-recordings 1 --max-seconds 840 --profile-dsp --output commons-original-dry-run.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: commons-original-private-technical-dry-run
          path: commons-original-dry-run.json
          if-no-files-found: warn
          retention-days: 14

  detached-private-qualification:
    needs: no-network-safety-tests
    # Four scheduled, private, technically-only cohorts daily. Neither
    # licensing nor quietness nor playback is approved by this job.
    # Protected main is the only source of credentials; PR jobs have none.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && vars.COVE_MUSIC_OPEN_QA_ENABLED == '1') ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[one-source-qa]')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COVE_MUSIC_R2_BACKEND: "cloudflare_api"
      COVE_MUSIC_OPEN_QA_APPLY: "1"
      COVE_MUSIC_REVIEW_APPLY: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Confirm private isolated credentials and actual FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && "$COVE_MUSIC_R2_BACKEND" = cloudflare_api && "$COVE_MUSIC_OPEN_QA_APPLY" = 1 ]]
          command -v ffmpeg
          command -v ffprobe
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Process up to two exact Commons originals in private R2 and detached D1
        shell: bash
        run: |
          set -euo pipefail
          limit=2
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            limit=1
          fi
          python scripts/soundtracks/qualify-isolated-commons.py \
            --max-recordings "$limit" --max-seconds 840 --profile-dsp \
            --apply-private --output commons-private-technical-qa.json
      - name: Durable rights and quietness exception evidence only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/soundtracks/queue-open-review-cases.py \
            --max-recordings 2 --apply-isolated \
            --output commons-private-review-cases.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-commons-technical-qa-receipts
          path: |
            commons-private-technical-qa.json
            commons-private-review-cases.json
          if-no-files-found: ignore
          retention-days: 14
