name: paid-legal-full-schema-private-qa
on:
  pull_request:
    paths:
      - "src/storefront-strangler/paid-settlement-stage-qa.worker.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/legal-authority-qa-caller.worker.ts"
      - "src/storefront-strangler/owner-sql-mutation-journal.ts"
      - "scripts/staging/paid-owner-rollback-evidence.mjs"
      - "scripts/staging/paid-owner-rollback-evidence.test.mjs"
      - "src/storefront-strangler/checkout-draft-owner-plan.ts"
      - "src/storefront-strangler/owner-checkout-creation.server.ts"
      - "src/storefront-strangler/canonical-owner-command-gateway.ts"
      - "src/storefront-strangler/legal-quarantine-qa.writer.ts"
      - "src/storefront-strangler/paid-settlement-publication.server.ts"
      - "src/storefront-strangler/legal-consumer-fence.server.ts"
      - "src/features/fore/commerce.server.ts"
      - "src/features/fore/paid-settlement-transaction.server.ts"
      - "src/features/fore/royalty-engine.server.ts"
      - "src/storefront-strangler/paid-settlement-owner-executor.ts"
      - "src/storefront-strangler/owner-paid-settlement.server.ts"
      - "drizzle/0089_atomic_paid_settlement.sql"
      - "scripts/check-owner-paid-settlement.mjs"
      - "scripts/check-owner-checkout-draft.mjs"
      - "scripts/check-owner-checkout-preparation.mjs"
      - "scripts/check-owner-checkout-full-schema.mjs"
      - "src/features/fore/delivery.server.ts"
      - "src/features/fore/commercial-audio.server.ts"
      - "src/features/fore/offline-audio.server.ts"
      - "src/features/fore/offline-epub.server.ts"
      - "src/features/fore/publishing.server.ts"
      - "drizzle/0085_canonical_terminal_rights_resurrection_guard.sql"
      - "drizzle/0086_rights_contract_version_terminal_guard.sql"
      - "drizzle/0087_paid_revocation_terminal_guard.sql"
      - "drizzle/0088_audio_offline_license_terminal_guard.sql"
      - "drizzle/0088_paid_repurchase_fresh_entitlement.sql"
      - "scripts/check-customer-media-owner-order.mjs"
      - "scripts/check-offline-epub-issuer-expiry.mjs"
      - "scripts/check-offline-audio-issuer-authorization.mjs"
      - "scripts/check-stripe-terminal-order-states.mjs"
      - "scripts/staging/prove-private-paid-owner.mjs"
      - "scripts/staging/paid-qa-template-binding.mjs"
      - "scripts/staging/paid-qa-template-binding.test.mjs"
      - "scripts/staging/paid-owner-schema-policy.mjs"
      - "scripts/check-qa-synthetic-audio.mjs"
      - "scripts/staging/provision-original-audio-qa.mjs"
      - "scripts/check-paid-stage-initial-identity.mjs"
      - "scripts/build-storefront-strangler.mjs"
      - "wrangler.legal-paid-*.example.jsonc"
      - ".github/workflows/paid-legal-full-schema-private-qa.yml"
  # Reviewed, protected main code only. A payment/rights change must be
  # checked with real signed Stripe TEST and the isolated canonical QA schema,
  # rather than relying on manually dispatched or special-branch runs.
  push:
    branches: [main]
    paths:
      - "src/storefront-strangler/paid-settlement-stage-qa.worker.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/legal-authority-qa-caller.worker.ts"
      - "src/storefront-strangler/owner-sql-mutation-journal.ts"
      - "scripts/staging/paid-owner-rollback-evidence.mjs"
      - "scripts/staging/paid-owner-rollback-evidence.test.mjs"
      - "src/storefront-strangler/checkout-draft-owner-plan.ts"
      - "src/storefront-strangler/owner-checkout-creation.server.ts"
      - "src/storefront-strangler/canonical-owner-command-gateway.ts"
      - "src/storefront-strangler/legal-quarantine-qa.writer.ts"
      - "src/storefront-strangler/paid-settlement-publication.server.ts"
      - "src/storefront-strangler/legal-consumer-fence.server.ts"
      - "src/features/fore/commerce.server.ts"
      - "src/features/fore/paid-settlement-transaction.server.ts"
      - "src/features/fore/royalty-engine.server.ts"
      - "src/storefront-strangler/paid-settlement-owner-executor.ts"
      - "src/storefront-strangler/owner-paid-settlement.server.ts"
      - "drizzle/0089_atomic_paid_settlement.sql"
      - "scripts/check-owner-paid-settlement.mjs"
      - "scripts/check-owner-checkout-draft.mjs"
      - "scripts/check-owner-checkout-preparation.mjs"
      - "scripts/check-owner-checkout-full-schema.mjs"
      - "src/features/fore/delivery.server.ts"
      - "src/features/fore/commercial-audio.server.ts"
      - "src/features/fore/offline-audio.server.ts"
      - "src/features/fore/offline-epub.server.ts"
      - "src/features/fore/publishing.server.ts"
      - "drizzle/0085_canonical_terminal_rights_resurrection_guard.sql"
      - "drizzle/0086_rights_contract_version_terminal_guard.sql"
      - "drizzle/0087_paid_revocation_terminal_guard.sql"
      - "drizzle/0088_audio_offline_license_terminal_guard.sql"
      - "drizzle/0088_paid_repurchase_fresh_entitlement.sql"
      - "scripts/check-customer-media-owner-order.mjs"
      - "scripts/staging/prove-private-paid-owner.mjs"
      - "scripts/staging/paid-qa-template-binding.mjs"
      - "scripts/staging/paid-qa-template-binding.test.mjs"
      - "scripts/staging/paid-owner-schema-policy.mjs"
      - "scripts/staging/provision-original-audio-qa.mjs"
      - "scripts/check-qa-synthetic-audio.mjs"
      - "scripts/check-paid-stage-initial-identity.mjs"
      - "scripts/check-offline-epub-issuer-expiry.mjs"
      - "scripts/check-offline-audio-issuer-authorization.mjs"
      - ".github/workflows/paid-legal-full-schema-private-qa.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA required for ALL protected paid QA."
        required: true
        type: string
      confirm_isolated_qa:
        description: "Explicitly authorize synthetic-only Workers, D1, R2 and Stripe TEST QA."
        required: true
        default: false
        type: boolean
      confirm_owner_state_rollback:
        description: "Run actual synthetic paid-owner A/B/A version rollback after TEST refund; no production changes."
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: cove-paid-full-schema-private-qa
  cancel-in-progress: false
jobs:
  # Nonsecret proof runs on every relevant PR, even when the full deployed
  # paid certification is restricted to reviewed main and protected QA.
  qa-initial-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/staging/paid-qa-template-binding.test.mjs
      - run: node scripts/check-paid-stage-initial-identity.mjs
      - run: node scripts/check-qa-synthetic-audio.mjs
      - run: node scripts/check-owner-checkout-draft.mjs
      - run: node scripts/check-owner-checkout-preparation.mjs
      - run: node scripts/check-owner-checkout-full-schema.mjs
      - run: node scripts/check-owner-paid-settlement.mjs
      - run: node scripts/check-offline-epub-issuer-expiry.mjs
      - run: node scripts/check-offline-audio-issuer-authorization.mjs
      - run: node scripts/check-customer-media-owner-order.mjs
      - run: node --test scripts/staging/paid-owner-rollback-evidence.test.mjs
      - run: node scripts/check-current-owner-mutation-fence.mjs
  real-test-payment-to-private-owner:
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_isolated_qa == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COVE_CF_QA_WORKERS_DEPLOY_TOKEN: ${{ secrets.COVE_CF_QA_WORKERS_DEPLOY_TOKEN }}
      COVE_CF_QA_D1_MUTATION_TOKEN: ${{ secrets.COVE_CF_QA_D1_MUTATION_TOKEN }}
      COVE_CF_QA_R2_STORAGE_TOKEN: ${{ secrets.COVE_CF_QA_R2_STORAGE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f51e8ccbc394e2d6016ff8c2c303d54b
      COVE_CF_QA_WORKERS_DEV_DOMAIN: cove-qa-reads.workers.dev
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require three distinct scoped QA credentials before Cloudflare operations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {checkedPaidQaCredentials} from "./scripts/staging/paid-qa-cloudflare-credentials.mjs";
            checkedPaidQaCredentials(process.env);
            console.log("PASS: three distinct QA credentials present; D1/R2 test operations use the ephemeral bound Worker");
          '
      - name: Validate isolated QA template rebinding before any deployment
        run: node --test scripts/staging/paid-qa-template-binding.test.mjs
      - name: Validate denial-first paid consumer and source rules
        run: |
          node scripts/check-paid-entitlement-authority.mjs
          node scripts/check-paid-order-atomic-publication.mjs
          node scripts/check-paid-owner-worker-handlers.mjs
          node scripts/check-offline-epub-issuer-expiry.mjs
          node scripts/check-offline-audio-issuer-authorization.mjs
          node scripts/check-stripe-terminal-order-states.mjs
          node scripts/check-customer-media-owner-order.mjs
          node scripts/check-commercial-legal-authority.mjs
          node scripts/check-staged-paid-settlement.mjs
          node scripts/check-owner-checkout-draft.mjs
          node scripts/check-owner-checkout-preparation.mjs
          node scripts/check-owner-checkout-full-schema.mjs
          node scripts/check-paid-stage-initial-identity.mjs
          node scripts/check-legal-consumer-fence.mjs
          node scripts/check-legal-quarantine-writer.mjs
          node scripts/test-legal-admin-owner-commands.mjs
      - name: Reject all production routing in private paid owner configs
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          for(const filename of ["wrangler.legal-paid-authority.example.jsonc","wrangler.legal-paid-writer.example.jsonc","wrangler.legal-paid-caller.example.jsonc","wrangler.legal-paid-settlement-stage-qa.example.jsonc"]){
            const c=JSON.parse(fs.readFileSync(filename,"utf8"));
            assert.equal(c.workers_dev,false);
            assert.equal(c.preview_urls,false);
            assert.deepEqual(c.routes,[]);
            for(const db of c.d1_databases||[]){
              assert.notEqual(db.database_id,"4bd657ac-8789-403e-a28c-93aba8d0a989");
              assert.equal(db.database_id,"7c7ab994-f6b3-419d-a72d-71eb9ea22e7e");
            }
          }
          console.log("PASS: no QA Worker production URL or production customer D1");
          '
      - name: Build private QA Durable Object and synthetic settlement probe
        run: node scripts/build-storefront-strangler.mjs
      - name: Install sandbox-only official Stripe event forwarder
        run: |
          npm install --global @stripe/cli
          stripe version
      - name: Real signed Stripe TEST settlement, EPUB/audio/offline and owner revocation
        env:
          COVE_QA_REHEARSE_OWNER_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_owner_state_rollback && '1' || '0' }}
          COVE_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          COVE_PAID_ROLLBACK_PROTECTED: cove-production-release-audit
          COVE_SANDBOX_SECRET_KEY: ${{ secrets.COVE_SANDBOX_SECRET_KEY || secrets.COVE_STRIPE_SANDBOX_SECRET_KEY || secrets.COVE_STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SANDBOX_SECRET_KEY || secrets.STRIPE_TEST_SECRET_KEY }}
        run: node scripts/staging/prove-private-paid-owner.mjs
      - name: Retain every synthetic native D1 timing and rights result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-synthetic-native-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/owner-native-qa/
          retention-days: 14
          if-no-files-found: ignore
      - name: Independently verify that all per-run QA Worker ingress was removed
        if: always()
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          // Reruns share RUN_ID, not RUN_ATTEMPT: verify this exact invocation.
          const id=process.env.GITHUB_RUN_ID+"-"+(process.env.GITHUB_RUN_ATTEMPT||"1");
          assert.match(id||"",/^\d{8,15}-\d{1,5}$/);
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.COVE_CF_QA_WORKERS_DEPLOY_TOKEN;
          assert.equal(account,"f51e8ccbc394e2d6016ff8c2c303d54b");
          assert.ok(token);
          const url="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts";
          const reply=await fetch(url,{headers:{authorization:"Bearer "+token},signal:AbortSignal.timeout(20000)});
          assert.equal(reply.status,200);
          const result=await reply.json();
          assert.equal(result.success,true);
          const expected=["cove-paid-legal-owner-","cove-paid-legal-caller-","cove-paid-legal-writer-","cove-paid-settlement-qa-","cove-paid-d1-gateway-"].map(prefix=>prefix+id);
          const remains=(result.result||[]).map(s=>s.id).filter(name=>expected.includes(name));
          assert.deepEqual(remains,[],"Temporary paid QA worker scripts must all be deleted");
          console.log("PASS: full paid-owner acceptance cleaned all four ephemeral QA Workers");
          '
