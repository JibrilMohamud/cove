name: paid-legal-full-schema-private-qa
on:
  push:
    branches: ["qa/original-customer-media-20261027"]
    paths:
      - "src/storefront-strangler/paid-settlement-stage-qa.worker.ts"
      - "scripts/staging/prove-private-paid-owner.mjs"
      - ".github/workflows/paid-legal-full-schema-private-qa.yml"
  pull_request:
    paths:
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/legal-quarantine-qa.writer.ts"
      - "src/storefront-strangler/paid-settlement-publication.server.ts"
      - "src/storefront-strangler/paid-order-atomic-publication.ts"
      - "scripts/check-paid-order-atomic-publication.mjs"
      - "scripts/check-stripe-terminal-order-states.mjs"
      - "src/storefront-strangler/paid-settlement-stage-qa.worker.ts"
      - "src/features/fore/delivery.server.ts"
      - "src/features/fore/commercial-audio.server.ts"
      - "src/features/fore/offline-epub.server.ts"
      - "src/features/fore/offline-audio.server.ts"
      - "scripts/check-customer-media-owner-order.mjs"
      - "src/features/fore/commerce.server.ts"
      - "src/storefront-strangler/legal-consumer-fence.server.ts"
      - "src/storefront-strangler/commercial-legal-core.ts"
      - "src/storefront-strangler/commercial-entitlement-core.ts"
      - "scripts/staging/prove-private-paid-owner.mjs"
      - "wrangler.legal-paid-authority.example.jsonc"
      - "wrangler.legal-paid-caller.example.jsonc"
      - "wrangler.legal-paid-writer.example.jsonc"
      - "wrangler.legal-paid-settlement-stage-qa.example.jsonc"
      - "scripts/build-storefront-strangler.mjs"
      - ".github/workflows/paid-legal-full-schema-private-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-paid-full-schema-private-qa
  cancel-in-progress: false
jobs:
  private-positive-owner:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["arch/isolated-catalog-normalization-20261025","security/atomic-paid-owner-order-20261027","qa/real-initial-payment-media-20261027","qa/original-customer-media-20261027"]'), github.event.pull_request.head.ref)) || (github.event_name == 'push' && github.ref == 'refs/heads/qa/original-customer-media-20261027') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["refs/heads/arch/isolated-catalog-normalization-20261025","refs/heads/security/atomic-paid-owner-order-20261027","refs/heads/qa/real-initial-payment-media-20261027","refs/heads/qa/original-customer-media-20261027"]'), github.ref))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node scripts/check-paid-entitlement-authority.mjs
      - run: node scripts/check-paid-order-atomic-publication.mjs
      - run: node scripts/check-stripe-terminal-order-states.mjs
      - run: node scripts/check-customer-media-owner-order.mjs
      - run: node scripts/check-commercial-legal-authority.mjs
      - run: node scripts/check-staged-paid-settlement.mjs
      - run: node scripts/check-legal-consumer-fence.mjs
      - run: node scripts/check-legal-quarantine-writer.mjs
      - run: node scripts/build-storefront-strangler.mjs
      - name: Install official Stripe test-event forwarder
        run: |
          npm install --global @stripe/cli
          stripe version
      - name: Certify real signed TEST webhook to private full-schema buyer and refund
        env:
          # Scope sandbox key only to the executed proof. It is never
          # deployed in a Worker, passed to npm, or given to a fork PR.
          COVE_SANDBOX_SECRET_KEY: ${{ secrets.COVE_SANDBOX_SECRET_KEY || secrets.COVE_STRIPE_SANDBOX_SECRET_KEY || secrets.COVE_STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SANDBOX_SECRET_KEY || secrets.STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SECRET_KEY }}
        run: node scripts/staging/prove-private-paid-owner.mjs
