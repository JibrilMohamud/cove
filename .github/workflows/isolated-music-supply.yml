name: isolated-music-supply

on:
  pull_request:
    paths:
      - "src/music-supply/**"
      - "infra/music/**"
      - "scripts/check-isolated-music-supply.mjs"
      - "scripts/music-supply/**"
      - "scripts/build-isolated-music-supply.mjs"
      - ".github/workflows/isolated-music-supply.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-evidence-and-durable-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/check-isolated-music-supply.mjs
      - run: node --check scripts/music-supply/ingest-reviewed-catalog.mjs
      - run: node --check scripts/music-supply/qualify-staged-masters.mjs
      - run: node --check scripts/music-supply/audio-quality.mjs
      - run: python -m py_compile scripts/music-supply/analyze-qualifying-masters.py
      - run: python scripts/music-supply/analyze-qualifying-masters.py --max-tracks=4
      - run: node --check scripts/music-supply/drain-source-intake.mjs
      - run: node scripts/music-supply/drain-source-intake.mjs --workers=4 --max-tracks=8
      - run: node --check scripts/music-supply/drain-full-decode-qa.mjs
      - run: node scripts/music-supply/drain-full-decode-qa.mjs --workers=4 --max-tracks=8
      - run: node --check scripts/music-supply/review-private-queue.mjs

      - run: node scripts/build-isolated-music-supply.mjs
      - run: npm run typecheck
      - run: npx eslint src/music-supply/*.ts scripts/check-isolated-music-supply.mjs
      - run: npx prettier --check src/music-supply/*.ts scripts/check-isolated-music-supply.mjs
