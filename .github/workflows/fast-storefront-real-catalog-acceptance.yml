name: fast-storefront-real-catalog-acceptance
on:
  pull_request:
    paths:
      [
        "src/storefront-strangler/**",
        "scripts/performance/strangler-real-catalog-acceptance.mjs",
        ".github/workflows/fast-storefront-real-catalog-acceptance.yml",
      ]
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-storefront-real-catalog-acceptance.yml"
      - "src/storefront-strangler/worker.ts"
      - "scripts/performance/strangler-real-catalog-acceptance.mjs"
      - "scripts/staging/verify-geo-edge-ingress.mjs"
      - "src/features/fore/Book.tsx"
      - "src/features/fore/BookDiscussionDeferred.tsx"
      - "src/features/fore/Community.tsx"
      - "src/features/fore/reading-community.css"
      - "src/features/fore/social.server.ts"
      - "scripts/staging/verify-literary-postpublication-readonly.mjs"
      - "wrangler.content-literary-infer.prod-isolated.jsonc"
      - "wrangler.literary-publisher.prod-isolated.jsonc"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Do not overlap read-only cold campaigns against the shared canonical D1.
# Preserve cleanup on cancellation by letting one run finish before the next.
concurrency:
  group: cove-exclusive-real-primary-cold-acceptance
  cancel-in-progress: false
jobs:
  protected-real-catalog-acceptance:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Identical pinned runtime successfully certified all six browsers on
    # 39927023349 and 39931555965. Avoid apt-mirror stalls on Chromium too.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      HOME: /root
      CI: "1"
      COVE_REAL_ACCEPTANCE_V2: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      # Avoid a 100MB Actions cache restore that can stall at the account
      # egress limit; preserve all cold, mobile LCP and visual assertions.
      - run: npm ci --no-audit --no-fund
      - name: Retrieve immutable, previously approved real-catalog visual reference
        if: env.COVE_REAL_ACCEPTANCE_V2 == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline="artifacts/strangler-acceptance/reference"
          bucket="cove-strangler-private-presentation-stage"
          prefix="ci/approved-real-catalog-visual/39922882111"
          mkdir -p "$baseline"
          wr() { npm exec --yes --package=wrangler@4.151.0 -- wrangler "$@"; }
          missing=0
          for screen in mobile desktop; do
            if ! wr r2 object get "$bucket/$prefix/live-$screen.png" --remote --file "$baseline/live-$screen.png" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if [[ "$missing" = 1 ]]; then
            # Populate this private QA-only bucket once from an independently
            # passing run. Never use current-PR screenshots as their own goldens.
            mkdir -p "$baseline/approved"
            if ! command -v gh >/dev/null 2>&1; then
              echo "::error::Approved reference missing from private QA R2; restore via the pinned successful Actions artifact before proceeding"
              exit 1
            fi
            gh run download 39922882111 -R "$GITHUB_REPOSITORY" \
              -n real-data-parity-fb265e21f31cb59fd9dfe8403eedbe1c3131aa2f \
              -D "$baseline/approved"
            echo "ef0214c40ec039eafb207bd96f3cf21724aa3dd12dc431899930a27e640d6b49  $baseline/approved/live-mobile.png" | sha256sum -c -
            echo "32f02dbf2c43015b87d18cff2c10ddd2b5b35e119d55fcd8179633bc15843c73  $baseline/approved/live-desktop.png" | sha256sum -c -
            for screen in mobile desktop; do
              wr r2 object put "$bucket/$prefix/live-$screen.png" --remote --file "$baseline/approved/live-$screen.png" >/dev/null
              cp "$baseline/approved/live-$screen.png" "$baseline/live-$screen.png"
            done
          fi
          # Fail closed if the remote fixture has ever changed.
          echo "ef0214c40ec039eafb207bd96f3cf21724aa3dd12dc431899930a27e640d6b49  $baseline/live-mobile.png" | sha256sum -c -
          echo "32f02dbf2c43015b87d18cff2c10ddd2b5b35e119d55fcd8179633bc15843c73  $baseline/live-desktop.png" | sha256sum -c -
      - name: Assert pinned Chromium is runnable (no Ubuntu apt downloads)
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from "@playwright/test";
          const b = await chromium.launch({ headless: true });
          console.log("REAL_CATALOG_BROWSER_READY", b.version());
          await b.close();
          NODE
      - run: node scripts/check-geo-edge-ingress.mjs
      - run: node scripts/check-storefront-strangler.mjs
      - run: node scripts/build-storefront-strangler.mjs
      - name: Require actual isolated literary canonical publication before postcutover capacity testing
        run: node scripts/staging/verify-literary-postpublication-readonly.mjs
      - name: Read-only, bearer-gated real-data mobile and visual preview
        run: node scripts/performance/strangler-real-catalog-acceptance.mjs
      - name: Preserve captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-parity-${{ github.sha }}
          path: artifacts/strangler-acceptance/
          retention-days: 30
          if-no-files-found: warn
# Never modify storefront routes or live databases; protected read-only preview.
