name: fast-storefront-real-catalog-acceptance
on:
  pull_request:
    paths: ["src/storefront-strangler/**", "scripts/performance/strangler-real-catalog-acceptance.mjs", ".github/workflows/fast-storefront-real-catalog-acceptance.yml"]
permissions:
  contents: read
jobs:
  protected-real-catalog-acceptance:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'release/fast-storefront-prod-acceptance-20261021' || github.event.pull_request.head.ref == 'release/verified-geo-fast-storefront-relay-20261021' || github.event.pull_request.head.ref == 'perf/stage-rights-shortlist-20261021')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-storefront-strangler.mjs
      - run: node scripts/build-storefront-strangler.mjs
      - name: Read-only, bearer-gated real-data mobile and visual preview
        run: node scripts/performance/strangler-real-catalog-acceptance.mjs
      - name: Preserve captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-parity-${{ github.sha }}
          path: artifacts/strangler-acceptance/
          retention-days: 30
          if-no-files-found: warn
# Never modify storefront routes or live databases; protected read-only preview.
