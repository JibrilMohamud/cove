name: fast-storefront-real-catalog-acceptance
on:
  pull_request:
    paths:
      [
        "src/storefront-strangler/**",
        "scripts/performance/strangler-real-catalog-acceptance.mjs",
        "scripts/performance/visual-cover-fixtures*",
        "scripts/fixtures/real-catalog-cover-manifest.json",
        "public/covers/**",
        "scripts/performance/real-catalog-snapshot-safety.mjs",
        "scripts/performance/real-catalog-snapshot-safety.test.mjs",
        "scripts/staging/stage-presentation-storage*.mjs",
        "scripts/staging/seed-versioned-presentation.mjs",
        "scripts/check-storefront-v2-primary-prefix.mjs",
        ".github/workflows/fast-storefront-real-catalog-acceptance.yml",
      ]
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact approved main SHA required for protected action."
        required: true
        type: string
      confirm_real_catalog_readonly:
        description: "Approve isolated full-catalog snapshot preview ONLY; no direct production D1 Worker binding."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
# This path MUST never create a Worker with primary-production D1 access.
# No automatic dispatch, live customer routing, legal owner, or payments.
concurrency:
  group: cove-exclusive-real-primary-cold-acceptance
  cancel-in-progress: false
jobs:
  offline-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - name: Verify identity-bound cover integrity
        run: node --test scripts/performance/visual-cover-fixtures.test.mjs
      - name: Fail closed for direct production D1, 50k synthetic substitutes and absent snapshot
        run: |
          node --test scripts/performance/real-catalog-snapshot-safety.test.mjs
          node --test scripts/staging/stage-presentation-storage.test.mjs
          node --check scripts/performance/strangler-real-catalog-acceptance.mjs
          git diff --check

  cover-browser-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/performance/visual-cover-browser.mjs

  protected-real-catalog-acceptance:
    needs: [offline-isolation, cover-browser-regression]
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_real_catalog_readonly == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    # Identical pinned runtime successfully certified all six browsers on
    # 39927023349 and 39931555965. Avoid apt-mirror stalls on Chromium too.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      HOME: /root
      CI: "1"
      COVE_REAL_ACCEPTANCE_V2: "1"
      # Pin the separately provisioned and reviewed isolated target. A successful
      # protected population and cleanup receipt is mandatory before deployment.
      COVE_REAL_CATALOG_SNAPSHOT_D1_ID: "15ce2ea3-17f8-4d99-9015-a78a6a3af05d"
      COVE_REAL_CATALOG_SNAPSHOT_D1_NAME: "cove-real-catalog-snapshot-20261125"
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN }}
      COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify exact approved main source before build and privileged activity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.reviewed_main_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trust only the exact Actions checkout across container HOME/UID changes.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Require isolated nonproduction D1 snapshot before any remote operations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { requireIsolatedCatalogSnapshotTarget } from "./scripts/performance/real-catalog-snapshot-safety.mjs";
          requireIsolatedCatalogSnapshotTarget(
            process.env.COVE_REAL_CATALOG_SNAPSHOT_D1_ID,
            process.env.COVE_REAL_CATALOG_SNAPSHOT_D1_NAME,
          );
          console.log("Dedicated isolated D1 target validated; legal generation still requires separate certification.");
          NODE
      - name: Require complete protected catalog population and importer retirement
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/staging/real-catalog-copy-receipt.mjs --verify
      # Avoid a 100MB Actions cache restore that can stall at the account
      # egress limit; preserve all cold, mobile LCP and visual assertions.
      - run: npm ci --no-audit --no-fund
      - name: Retrieve immutable, previously approved real-catalog visual reference
        if: env.COVE_REAL_ACCEPTANCE_V2 == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
        run: |
          set -euo pipefail
          baseline="artifacts/strangler-acceptance/reference"
          bucket="cove-strangler-private-presentation-stage"
          prefix="ci/approved-real-catalog-visual/39922882111"
          mkdir -p "$baseline"
          wr() { npm exec --yes --package=wrangler@4.151.0 -- wrangler "$@"; }
          missing=0
          for screen in mobile desktop; do
            if ! wr r2 object get "$bucket/$prefix/live-$screen.png" --remote --file "$baseline/live-$screen.png" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if [[ "$missing" = 1 ]]; then
            # Restore the pinned approved artifact locally if the immutable R2
            # copy is missing. Never use current-PR screenshots as goldens.
            mkdir -p "$baseline/approved"
            if ! command -v gh >/dev/null 2>&1; then
              echo "::error::Approved reference missing from private QA R2; restore via the pinned successful Actions artifact before proceeding"
              exit 1
            fi
            gh run download 39922882111 -R "$GITHUB_REPOSITORY" \
              -n real-data-parity-fb265e21f31cb59fd9dfe8403eedbe1c3131aa2f \
              -D "$baseline/approved"
            echo "ef0214c40ec039eafb207bd96f3cf21724aa3dd12dc431899930a27e640d6b49  $baseline/approved/live-mobile.png" | sha256sum -c -
            echo "32f02dbf2c43015b87d18cff2c10ddd2b5b35e119d55fcd8179633bc15843c73  $baseline/approved/live-desktop.png" | sha256sum -c -
            for screen in mobile desktop; do
              cp "$baseline/approved/live-$screen.png" "$baseline/live-$screen.png"
            done
          fi
          # Fail closed if the remote fixture has ever changed.
          echo "ef0214c40ec039eafb207bd96f3cf21724aa3dd12dc431899930a27e640d6b49  $baseline/live-mobile.png" | sha256sum -c -
          echo "32f02dbf2c43015b87d18cff2c10ddd2b5b35e119d55fcd8179633bc15843c73  $baseline/live-desktop.png" | sha256sum -c -
      - name: Assert pinned Chromium is runnable (no Ubuntu apt downloads)
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from "@playwright/test";
          const b = await chromium.launch({ headless: true });
          console.log("REAL_CATALOG_BROWSER_READY", b.version());
          await b.close();
          NODE
      - run: node scripts/check-geo-edge-ingress.mjs
      - run: node scripts/check-storefront-strangler.mjs
      - name: Prove 25-ID live rights prefix and full withdrawal-safe fallback
        run: node scripts/check-storefront-v2-primary-prefix.mjs
      - run: node scripts/build-storefront-strangler.mjs
      - name: Require actual isolated literary canonical publication before postcutover capacity testing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_BIOSYNC_PROD_D1_READ_TOKEN }}
        run: node scripts/staging/verify-literary-postpublication-readonly.mjs
      - name: Isolated full-catalog snapshot preview (NOT legal generation or release proof)
        run: node scripts/performance/strangler-real-catalog-acceptance.mjs
      - name: Close run-scoped storage helper even after cancellation
        if: always()
        run: node scripts/staging/stage-presentation-storage.mjs --cleanup real
      - name: Preserve captured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-parity-${{ github.sha }}
          path: artifacts/strangler-acceptance/
          retention-days: 30
          if-no-files-found: warn
# No direct primary-production D1 binding may appear in generated Wrangler
# config. Isolated snapshot metadata is only an early filter, NOT a legal
# snapshot generation certificate or full four-region performance acceptance.
