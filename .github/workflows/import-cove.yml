name: Import Cove source

on:
  push:
    paths:
      - ".cove-import/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Cove source
        shell: bash
        run: |
          set -euo pipefail
          cat .cove-import/chunk-* > /tmp/cove-source.tar.xz.b64
          base64 --decode /tmp/cove-source.tar.xz.b64 > /tmp/cove-source.tar.xz
          rm -rf .cove-import
          tar -xJf /tmp/cove-source.tar.xz -C .

      - name: Restore cached public-domain covers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cache-assets.py

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-cove.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Cove source"
          git push origin HEAD:main
