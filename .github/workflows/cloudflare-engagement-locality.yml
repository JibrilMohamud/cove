name: cloudflare-engagement-locality
on:
  push:
    branches: [perf/discovery-workload-separation-20261020]
    paths:
      - .github/workflows/cloudflare-engagement-locality.yml
      - scripts/performance/prepare-engagement-locality.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-synthetic-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prepare one generator-local engagement database and report actual location
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/performance/prepare-engagement-locality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cove-engagement-locality-${{ github.sha }}
          path: artifacts/engagement-locality/resource.json
          retention-days: 30
