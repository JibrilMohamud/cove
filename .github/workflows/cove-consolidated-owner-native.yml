name: cove-consolidated-owner-native
on:
  pull_request:
    paths:
      - "src/storefront-strangler/consolidated-*-qa.worker.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/production-*.ts"
      - "src/storefront-strangler/current-legal-owner*.ts"
      - "src/storefront-strangler/owner-refund-*.ts"
      - "src/storefront-strangler/paid-order-revocation.server.ts"
      - "src/storefront-strangler/qa-owner-*.ts"
      - "src/storefront-strangler/*d1-write-fence.ts"
      - "src/features/fore/**"
      - "src/persistence-backend.worker.ts"
      - "drizzle/**"
      - "scripts/test-native-owner-reader-fixture.mjs"
      - "scripts/test-native-owner-commerce.mjs"
      - "scripts/test-local-catalog-fixture.mjs"
      - "scripts/release/prove-consolidated-owner-native.mjs"
      - ".github/workflows/cove-consolidated-owner-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-single-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Prove native authenticated reader, account, catalog, operational rows and all seven schedules
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- sh -c 'COVE_MINIFLARE_MODULE="$(dirname "$(command -v wrangler)")/../miniflare" node --no-warnings scripts/release/prove-consolidated-owner-native.mjs'
      - name: Prove native Stripe settlement, persisted ledgers, streaming delivery and revocation
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- sh -c 'COVE_MINIFLARE_MODULE="$(dirname "$(command -v wrangler)")/../miniflare" node --no-warnings scripts/test-native-owner-commerce.mjs'
      - name: Prove production quarantine, persisted denial, account writes and seven schedules
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- sh -c 'COVE_MINIFLARE_MODULE="$(dirname "$(command -v wrangler)")/../miniflare" node --no-warnings scripts/release/prove-consolidated-owner-native.mjs --production-quarantine'
      - name: Prove production refund retries and ledger rows after complete quarantine
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- sh -c 'COVE_MINIFLARE_MODULE="$(dirname "$(command -v wrangler)")/../miniflare" node --no-warnings scripts/test-native-owner-commerce.mjs --production-quarantine'
