name: deployed-commerce-browser-acceptance
on:
  pull_request:
    paths:
      - "scripts/staging/check-deployed-commerce-browser.mjs"
      - ".github/workflows/deployed-commerce-browser-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-deployed-commerce-qa
  cancel-in-progress: false
jobs:
  authenticated-commerce:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'arch/isolated-data-plane-20261022') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/arch/isolated-data-plane-20261022')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVE_QA_DEPLOYED_ORIGIN: ${{ secrets.COVE_QA_DEPLOYED_ORIGIN }}
      COVE_QA_BUYER_EMAIL: ${{ secrets.COVE_QA_BUYER_EMAIL }}
      COVE_QA_BUYER_PASSWORD: ${{ secrets.COVE_QA_BUYER_PASSWORD }}
      COVE_QA_OUTSIDER_EMAIL: ${{ secrets.COVE_QA_OUTSIDER_EMAIL }}
      COVE_QA_OUTSIDER_PASSWORD: ${{ secrets.COVE_QA_OUTSIDER_PASSWORD }}
      COVE_QA_EPUB_PRODUCT_ID: qa-original-ebook-product
      COVE_QA_AUDIO_PRODUCT_ID: qa-original-audio-product
      COVE_QA_AUDIO_PUBLIC_ID: ca_qa-original-audio-draft
      COVE_QA_AUDIO_TRACK_ID: intro
      COVE_QA_VERCEL_PROTECTION_BYPASS: ${{ secrets.COVE_QA_VERCEL_PROTECTION_BYPASS }}
      COVE_QA_STAGE_BEARER: ${{ secrets.COVE_QA_STAGE_BEARER }}
      COVE_SANDBOX_SECRET_KEY: ${{ secrets.COVE_SANDBOX_SECRET_KEY || secrets.COVE_STRIPE_SANDBOX_SECRET_KEY || secrets.COVE_STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SANDBOX_SECRET_KEY || secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Verify protected deployed-QA inputs are wired
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in COVE_QA_DEPLOYED_ORIGIN COVE_QA_BUYER_EMAIL COVE_QA_BUYER_PASSWORD COVE_QA_OUTSIDER_EMAIL COVE_QA_OUTSIDER_PASSWORD COVE_QA_EPUB_PRODUCT_ID COVE_QA_AUDIO_PRODUCT_ID COVE_QA_AUDIO_PUBLIC_ID COVE_QA_AUDIO_TRACK_ID COVE_SANDBOX_SECRET_KEY; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf "::error::Deployed commerce QA not configured. Missing repository Actions secrets: %s\n" "${missing[*]}"
            exit 1
          fi
          echo "Deployed QA credentials and fixture identifiers are present; no secret value printed."
      - run: npx playwright install --with-deps chromium
      - name: Verify real deployed buyer, outsider, signed fulfillment and original media
        run: node scripts/staging/check-deployed-commerce-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-commerce-browser-${{ github.sha }}
          path: artifacts/deployed-commerce/report.json
          if-no-files-found: ignore
          retention-days: 14
