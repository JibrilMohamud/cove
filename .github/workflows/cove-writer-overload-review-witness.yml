name: cove-writer-overload-review-witness
on:
  pull_request:
    paths:
      - .github/workflows/cove-writer-overload-review-witness.yml
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Emit exact source-bound SQL review identity (no changed authorization)
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import {createHash} from "node:crypto";
          import {readFileSync} from "node:fs";
          import {currentWriterSites,REVIEW_PATH} from "./scripts/reconcile-canonical-writers.mjs";
          const file = "src/features/fore/search.server.ts";
          const current = currentWriterSites().filter(s => s.file === file);
          const prior = JSON.parse(readFileSync(REVIEW_PATH,"utf8")).sites.filter(s => s.file === file);
          const identity = x => JSON.stringify([x.file,x.functionName,x.table,x.operation,x.sqlSha256]);
          assert.equal(current.length, prior.length, "No protected mutation may appear or disappear");
          assert.deepEqual(current.map(identity).sort(), prior.map(identity).sort(), "Protected mutation SQL and functions must be identical");
          assert.equal(current.length, 1, "Unexpected search writer count");
          assert.equal(current[0].functionName, "refreshSearchQualitySignals");
          assert.equal(current[0].table, "catalog_search_documents");
          assert.equal(current[0].operation, "UPDATE");
          assert.equal(current[0].literal, true);
          const src=readFileSync(file,"utf8");
          const sha=createHash("sha256").update(src).digest("hex");
          console.log("__COVE_OVERLOAD_REVIEW_SOURCE_SHA__"+sha+"__END__");
          console.log("__COVE_OVERLOAD_REVIEW_CURRENT_SITE__"+JSON.stringify(current[0])+"__END__");
          console.log("__COVE_OVERLOAD_REVIEW_PRIOR_DISPOSITION__"+JSON.stringify(prior[0].disposition)+"__END__");
          NODE
