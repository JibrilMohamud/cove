name: Temporary reader profile browser formatter
on:
  push:
    branches: [feat/letterboxd-inspired-reader-profiles-20261101]
    paths: [.github/workflows/format-profile-browser-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/browser-qa/reader-profile.spec.mjs src/features/fore/ReaderProfileBits.tsx
      - name: Commit checked formatting
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-qa/reader-profile.spec.mjs src/features/fore/ReaderProfileBits.tsx
          git commit -m "style(profile): format browser QA and cover guard"
          git push origin HEAD:refs/heads/feat/letterboxd-inspired-reader-profiles-20261101
