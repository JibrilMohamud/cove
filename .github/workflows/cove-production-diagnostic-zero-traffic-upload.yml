name: cove-production-diagnostic-zero-traffic-upload
on:
  push:
    branches: [diag/production-zero-traffic-version-20261115]
    paths:
      - scripts/staging/prepare-production-diagnostic-upload.mjs
      - scripts/staging/verify-production-diagnostic-upload.mjs
      - scripts/staging/check-production-diagnostic-upload-fence.mjs
      - .github/workflows/cove-production-diagnostic-zero-traffic-upload.yml
permissions:
  contents: read
concurrency:
  group: cove-exclusive-real-primary-cold-acceptance
  queue: max
  cancel-in-progress: false
jobs:
  upload-candidate-no-customer-traffic:
    if: github.repository == 'JibrilMohamud/cove' && github.ref == 'refs/heads/diag/production-zero-traffic-version-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Validate exact upload-only script contract and reviewed source SHA
        run: |
          node --check scripts/staging/prepare-production-diagnostic-upload.mjs
          node --check scripts/staging/verify-production-diagnostic-upload.mjs
          node --check scripts/staging/check-production-diagnostic-upload-fence.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Build EXACT reviewed persistence backend, without changing traffic
        run: npm run build:backend
      - name: Prepare using canonical production config and pin active version 451
        run: node scripts/staging/prepare-production-diagnostic-upload.mjs
      - name: Upload candidate version ONLY; do not deploy routes, triggers or traffic
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- wrangler versions upload             --config wrangler.backend.deploy.toml --keep-vars             --tag "cove-diag-${GITHUB_RUN_ID}"             --message "Cove reviewed 503 diagnostics zero-traffic candidate ${GITHUB_RUN_ID}"
      - name: Verify archived candidate parity and unchanged 100% production baseline
        run: node scripts/staging/verify-production-diagnostic-upload.mjs
      - name: Unconditional independent customer traffic unchanged fence
        if: always()
        run: node scripts/staging/check-production-diagnostic-upload-fence.mjs
      - name: Archive ONLY version ID and authorization-denial evidence (no secrets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-zero-traffic-production-diagnostic-${{ github.run_id }}
          path: artifacts/production-diagnostic-upload/evidence.json
          retention-days: 14
          if-no-files-found: ignore
