name: cove-stage-owner-current-retail-projection-proof
on:
  push:
    branches: [perf/stage-owner-transactional-retail-projection-20261115, perf/stage-owner-cas-positive-writer-20261115]
    paths:
      - scripts/staging/owner-current-retail-invalidation.stage.py
      - scripts/staging/check-owner-current-retail-invalidation.py
      - scripts/staging/owner-positive-retail-writer.stage.py
      - scripts/staging/check-owner-positive-retail-cas.py
      - src/features/fore/owner-positive-retail.stage.ts
      - scripts/staging/check-owner-positive-retail-adapter.mjs
      - scripts/staging/check-owner-retail-source-dependencies.py
      - src/features/fore/rights.server.ts
      - .github/workflows/cove-stage-owner-retail-projection-proof.yml
permissions:
  contents: read
jobs:
  isolated-transactional-projection:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prove affected-product invalidation, deny-first revocation and atomic repricing
        run: |
          python3 -m py_compile scripts/staging/owner-current-retail-invalidation.stage.py scripts/staging/check-owner-current-retail-invalidation.py scripts/staging/owner-positive-retail-writer.stage.py scripts/staging/check-owner-positive-retail-cas.py
          python3 scripts/staging/check-owner-current-retail-invalidation.py
          python3 scripts/staging/check-owner-positive-retail-cas.py
      - name: Compile and gate the real canonical TypeScript rights adapter
        run: node scripts/staging/check-owner-positive-retail-adapter.mjs
          python3 scripts/staging/check-owner-retail-source-dependencies.py
      - name: Deny accidental stage proof edits or whitespace errors
        run: git diff --check
