name: Restore Cove original icons

on:
  push:
    paths:
      - ".cove-icons/READY"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact original icon assets
        shell: bash
        run: |
          set -euo pipefail
          cat .cove-icons/chunk-* > /tmp/cove-icons.tar.xz.b64
          base64 --decode /tmp/cove-icons.tar.xz.b64 > /tmp/cove-icons.tar.xz
          rm -rf .cove-icons
          tar -xJf /tmp/cove-icons.tar.xz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original Cove icon assets"
          git push origin HEAD:main
