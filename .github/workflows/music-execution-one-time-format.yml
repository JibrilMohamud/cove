name: music-execution-one-time-format
on:
  push:
    branches: [feat/music-supply-execution-20261024]
    paths: [.github/workflows/music-execution-one-time-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/music-supply-execution-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only isolated music execution files
        run: |
          npx prettier --write src/music-supply/analysis.ts src/music-supply/worker.ts src/music-supply/execution.ts scripts/check-isolated-music-supply.mjs scripts/music-supply/drain-source-intake.mjs scripts/music-supply/review-private-queue.mjs
          if ! git diff --quiet; then
            git config user.name "cove-format-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/music-supply/analysis.ts src/music-supply/worker.ts src/music-supply/execution.ts scripts/check-isolated-music-supply.mjs scripts/music-supply/drain-source-intake.mjs scripts/music-supply/review-private-queue.mjs
            git commit -m "style(music): format detached execution"
            git push origin HEAD:feat/music-supply-execution-20261024
          fi
