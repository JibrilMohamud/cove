name: Protected production BioSync credential preflight
on:
  pull_request:
    paths:
      - 'scripts/release/production-biosync-credential-preflight*'
      - 'scripts/audio_pipeline/biosync_production_owner_transport.py'
      - 'scripts/audio_pipeline/biosync_owner_https*'
      - 'scripts/release/activate-production-biosync-bridge.mjs'
      - '.github/workflows/production-biosync-bridge-activation.yml'
      - 'scripts/audio_pipeline/test_biosync_production_owner_transport.py'
      - '.github/workflows/production-biosync-credential-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release/production-biosync-credential-preflight*'
      - 'scripts/audio_pipeline/biosync_production_owner_transport.py'
      - 'scripts/audio_pipeline/biosync_owner_https*'
      - 'scripts/release/activate-production-biosync-bridge.mjs'
      - '.github/workflows/production-biosync-bridge-activation.yml'
      - 'scripts/audio_pipeline/test_biosync_production_owner_transport.py'
      - '.github/workflows/production-biosync-credential-preflight.yml'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        type: string
        required: true
      confirm_read_only:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test scripts/release/production-biosync-credential-preflight.test.mjs
      - run: python3 -m unittest scripts.audio_pipeline.test_biosync_production_owner_transport
      - run: node --test scripts/audio_pipeline/biosync_owner_https.test.mjs
      - run: node --check scripts/release/activate-production-biosync-bridge.mjs
  protected-read-only:
    needs: contract
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.reviewed_main_sha == github.sha && inputs.confirm_read_only == true))
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cove-exclusive-real-primary-cold-acceptance
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify immutable protected source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify actual credentials without writes or secret logging
        env:
          COVE_BIOSYNC_PROD_D1_READ_TOKEN: ${{ secrets.COVE_BIOSYNC_PROD_D1_READ_TOKEN }}
          COVE_BIOSYNC_PROD_R2_TOKEN: ${{ secrets.COVE_BIOSYNC_PROD_R2_TOKEN }}
          COVE_BIOSYNC_PROD_CLIENT_SECRET: ${{ secrets.COVE_BIOSYNC_PROD_CLIENT_SECRET }}
          COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
        run: node scripts/release/production-biosync-credential-preflight.mjs
