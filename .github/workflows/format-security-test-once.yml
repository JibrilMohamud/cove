name: one-time security-test formatting
on:
  push:
    paths: [".github/workflows/format-security-test-once.yml"]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'JibrilMohamud/cove' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Apply pinned Prettier to security regression test
        run: |
          npm exec -- prettier --write scripts/check-security-sync-bookmarks.mjs
          npm exec -- prettier --check scripts/check-security-sync-bookmarks.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/check-security-sync-bookmarks.mjs
          if git diff --cached --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git diff --cached --check
          git commit -m "test: format sync and security regression assertion updates"
          git push origin HEAD:main
