name: One-shot Cloudflare retry formatter
on:
  push:
    branches: [fix/cloudflare-transient-throttle-and-audit-race-20261104]
    paths: [.github/workflows/format-cloudflare-retry-once.yml]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Normalize bounded retry and source contracts
        run: npx prettier --write scripts/staging/cf-api-429-retry.mjs scripts/staging/cf-api-429-retry.test.mjs scripts/staging/retry-production-d1-migrations.mjs scripts/staging/retry-production-d1-migrations.test.mjs scripts/check-persistence-backend.mjs
      - name: Commit corrections
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/staging/cf-api-429-retry.mjs scripts/staging/cf-api-429-retry.test.mjs scripts/staging/retry-production-d1-migrations.mjs scripts/staging/retry-production-d1-migrations.test.mjs scripts/check-persistence-backend.mjs
          git commit -m "style(ci): format bounded Cloudflare retry contracts"
          git push origin HEAD:refs/heads/fix/cloudflare-transient-throttle-and-audit-race-20261104
