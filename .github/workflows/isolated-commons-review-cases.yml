name: isolated-commons-review-cases
on:
  pull_request:
    paths:
      - "infra/music/0007_open_review_cases.sql"
      - "scripts/soundtracks/queue-open-review-cases.py"
      - "scripts/soundtracks/migrate-detached-commons-qa.py"
      - "scripts/soundtracks/test-migrate-detached-commons-qa.py"
      - "scripts/soundtracks/test-queue-open-review-cases.py"
      - ".github/workflows/isolated-commons-review-cases.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/isolated-commons-review-cases.yml"
      - "scripts/soundtracks/queue-open-review-cases.py"
      - "scripts/soundtracks/migrate-detached-commons-qa.py"
      - "scripts/soundtracks/test-migrate-detached-commons-qa.py"
      - "scripts/soundtracks/test-queue-open-review-cases.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cove-isolated-commons-review-cases
  cancel-in-progress: false
jobs:
  no-network-review-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/soundtracks/queue-open-review-cases.py
      - run: python scripts/soundtracks/test-queue-open-review-cases.py -q
      - run: python scripts/soundtracks/test-migrate-detached-commons-qa.py -q
  bounded-one-recording-provenance-review:
    needs: no-network-review-safety
    if: github.repository == 'JibrilMohamud/cove' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[review-case-pilot]')
    runs-on: ubuntu-latest
    concurrency:
      group: cove-detached-commons-qa-account
      queue: max
      cancel-in-progress: false
    environment: cove-production-release-audit
    timeout-minutes: 55
    env:
      CLOUDFLARE_ACCOUNT_ID: f51e8ccbc394e2d6016ff8c2c303d54b
      COVE_CF_QA_D1_MUTATION_TOKEN: ${{ secrets.COVE_CF_QA_D1_MUTATION_TOKEN }}
      COVE_MUSIC_REVIEW_APPLY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify detached Commons QA migration before reading or writing
        env:
          GH_TOKEN: ${{ github.token }}
          COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
          COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
          COVE_CF_USER_TOKENS_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_USER_TOKENS_AUDIT_READ_TOKEN }}
          COVE_CF_QA_R2_STORAGE_TOKEN: ${{ secrets.COVE_CF_QA_R2_STORAGE_TOKEN }}
        run: python scripts/soundtracks/migrate-detached-commons-qa.py
      - name: Require isolated credential and no publishing permissions
        run: |
          test -n "${COVE_CF_QA_D1_MUTATION_TOKEN:-}"
          test "$COVE_MUSIC_REVIEW_APPLY" = 1
      - name: Add exactly two durable unapproved cases for one measured original
        run: python scripts/soundtracks/queue-open-review-cases.py --max-recordings 1 --apply-isolated --output commons-review-case-pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-open-commons-unapproved-review-cases
          path: commons-review-case-pilot.json
          if-no-files-found: warn
          retention-days: 14
