name: isolated-commons-review-cases
on:
  pull_request:
    paths:
      - "infra/music/0007_open_review_cases.sql"
      - "scripts/soundtracks/queue-open-review-cases.py"
      - "scripts/soundtracks/test-queue-open-review-cases.py"
      - ".github/workflows/isolated-commons-review-cases.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/isolated-commons-review-cases.yml"
      - "scripts/soundtracks/queue-open-review-cases.py"
      - "scripts/soundtracks/test-queue-open-review-cases.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-isolated-commons-review-cases
  cancel-in-progress: false
jobs:
  no-network-review-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/soundtracks/queue-open-review-cases.py
      - run: python scripts/soundtracks/test-queue-open-review-cases.py -q
  bounded-one-recording-provenance-review:
    needs: no-network-review-safety
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[review-case-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COVE_MUSIC_REVIEW_APPLY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require isolated credential and no publishing permissions
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "$COVE_MUSIC_REVIEW_APPLY" = 1
      - name: Add exactly two durable unapproved cases for one measured original
        run: python scripts/soundtracks/queue-open-review-cases.py --max-recordings 1 --apply-isolated --output commons-review-case-pilot.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-open-commons-unapproved-review-cases
          path: commons-review-case-pilot.json
          if-no-files-found: warn
          retention-days: 14
