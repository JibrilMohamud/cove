name: oneoff-sync-security-with-main
on:
  pull_request:
    paths:
      - ".github/workflows/oneoff-sync-security-with-main.yml"
permissions:
  contents: read
jobs:
  resolve-and-format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/secure-zod-v4-20261023'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/secure-zod-v4-20261023
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - name: Integrate the latest tested main without rewriting activation flags
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git merge -X theirs origin/main --no-edit
      - name: Normalize all existing Zod schemas to v3 behavior under patched v4
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const e of fs.readdirSync(dir,{withFileTypes:true})) {
              const p=path.join(dir,e.name);
              if(e.isDirectory()){walk(p);continue;}
              if(!/\.(?:ts|tsx|js|mjs)$/.test(e.name))continue;
              const x=fs.readFileSync(p,'utf8');
              const y=x.replace(/from\s+(['"])zod\1/g,'from $1zod/v3$1');
              if(x!==y)fs.writeFileSync(p,y);
            }
          }
          walk('src');walk('scripts');
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/build-isolated-music-supply.mjs scripts/check-music-qa-analyzer.mjs scripts/music-qa-analyzer.mjs scripts/music-supply/audio-quality.mjs scripts/music-supply/ingest-reviewed-catalog.mjs scripts/music-supply/qualify-staged-masters.mjs scripts/run-music-qa-batch.mjs scripts/staging/deploy-music-supply-qa-shadow.mjs
      - name: Push main merge and targeted strict style fixes
        run: |
          git add src scripts
          if ! git diff --cached --quiet; then
            git commit -m "style(security): preserve patched Zod semantics and normalize music tools"
          fi
          git push origin HEAD:refs/heads/fix/secure-zod-v4-20261023
