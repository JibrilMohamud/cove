name: cove-temporary-formatter-evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cove-temporary-formatter-evidence.yml"

permissions:
  contents: read

jobs:
  emit-public-source-format:
    if: github.repository == 'JibrilMohamud/cove' && github.event.pull_request.head.repo.full_name == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Explicitly format nested release sources with pinned Prettier, no gitignore bypass in shipping
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --ignore-path .prettierignore --write scripts/release/collect-protected-backend-503-graphql.mjs scripts/release/collect-protected-backend-503-graphql.test.mjs
          npx prettier --ignore-path .prettierignore --check scripts/release/collect-protected-backend-503-graphql.mjs scripts/release/collect-protected-backend-503-graphql.test.mjs
          printf '%s\n' COVE_FORMAT_BEGIN_COLLECTOR
          base64 -w 0 scripts/release/collect-protected-backend-503-graphql.mjs | fold -w 240
          printf '%s\n' COVE_FORMAT_END_COLLECTOR
          printf '%s\n' COVE_FORMAT_BEGIN_TEST
          base64 -w 0 scripts/release/collect-protected-backend-503-graphql.test.mjs | fold -w 240
          printf '%s\n' COVE_FORMAT_END_TEST
# Disposable PR-only public source formatting proof; do not deploy, write to repo or use secrets.
