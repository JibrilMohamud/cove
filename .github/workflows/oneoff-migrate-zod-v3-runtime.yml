name: oneoff-migrate-zod-v3-runtime
on:
  pull_request:
    paths:
      - ".github/workflows/oneoff-migrate-zod-v3-runtime.yml"
permissions:
  contents: read
jobs:
  migrate-compat-imports:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/secure-zod-v4-20261023'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { ref: fix/secure-zod-v4-20261023 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Preserve existing Zod 3 validation semantics under patched Zod 4
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          let files = 0, imports = 0;
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(full); continue; }
              if (!/\.(?:ts|tsx|js|mjs)$/.test(entry.name)) continue;
              let source = fs.readFileSync(full, 'utf8');
              const matched = source.match(/from\s+(['"])zod\1/g) || [];
              const rewritten = source.replace(/from\s+(['"])zod\1/g, 'from $1zod/v3$1');
              if (source !== rewritten) {
                fs.writeFileSync(full, rewritten);
                files++;
                imports += matched.length;
              }
            }
          }
          walk('src'); walk('scripts');
          if (files < 10) throw Error('Unexpectedly low Zod3 compatibility import count');
          console.log('Migrated', imports, 'existing Zod 3 imports in', files, 'app files');
          NODE
      - name: Commit compatibility changes only to security PR
        run: |
          if ! git diff --quiet -- src scripts; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add src scripts
            git commit -m "fix(zod): preserve legacy schema semantics via v4 zod/v3 entrypoint"
            git push origin HEAD:refs/heads/fix/secure-zod-v4-20261023
          fi
