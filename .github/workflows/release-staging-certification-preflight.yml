name: release-staging-certification-preflight
on:
  pull_request:
    paths:
      - ".github/workflows/release-staging-certification-preflight.yml"
      - ".github/workflows/cove-commerce-private-qa-deploy.yml"
      - ".github/workflows/strangler-hosted-capacity-evaluation.yml"
      - "scripts/check-release-staging-workflow-gates.mjs"
      - ".github/workflows/isolated-commons-audio-technical-qa.yml"
      - ".github/workflows/continuous-publication-qa.yml"
      - ".github/workflows/fast-storefront-real-catalog-acceptance.yml"
      - "scripts/check-geo-edge-ingress.mjs"
      - "scripts/staging/verify-geo-edge-ingress.mjs"
      - "scripts/performance/strangler-real-catalog-acceptance.mjs"
      - "src/storefront-strangler/worker.ts"
      - "scripts/staging/check-strangler-live-capacity.mjs"
      - "scripts/staging/assert-strangler-capacity-evidence.mjs"
      - "docs/LITERARY_LEGACY_DRAIN_CUTOVER.md"
permissions:
  contents: read
jobs:
  verify-main-only-private-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check scripts/check-release-staging-workflow-gates.mjs
      - run: node scripts/check-release-staging-workflow-gates.mjs
      - run: npm ci --no-audit --no-fund
      - name: Enforce canonical rights, music handoff replay and legacy drain non-regression
        run: |
          node scripts/check-music-canonical-handoff.mjs
          node scripts/check-music-canonical-replay.mjs
          node scripts/check-literary-legacy-reconcile.mjs
          npm run test:rights
          npm run test:soundtracks
