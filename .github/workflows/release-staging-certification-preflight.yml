name: release-staging-certification-preflight
on:
  pull_request:
    paths:
      - ".github/workflows/release-staging-certification-preflight.yml"
      - ".github/workflows/cove-commerce-private-qa-deploy.yml"
      - ".github/workflows/strangler-hosted-capacity-evaluation.yml"
      - "scripts/check-release-staging-workflow-gates.mjs"
      - "docs/LITERARY_LEGACY_DRAIN_CUTOVER.md"
permissions:
  contents: read
jobs:
  verify-main-only-private-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check scripts/check-release-staging-workflow-gates.mjs
      - run: node scripts/check-release-staging-workflow-gates.mjs
