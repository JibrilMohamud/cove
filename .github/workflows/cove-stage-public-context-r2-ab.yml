name: cove-private-r2-context-live-market-50-100rps-ab
on:
  push:
    branches: [perf/stage-context-r2-live-market-fence-20261115]
    paths:
      - scripts/staging/run-public-context-r2-ab.mjs
      - .github/workflows/cove-stage-public-context-r2-ab.yml
permissions:
  contents: read
concurrency:
  group: cove-isolated-causal-catalog-stage-driver
  cancel-in-progress: false
jobs:
  measured-stage-ab:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_ALLOW_SAFE_RESTORE: "1"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/checkout@v6
        with:
          ref: 3633dc9fd7f656cb386e38a2aa3fe2d17f7b8a49
          path: stage-driver
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Synthetic R2 metadata cannot authorize books, checkout or a paused market
        run: |
          node scripts/staging/check-synthetic-public-context-r2.mjs
          node scripts/staging/check-single-authority-catalog-stage.mjs
          node scripts/check-progressive-guest-catalog-total.mjs
      - name: Reconcile unchanged 314 protected writer sites with independent reviewer SHA
        run: |
          node scripts/reconcile-canonical-writers.mjs
          node scripts/rebase-canonical-writer-review.mjs --review-attestation=docs/architecture/2026-11-15-context-r2-live-market-source-attestation.json
      - name: Validate stage candidate and private driver source
        run: |
          node --check scripts/staging/run-public-context-r2-ab.mjs
          node --check stage-driver/scripts/staging/run-private-causal-triad.mjs
          node --test stage-driver/scripts/staging/private-causal-triad.worker.test.mjs
          npx prettier --check scripts/staging/run-public-context-r2-ab.mjs src/features/fore/synthetic-public-context-r2.stage.ts
      - name: Build real Worker candidate with unmodified production feature defaults
        run: npm run build:backend
      - name: Require isolated private Cloudflare deployment credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Identical compact primary-authority workload, D1 context vs private R2 public context
        run: node scripts/staging/run-public-context-r2-ab.mjs
      - name: Independently restore original private driver even after failure
        if: always()
        working-directory: stage-driver
        run: node scripts/staging/run-private-causal-triad.mjs --restore-only
      - name: Independently restore original candidate even after failure
        if: always()
        run: node scripts/staging/run-public-context-r2-ab.mjs --restore-only
      - name: Preserve complete sanitized 50-RPS/100-RPS verdict and rollback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-market-context-r2-ab-${{ github.run_id }}
          path: artifacts/public-context-r2-ab/
          retention-days: 14
          if-no-files-found: ignore
