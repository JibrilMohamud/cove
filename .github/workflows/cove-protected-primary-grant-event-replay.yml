name: cove-protected-primary-grant-event-replay
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/release/primary-grant-event-replay-policy.mjs"
      - "scripts/release/primary-grant-event-replay-policy.test.mjs"
      - "scripts/release/protected-primary-grant-event-replay.mjs"
      - "scripts/release/protected-primary-grant-event-replay.test.mjs"
      - "scripts/release/primary-historical-rights-inventory-policy.mjs"
      - "scripts/release/primary-historical-rights-inventory-policy.test.mjs"
      - ".github/workflows/cove-protected-primary-grant-event-replay.yml"
      - ".github/workflows/cove-protected-full-primary-historical-rights.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Review the exact main commit before full primary-D1 legal-history read."
        type: string
        required: true
      confirm_select_only_replay:
        description: "Read-only replay of grants; no owner authorization, rights, production rollout or Stripe changes."
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  offline-full-grant-history-protocol:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Deny-first SQLite replay, terminal revocation and event-order checks
        run: >-
          node --no-warnings --test
          scripts/release/primary-grant-event-replay-policy.test.mjs
          scripts/release/protected-primary-grant-event-replay.test.mjs
          scripts/release/protected-d1-read-throttle.test.mjs
          scripts/release/primary-historical-rights-inventory-policy.test.mjs
      - name: Confirm protected manual mode and fixed SELECT contracts
        run: node --no-warnings scripts/release/protected-primary-grant-event-replay.mjs --self-test
      - name: No generated mutation or formatting errors
        run: |
          node --check scripts/release/primary-grant-event-replay-policy.mjs
          node --check scripts/release/protected-primary-grant-event-replay.mjs
          git diff --check
  protected-full-primary-grant-replay:
    needs: offline-full-grant-history-protocol
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.reviewed_main_sha == github.sha &&
      inputs.confirm_select_only_replay == true
    environment: cove-production-release-audit
    concurrency:
      group: cove-protected-primary-d1-legal-audit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Replay every primary grant audit event against current primary D1, SELECT only
        run: node --no-warnings scripts/release/protected-primary-grant-event-replay.mjs --live
        env:
          CF_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
          COVE_PRODUCTION_D1_ID: 4bd657ac-8789-403e-a28c-93aba8d0a989
          COVE_PRODUCTION_LEGAL_AUDIT_ONLY: "1"
          COVE_CF_PRODUCTION_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_PRODUCTION_AUDIT_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cove-primary-grant-event-replay-${{ github.run_id }}
          path: artifacts/production-rights-history/grant-event-replay.json
          if-no-files-found: ignore
          retention-days: 30
