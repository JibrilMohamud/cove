# Temporary one-time formatting of the new optional CPU profiling module.
# This workflow is removed immediately after producing the formatted commit.
name: latency-profile-format-once
on:
  push:
    branches: [perf/latency-attribution-ladder-20261019]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format profile helper
        run: |
          npx prettier --write scripts/performance/capture-worker-cpu.mjs
          git add scripts/performance/capture-worker-cpu.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(perf): format CPU capture helper'
            git push origin HEAD:perf/latency-attribution-ladder-20261019
          fi
