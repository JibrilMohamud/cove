# Temporary read-only diagnostic: prints CodeQL rule IDs, file and line for
# branch alerts. It never requests source snippets or exposes credentials.
name: codeql-pr-alert-diagnostics
on:
  pull_request:
    paths:
      - ".github/workflows/codeql-pr-alert-diagnostics.yml"
  workflow_dispatch:
permissions:
  contents: read
  security-events: read
jobs:
  current-branch-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Identify actionable findings from CodeQL branch alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const refs = [null, "refs/heads/" + process.env.HEAD_REF, "refs/pull/266/head", "refs/pull/266/merge"];
          for (const ref of refs) {
            for (const state of ["open","dismissed","fixed"]) {
              const url = new URL(`https://api.github.com/repos/${process.env.REPO}/code-scanning/alerts`);
              url.searchParams.set("state", state);
              if (ref) url.searchParams.set("ref", ref);
              url.searchParams.set("per_page", "100");
              const response = await fetch(url, {headers: {
                authorization: "Bearer " + process.env.GH_TOKEN,
                accept: "application/vnd.github+json",
                "x-github-api-version": "2022-11-28",
              }});
              if (!response.ok) {console.log("SCOPED_CODEQL_READ", ref, state, response.status);continue;}
              const alerts = await response.json();
              console.log("SCOPED_CODEQL_COUNT", ref || "default", state, alerts.length);
              for (const a of alerts.slice(0,30)) {
                const loc = a.most_recent_instance?.location || {};
                console.log(JSON.stringify({
                  number:a.number, tool:a.tool?.name, rule:a.rule?.id,
                  severity:a.rule?.security_severity_level, path:loc.path,
                  line:loc.start_line, ref:a.most_recent_instance?.ref,
                  message:a.most_recent_instance?.message?.text?.slice(0,220)
                }));
              }
            }
          }
          NODE
