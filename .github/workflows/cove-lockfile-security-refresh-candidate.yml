name: cove-lockfile-security-refresh-candidate

# ONE branch, ONE source change: the workflow itself. Never runs on main,
# never receives secrets and never changes package.json or production.
on:
  push:
    branches: [fix/npm-audit-remediation-20261117]
    paths:
      - ".github/workflows/cove-lockfile-security-refresh-candidate.yml"

permissions:
  contents: read

jobs:
  lockfile-candidate:
    if: github.repository == 'JibrilMohamud/cove' && github.ref == 'refs/heads/fix/npm-audit-remediation-20261117'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Refresh only compatible lockfile transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          refresh_status=$?
          set -e
          echo "NPM_COMPATIBLE_REFRESH_STATUS=$refresh_status"
          git diff --exit-code -- package.json
          test -n "$(git status --porcelain -- package-lock.json)" || {
            echo "::error::No compatible dependency lockfile changes are available"
            exit 1
          }
      - name: Commit candidate lockfile to this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/npm-audit-remediation-20261117"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "fix(deps): update compatible transitive security pins"
          git push origin HEAD:refs/heads/fix/npm-audit-remediation-20261117
      - name: Report remaining high advisories without suppressing them
        if: always()
        shell: bash
        run: |
          npm audit --audit-level=high
