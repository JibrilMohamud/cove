name: verify-production-disabled-owner-handshake

on:
  push:
    branches: [main]
    paths:
      - "scripts/prove-production-owner-handshake.mjs"
      - "scripts/staging/strict-ephemeral-route-denial*.mjs"
      - ".github/workflows/verify-production-disabled-owner-handshake.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never race the same canonical owner/backend binding proof with a production
# backend deploy, primary D1 acceptance campaign or another owner verifier.
concurrency:
  group: cove-exclusive-real-primary-cold-acceptance
  cancel-in-progress: false

jobs:
  verify-disabled-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Require production metadata credential without displaying its value
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d26430caa63ec55f6612e32f36aca5e9"
      - name: Verify bounded strict private denial semantics
        run: node --test scripts/staging/strict-ephemeral-route-denial.test.mjs
      - name: Require disabled production owner and read-only D1 binding proof
        run: node scripts/check-production-owner-binding.mjs --after-deploy
      - name: Prove live disabled owner against new ephemeral verifier, then delete it
        run: node scripts/prove-production-owner-handshake.mjs
      - name: Upload non-authorizing proof even after failed live gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-disabled-owner-handshake-${{ github.run_id }}
          path: artifacts/production-owner-handshake/result.json
          if-no-files-found: ignore
          retention-days: 7
