name: verify-production-disabled-owner-handshake

on:
  pull_request:
    paths:
      - "scripts/staging/owner-handshake-cloudflare-credentials.mjs"
      - "scripts/staging/owner-handshake-cloudflare-credentials.test.mjs"
      - "scripts/prove-production-owner-handshake.mjs"
      - "scripts/check-production-owner-binding.mjs"
      - ".github/workflows/verify-production-disabled-owner-handshake.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Approve the exact main SHA before Cloudflare API access."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Explicitly approve this Cloudflare action; never auto-run on source merge."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Never race the same canonical owner/backend binding proof with a production
# backend deploy, primary D1 acceptance campaign or another owner verifier.
concurrency:
  group: cove-exclusive-real-primary-cold-acceptance
  cancel-in-progress: false

jobs:
  offline-credential-boundary:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --test scripts/staging/owner-handshake-cloudflare-credentials.test.mjs
      - run: node --check scripts/prove-production-owner-handshake.mjs
  verify-disabled-owner:
    needs: offline-credential-boundary
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN: ${{ secrets.COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Require production metadata credential without displaying its value
        shell: bash
        run: |
          set -euo pipefail
          test "${#COVE_CF_WORKERS_METADATA_READ_TOKEN}" -ge 20
          test "${#COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN}" -ge 20
          test "$COVE_CF_WORKERS_METADATA_READ_TOKEN" != "$COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "d26430caa63ec55f6612e32f36aca5e9"
      - name: Verify bounded strict private denial semantics
        run: node --test scripts/staging/strict-ephemeral-route-denial.test.mjs
      - name: Require disabled production owner and read-only D1 binding proof
        run: node scripts/check-production-owner-binding.mjs --after-deploy
      - name: Prove live disabled owner against new ephemeral verifier, then delete it
        run: node scripts/prove-production-owner-handshake.mjs
      - name: Upload non-authorizing proof even after failed live gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-disabled-owner-handshake-${{ github.run_id }}
          path: artifacts/production-owner-handshake/result.json
          if-no-files-found: ignore
          retention-days: 7
