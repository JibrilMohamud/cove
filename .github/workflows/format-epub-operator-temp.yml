name: Temporary EPUB operator formatter
on:
  push:
    branches:
      - fix/epub-backfill-live-grants-20261020
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/epub-backfill-live-grants-20261020
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/operate-regional-epub-backfill.mjs scripts/check-regional-epub-operator.mjs
      - name: Commit scoped formatting
        run: |
          if ! git diff --quiet -- scripts/operate-regional-epub-backfill.mjs scripts/check-regional-epub-operator.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/operate-regional-epub-backfill.mjs scripts/check-regional-epub-operator.mjs
            git commit -m 'style(ops): format regional EPUB backfill coordinator'
            git push origin HEAD:fix/epub-backfill-live-grants-20261020
          fi
