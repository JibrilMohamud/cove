name: audio-python-runtime-smoke-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audio-python-runtime-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audio service dependencies
        run: pip install -r scripts/requirements.txt
      - name: Import FastAPI service
        working-directory: scripts
        run: |
          python - <<'PY'
          from audio_pipeline.service import app, health
          print("routes", sorted(r.path for r in app.routes))
          print("health", health())
          PY
