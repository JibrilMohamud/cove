name: literary-guarded-owner-drain
on:
  pull_request:
    paths:
      - ".github/workflows/literary-guarded-owner-drain.yml"
      - "scripts/staging/literary-drain-operator-lib.mjs"
      - "scripts/staging/activate-literary-drain.mjs"
      - "scripts/staging/verify-literary-drain-progress.mjs"
      - "scripts/staging/rollback-literary-drain.mjs"
      - "scripts/check-literary-drain-operation-policy.mjs"
      - "scripts/staging/verify-literary-postpublication-readonly.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-guarded-owner-drain.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA for protected Cloudflare operations"
        type: string
        required: true
      confirm_protected_cloudflare_action:
        description: "Explicitly approve read-only production literary verification"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cove-literary-drain-activation
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/literary-drain-operator-lib.mjs
      - run: node --check scripts/staging/activate-literary-drain.mjs
      - run: node --check scripts/staging/verify-literary-drain-progress.mjs
      - run: node --check scripts/staging/rollback-literary-drain.mjs
      - run: node scripts/check-literary-drain-operation-policy.mjs
  protected-post-drain-observation:
    needs: static
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      # Historical verifier environment name; the value is strictly D1 Read.
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_BIOSYNC_PROD_D1_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Verify isolated owner, current budget and real canonical publication (read only)
        run: node scripts/staging/verify-literary-postpublication-readonly.mjs
