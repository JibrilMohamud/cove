name: persistence-backend

on:
  pull_request:
    paths:
      - "src/lib/persistence-backend.ts"
      - "src/persistence-backend.worker.ts"
      - "src/lib/catalog-ingestion-backpressure.ts"
      - "src/lib/catalog-ingestion-idempotency.ts"
      - "scripts/check-catalog-ingestion-idempotency.mjs"
      - "scripts/check-catalog-ingestion-backpressure.mjs"
      - "src/server.ts"
      - "src/features/fore/**"
      - "scripts/check-d1-pending-search-outbox-noop.py"
      - "scripts/check-taxonomy-noop-fts-write.py"
      - "scripts/check-catalog-fts-text-only-update.py"
      - "scripts/check-taxonomy-differential-reconcile.py"
      - "scripts/check-taxonomy-queued-outbox-noop.py"
      - "scripts/check-search-outbox-atomic-ack.mjs"
      - "scripts/check-gutendex-popularity-only.mjs"
      - "scripts/check-gutendex-popularity-cas.py"
      - "scripts/check-literary-genre-rights-query.mjs"
      - "scripts/audio_pipeline/**"
      - "scripts/build-persistence-backend.mjs"
      - "scripts/check-persistence-backend.mjs"
      - "scripts/check-hosted-biosync-chunks.mjs"
      - "scripts/check-catalog-fetch.mjs"
      - "scripts/check-auth.mjs"
      - "scripts/check-legal-contact.mjs"
      - "scripts/check-account-experience.mjs"
      - "scripts/check-service.mjs"
      - "scripts/check-commercial-experience.mjs"
      - "scripts/check-search-updater-cache.mjs"
      - "scripts/check-reader-sharing-offline.mjs"
      - "scripts/check-sharing-erasure.mjs"
      - "scripts/check-journey-privacy-progress.mjs"
      - "scripts/check-social-pagination.mjs"
      - "scripts/check-compute-budget.mjs"
      - "scripts/check-matching-engine.mjs"
      - "scripts/matching/**"
      - "scripts/check-store.mjs"
      - "drizzle/*.sql"
      - "vercel.json"
      - "wrangler.backend.example.toml"
      - "wrangler.backend.production.toml"
      - "package.json"
      - ".github/workflows/persistence-backend.yml"
      - ".github/workflows/deploy-persistence-backend.yml"
      - "VERCEL_DEPLOY.md"
      - "docs/VERCEL_PERSISTENCE_BACKEND.md"
  push:
    branches: [main]
    paths:
      - "src/lib/persistence-backend.ts"
      - "src/persistence-backend.worker.ts"
      - "src/lib/catalog-ingestion-backpressure.ts"
      - "src/lib/catalog-ingestion-idempotency.ts"
      - "scripts/check-catalog-ingestion-idempotency.mjs"
      - "scripts/check-catalog-ingestion-backpressure.mjs"
      - "src/server.ts"
      - "src/features/fore/**"
      - "scripts/check-d1-pending-search-outbox-noop.py"
      - "scripts/check-taxonomy-noop-fts-write.py"
      - "scripts/check-catalog-fts-text-only-update.py"
      - "scripts/check-taxonomy-differential-reconcile.py"
      - "scripts/check-taxonomy-queued-outbox-noop.py"
      - "scripts/check-search-outbox-atomic-ack.mjs"
      - "scripts/check-gutendex-popularity-only.mjs"
      - "scripts/check-gutendex-popularity-cas.py"
      - "scripts/audio_pipeline/**"
      - "scripts/build-persistence-backend.mjs"
      - "scripts/check-persistence-backend.mjs"
      - "scripts/check-hosted-biosync-chunks.mjs"
      - "scripts/check-catalog-fetch.mjs"
      - "scripts/check-auth.mjs"
      - "scripts/check-legal-contact.mjs"
      - "scripts/check-account-experience.mjs"
      - "scripts/check-service.mjs"
      - "scripts/check-commercial-experience.mjs"
      - "scripts/check-search-updater-cache.mjs"
      - "scripts/check-reader-sharing-offline.mjs"
      - "scripts/check-sharing-erasure.mjs"
      - "scripts/check-journey-privacy-progress.mjs"
      - "scripts/check-social-pagination.mjs"
      - "scripts/check-compute-budget.mjs"
      - "scripts/check-matching-engine.mjs"
      - "scripts/matching/**"
      - "scripts/check-store.mjs"
      - "drizzle/*.sql"
      - "vercel.json"
      - "wrangler.backend.example.toml"
      - "wrangler.backend.production.toml"
      - "package.json"
      - ".github/workflows/persistence-backend.yml"
      - ".github/workflows/deploy-persistence-backend.yml"
      - "VERCEL_DEPLOY.md"
      - "docs/VERCEL_PERSISTENCE_BACKEND.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Persistence TypeScript lint
        run: npx eslint src/lib/persistence-backend.ts src/persistence-backend.worker.ts
      - name: Persistence architecture
        run: npm run test:persistence-backend
      - name: Soundtrack library rights and delivery regressions
        run: npm run test:soundtracks
      - name: Literary profiles, evidence and chapter-matching regressions
        run: npm run test:literary-profiles
      - name: Core reading delivery and live rights reliability
        run: npm run test:reading-reliability
      - name: Literary discovery, satisfaction and privacy regressions
        run: npm run test:literary-discovery
      - name: Chapter-recording matching and playlist sequencing
        run: npm run test:matching
      - name: Exact-master music profiling and queue safety
        run: npm run test:music-profiles
      - name: Resumable hosted BioSync
        run: npm run test:biosync-chunks
      - name: Account sign-up and privacy requests
        run: |
          npm run test:auth
          npm run test:legal
          npm run test:account-experience
      - name: Personal library and highlights regressions
        # The separate storefront search suite requires a seeded FTS catalog;
        # the persistence test runner intentionally starts with empty D1.
        run: npm run test:service
      - name: Customer support, status and recovery
        run: npm run test:commercial-experience
      - name: Search, updater and public caching
        run: |
          npm run test:search-updater-cache
          node scripts/check-public-search-count-scope.mjs
          node scripts/check-catalog-ingestion-backpressure.mjs
          node scripts/check-catalog-ingestion-idempotency.mjs
          node scripts/check-gutendex-popularity-only.mjs
          python3 scripts/check-gutendex-popularity-cas.py
          node scripts/check-catalog-added-sort-index.mjs
          node scripts/check-taxonomy-presentation-count-cache.mjs
          node scripts/check-taxonomy-count-refresh-lease.mjs
          python3 scripts/check-taxonomy-noop-fts-write.py
          python3 scripts/check-catalog-fts-text-only-update.py
          python3 scripts/check-d1-pending-search-outbox-noop.py
          python3 scripts/check-taxonomy-differential-reconcile.py
          python3 scripts/check-taxonomy-queued-outbox-noop.py
          node scripts/check-search-outbox-atomic-ack.mjs
          node scripts/check-sparse-taxonomy-rights-counts.mjs
          node scripts/check-secondary-channel-index.mjs
          node scripts/check-external-identifier-index.mjs
          node scripts/check-live-channel-zero-grant-gate.mjs
          node scripts/check-bounded-cached-rights-recheck.mjs
          node scripts/check-facet-cache-identity.mjs
          npm run test:recommendations
          node scripts/check-literary-genre-rights-query.mjs
      - name: Indexed FTS trigger identity, suppression, deletion and bounded work
        run: python3 scripts/check-fts-trigger-lookup.py
      - name: Reader rendering, share withdrawal and offline authorization
        run: npm run test:reader-sharing-offline
      - name: Direct sharing, group discussions and account erasure
        run: npm run test:sharing-erasure
      - name: Journey access, authoritative progress and social pagination
        run: |
          npm run test:journey-privacy-progress
          npm run test:social-pagination
      - name: Catalog network recovery
        run: node scripts/check-catalog-fetch.mjs
      - name: Regional canonical EPUB reader-asset and withdrawal repair
        run: npm run test:regional-epub-repair
      - name: Compute budget and cache privacy
        # Budget/privacy assertions run without paid services or production data.
        run: npm run test:compute-budget
      - name: Python syntax
        run: python3 -m py_compile scripts/audio_pipeline/*.py
      - name: Audio runtime regressions
        run: |
          python3 -m pip install 'fastapi==0.141.1' 'vercel-queue==0.9.0' 'huggingface-hub>=0.21,<2' 'av>=11,<19' httpx
          python3 -m unittest discover -s scripts/audio_pipeline/tests -v
      - name: Vercel application build
        run: npm run build
        env:
          VERCEL: "1"
      - name: Persistence Worker build
        run: npm run build:backend
      - name: Upload persistence Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: cove-persistence-worker
          path: backend-dist/worker.js
          if-no-files-found: error
          retention-days: 1
