name: cove-stage-real-catalog-readonly
on:
  push:
    branches: [audit/stage-real-catalog-metadata-readonly-20261115]
    paths:
      - src/storefront-strangler/production-catalog-metadata-readonly.stage.mjs
      - src/storefront-strangler/owner-production-fts-mirror.stage.mjs
      - scripts/staging/check-production-catalog-metadata-readonly.mjs
      - scripts/staging/check-stage-production-fts-mirror.mjs
      - scripts/staging/check-real-metadata-canonical-owner-handoff.mjs
      - scripts/staging/check-production-canonical-rights-readonly.mjs
      - scripts/staging/run-production-catalog-metadata-readonly.mjs
      - .github/workflows/cove-stage-real-catalog-readonly.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type READ_ONLY_AUDIT for metadata or RIGHTS_SPOT_AUDIT for the eight-product canonical rights check"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cove-readonly-d1-catalog-full-audit
  cancel-in-progress: false
jobs:
  offline-read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --check src/storefront-strangler/production-catalog-metadata-readonly.stage.mjs
      - run: node --check scripts/staging/check-production-catalog-metadata-readonly.mjs
      - run: node --check scripts/staging/run-production-catalog-metadata-readonly.mjs
      - run: node --check scripts/staging/check-production-canonical-rights-readonly.mjs
      - run: npm ci
      - run: node --no-warnings scripts/staging/check-production-canonical-rights-readonly.mjs --self-test
      - run: node --check scripts/staging/check-real-metadata-canonical-owner-handoff.mjs
      - name: Verify read-only SQL, full source reconstruction and fail-closed negative cases
        run: node --no-warnings scripts/staging/check-production-catalog-metadata-readonly.mjs
      - name: Check production-shaped FTS mirror and independent owner fence
        run: node --no-warnings scripts/staging/check-stage-production-fts-mirror.mjs
      - name: Verify canonical owner-approved FTS handoff, withdrawn contracts and market veto
        run: node --no-warnings scripts/staging/check-real-metadata-canonical-owner-handoff.mjs
      - run: git diff --check
  protected-live-readonly-scan:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/audit/stage-real-catalog-metadata-readonly-20261115' &&
      inputs.confirm == 'READ_ONLY_AUDIT'
    needs: [offline-read-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cove-production-release-audit
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Observe full live production metadata WITHOUT grants, writes or exports
        run: node --no-warnings scripts/staging/run-production-catalog-metadata-readonly.mjs --live
        env:
          CF_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
          COVE_CF_PRODUCTION_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_PRODUCTION_AUDIT_READ_TOKEN }}
  protected-live-rights-spot-audit:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/audit/stage-real-catalog-metadata-readonly-20261115' &&
      inputs.confirm == 'RIGHTS_SPOT_AUDIT'
    needs: [offline-read-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cove-production-release-audit
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Compare up to eight real current production rights decisions, READ ONLY
        run: node --no-warnings scripts/staging/check-production-canonical-rights-readonly.mjs --live
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          CF_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
          COVE_PRODUCTION_D1_ID: 4bd657ac-8789-403e-a28c-93aba8d0a989
          COVE_PRODUCTION_LEGAL_AUDIT_ONLY: '1'
          COVE_CF_PRODUCTION_AUDIT_READ_TOKEN: ${{ secrets.COVE_CF_PRODUCTION_AUDIT_READ_TOKEN }}
