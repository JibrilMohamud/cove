name: format-quiet-benchmark-draft-once
on:
  pull_request:
    paths:
      - ".github/workflows/format-quiet-benchmark-draft-once.yml"
permissions:
  contents: read
jobs:
  format-owned-draft:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/automated-quiet-music-diversity-20261023'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { ref: feat/automated-quiet-music-diversity-20261023 }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/quiet-reading-benchmark.mjs scripts/check-quiet-reading-benchmark.mjs
      - name: Commit formatting only to draft branch
        run: |
          if ! git diff --quiet -- scripts/quiet-reading-benchmark.mjs scripts/check-quiet-reading-benchmark.mjs; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add scripts/quiet-reading-benchmark.mjs scripts/check-quiet-reading-benchmark.mjs
            git commit -m "style(music): format blinded-listening acceptance metric harness"
            git push origin HEAD:refs/heads/feat/automated-quiet-music-diversity-20261023
          fi
