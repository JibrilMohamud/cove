name: cove-sounds-verified-conversion-report
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate-only-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate SQL read-only safety and reporting labels
        run: |
          node scripts/staging/report-cove-sounds-verified-conversion.mjs --self-test
          node scripts/staging/report-cove-sounds-market-readiness.mjs --self-test
      - name: Read-only canonical paid orders and anonymous Analytics Engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/staging/report-cove-sounds-verified-conversion.mjs
      - name: Audit licensed inventory in all active storefront countries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/staging/report-cove-sounds-market-readiness.mjs
