name: cove-sounds-verified-conversion-report
on:
  pull_request:
    paths:
      - "scripts/staging/report-cove-sounds-verified-conversion.mjs"
      - ".github/workflows/cove-sounds-verified-conversion-report.yml"
  push:
    branches: [main]
    paths:
      - "scripts/staging/report-cove-sounds-verified-conversion.mjs"
      - ".github/workflows/cove-sounds-verified-conversion-report.yml"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting-response-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate D1 and Analytics Engine response contracts without credentials
        run: |
          node --check scripts/staging/report-cove-sounds-verified-conversion.mjs
          node scripts/staging/report-cove-sounds-verified-conversion.mjs --self-test
          node scripts/staging/report-cove-sounds-market-readiness.mjs --self-test
  aggregate-only-report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate SQL read-only safety and reporting labels
        run: |
          node scripts/staging/report-cove-sounds-verified-conversion.mjs --self-test
          node scripts/staging/report-cove-sounds-market-readiness.mjs --self-test
      - name: Read-only canonical paid orders and anonymous Analytics Engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/staging/report-cove-sounds-verified-conversion.mjs
      - name: Audit licensed inventory in all active storefront countries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/staging/report-cove-sounds-market-readiness.mjs
