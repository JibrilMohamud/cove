name: cove-canonical-read-phases-offline
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/canonical-readonly/worker.ts"
      - "src/lib/readonly-transport-metric.ts"
      - "src/lib/canonical-readonly-d1.server.ts"
      - "src/features/fore/catalog-model.server.ts"
      - "src/features/fore/storefront-anonymous-bootstrap.server.ts"
      - "src/features/fore/storefront-hedged-fetch.ts"
      - "scripts/staging/check-canonical-read-phase-timing.mjs"
      - ".github/workflows/cove-canonical-read-phases-offline.yml"

permissions:
  contents: read

jobs:
  numeric-only-stage-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/staging/check-canonical-read-phase-timing.mjs
      - run: git diff --check
