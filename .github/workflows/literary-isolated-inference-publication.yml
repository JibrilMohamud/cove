name: literary-isolated-inference-publication
on:
  pull_request:
    paths:
      - "src/lib/literary-isolated-inference.server.ts"
      - "src/lib/literary-private-publication.server.ts"
      - "infra/content-budget/0010_literary_private_publication_retries.sql"
      - "scripts/check-literary-private-publication.mjs"
      - "src/features/fore/literary-profiles.server.ts"
      - "scripts/check-literary-owner-cutover.mjs"
      - "scripts/check-literary-legacy-reconcile.mjs"
      - "src/lib/literary-legacy-reconcile.server.ts"
      - "infra/content-budget/0008_legacy_reconcile_frontier.sql"
      - "infra/literary-cutover/0001_legacy_reconcile_primary_index.sql"
      - "src/lib/literary-job-settlement.server.ts"
      - "infra/content-budget/0009_job_settlements_and_ai_usage.sql"
      - "scripts/check-literary-job-settlement.mjs"
      - "src/content-processing.worker.ts"
      - "src/lib/literary-budget-domain.server.ts"
      - "src/lib/literary-prepare-outbox.server.ts"
      - "src/lib/literary-preparation-domain.server.ts"
      - "infra/content-budget/0006_isolated_inference.sql"
      - "infra/content-budget/0007_inference_seed_frontier.sql"
      - "scripts/check-literary-isolated-inference.mjs"
      - "scripts/check-literary-publisher-gateway.mjs"
      - "src/literary-inference-publisher.worker.ts"
      - ".github/workflows/literary-isolated-inference-publication.yml"
permissions:
  contents: read
jobs:
  physical-domains-and-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-literary-isolated-inference.mjs
      - run: node scripts/check-literary-private-publication.mjs
      - run: node scripts/check-literary-owner-cutover.mjs
      - run: node scripts/check-literary-legacy-reconcile.mjs
      - run: node scripts/check-literary-job-settlement.mjs
      - run: node scripts/check-literary-publisher-gateway.mjs
      - run: node scripts/build-literary-inference-publisher.mjs
      - run: npm run typecheck
      - run: node scripts/check-literary-prepare-outbox.mjs
      - run: node scripts/check-literary-preparation-domain.mjs
      - run: node scripts/check-literary-prepared-projection.mjs
      - run: node scripts/check-literary-budget-domain.mjs
      - run: node scripts/check-literary-budget-settlement.mjs
      - run: node scripts/check-content-processing-isolation.mjs
      - run: npm run test:rights
      - run: npx eslint src/lib/literary-isolated-inference.server.ts src/content-processing.worker.ts src/lib/literary-budget-domain.server.ts src/lib/literary-preparation-domain.server.ts src/lib/literary-prepare-outbox.server.ts scripts/check-literary-isolated-inference.mjs src/literary-inference-publisher.worker.ts scripts/check-literary-publisher-gateway.mjs src/lib/literary-job-settlement.server.ts scripts/check-literary-job-settlement.mjs src/features/fore/literary-profiles.server.ts scripts/check-literary-owner-cutover.mjs src/lib/literary-legacy-reconcile.server.ts scripts/check-literary-legacy-reconcile.mjs src/lib/literary-private-publication.server.ts scripts/check-literary-private-publication.mjs
      - run: npx prettier --check src/lib/literary-isolated-inference.server.ts src/content-processing.worker.ts src/lib/literary-budget-domain.server.ts src/lib/literary-preparation-domain.server.ts src/lib/literary-prepare-outbox.server.ts scripts/check-literary-isolated-inference.mjs src/literary-inference-publisher.worker.ts scripts/check-literary-publisher-gateway.mjs src/lib/literary-job-settlement.server.ts scripts/check-literary-job-settlement.mjs src/features/fore/literary-profiles.server.ts scripts/check-literary-owner-cutover.mjs src/lib/literary-legacy-reconcile.server.ts scripts/check-literary-legacy-reconcile.mjs src/lib/literary-private-publication.server.ts scripts/check-literary-private-publication.mjs
