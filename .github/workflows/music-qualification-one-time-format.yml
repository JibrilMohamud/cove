name: music-qualification-one-time-format
on:
  push:
    branches: [feat/isolated-music-qualification-20261024]
    paths: [.github/workflows/music-qualification-one-time-format.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/isolated-music-qualification-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only new isolated music qualification files
        run: |
          npx prettier --write src/music-supply/analysis.ts src/music-supply/catalog-projection.ts src/music-supply/worker.ts scripts/check-isolated-music-supply.mjs
          if ! git diff --quiet; then
            git config user.name "cove-format-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/music-supply/analysis.ts src/music-supply/catalog-projection.ts src/music-supply/worker.ts scripts/check-isolated-music-supply.mjs
            git commit -m "style(music): format isolated qualification"
            git push origin HEAD:feat/isolated-music-qualification-20261024
          fi
