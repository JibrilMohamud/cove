name: private-publishing-editor-owner
on:
  pull_request:
    paths:
      - "src/features/fore/publishing.server.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/canonical-owner-command-gateway.ts"
      - "src/storefront-strangler/publication-owner-routing.server.ts"
      - "docs/architecture/canonical-writer-review.json"
      - "scripts/check-retired-publishing-editor-owner.mjs"
      - ".github/workflows/private-publishing-editor-owner.yml"
permissions: {contents: read}
jobs:
  qa-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-retired-publishing-editor-owner.mjs
      - run: node scripts/reconcile-canonical-writers.mjs
      - run: npm run typecheck
