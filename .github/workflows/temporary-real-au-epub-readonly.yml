name: temporary-real-au-epub-readonly
on:
  push:
    branches:
      - fix/epub-backfill-live-grants-20261020
    paths:
      - "scripts/staging/epub-real-source-readonly.ts"
      - ".github/workflows/temporary-real-au-epub-readonly.yml"
permissions:
  contents: read
concurrency:
  group: cove-real-au-epub-ephemeral-readonly
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe real EPUB ZIP/OPF and live market contrast read only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Missing Cloudflare staging token"; exit 1; }
          npx esbuild scripts/staging/epub-real-source-readonly.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=./epub-real-readonly.mjs
          cat > epub-real-smoke.toml <<'EOF'
          name = "cove-epub-real-au-readonly-smoke"
          main = "./epub-real-readonly.mjs"
          compatibility_date = "2026-10-09"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "cove-production"
          database_id = "4bd657ac-8789-403e-a28c-93aba8d0a989"
          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "cove-production-media"
          EOF
          cleanup() { npx wrangler delete --config epub-real-smoke.toml --force || true; }
          trap cleanup EXIT
          npx wrangler deploy --config epub-real-smoke.toml
          SMOKE_TOKEN=$(openssl rand -hex 40)
          printf %s "$SMOKE_TOKEN" | npx wrangler secret put SMOKE_TOKEN --config epub-real-smoke.toml
          sleep 6
          BODY=$(curl --retry 7 --retry-all-errors --retry-delay 2 \
            --fail-with-body --silent --show-error --max-time 55 \
            -H "x-smoke-token: $SMOKE_TOKEN" -X POST \
            "https://cove-epub-real-au-readonly-smoke.cove-jibrilmohamud.workers.dev/__isolated-readonly")
          echo "$BODY"
          node -e 'const r=JSON.parse(process.argv[1]); if(!r.pass || r.checked!==3 || r.deniedUS!==3)process.exit(1)' "$BODY"
