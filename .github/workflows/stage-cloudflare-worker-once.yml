name: stage-cloudflare-worker-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage-cloudflare-worker-once.yml"

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stage verified Worker bundle into private R2
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors             https://cove-deploy-stager.cove-jibrilmohamud.workers.dev/stage-caf594e)"
          printf '%s\n' "$response"
          RESPONSE="$response" node --input-type=module - <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE);
          if (
            payload.ok !== true ||
            payload.bytes !== 1912523 ||
            payload.sha256 !== "9ab3b58bcd2da0e8b969a1f1e9ecea0d1625329791fc25c8ab2595406157e295"
          ) {
            throw new Error("Cloudflare staging integrity check failed");
          }
          NODE
