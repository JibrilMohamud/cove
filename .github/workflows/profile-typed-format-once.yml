name: One-shot profile type formatting
on:
  push:
    branches: [feat/letterboxd-inspired-reader-profiles-20261101]
    paths: [.github/workflows/profile-typed-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/features/fore/CommunityProfileRoute.tsx
      - run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/fore/CommunityProfileRoute.tsx
          git commit -m 'style: format typed reader profile'
          git push origin HEAD:refs/heads/feat/letterboxd-inspired-reader-profiles-20261101
