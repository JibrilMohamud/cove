name: cove-taxonomy-global-count-budget-offline

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/fore/taxonomy-counts-cache.server.ts"
      - "scripts/check-taxonomy-count-refresh-lease.mjs"
      - "scripts/check-taxonomy-presentation-count-cache.mjs"
      - "scripts/check-sparse-taxonomy-rights-counts.mjs"
      - ".github/workflows/cove-taxonomy-global-count-budget-offline.yml"

permissions:
  contents: read

jobs:
  global-count-refresh-budget:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cross-market lease, takeover, bounded-stale and rights-scope regressions
        run: |
          node scripts/check-taxonomy-count-refresh-lease.mjs
          node scripts/check-taxonomy-presentation-count-cache.mjs
          node scripts/check-sparse-taxonomy-rights-counts.mjs
      - name: Strict formatting of changed source and test
        run: npx prettier --check src/features/fore/taxonomy-counts-cache.server.ts scripts/check-taxonomy-count-refresh-lease.mjs
      - name: TypeScript validation
        run: npm run typecheck

# Source-only, no deployments, Cloudflare credentials, D1 SQL or customer traffic.
# The mandatory separate supply-chain audit must still pass before any merge.
