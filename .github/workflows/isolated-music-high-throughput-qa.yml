name: isolated-music-high-throughput-qa

# No scheduled public/customer work. A QA operator must set the repository
# variable and distinct credentials. All stages use the detached music database.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Explicitly run the isolated QA source and analysis consumers"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

# Avoid multiple campaigns inadvertently exceeding source budgets; per-contract
# admission is still enforced atomically within detached MUSIC_DB.
concurrency:
  group: isolated-music-high-throughput
  cancel-in-progress: false

jobs:
  licensed-source-intake:
    if: vars.COVE_MUSIC_HIGH_THROUGHPUT_QA == '1' && (github.event_name == 'schedule' || inputs.execute == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVE_MUSIC_SUPPLY_QA_URL: ${{ vars.COVE_MUSIC_SUPPLY_QA_URL }}
      COVE_MUSIC_SUPPLY_INGEST_TOKEN: ${{ secrets.COVE_MUSIC_SUPPLY_INGEST_TOKEN }}
      COVE_MUSIC_EXECUTION_RUNNER_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Process leased, source-throttled master transfers
        run: node scripts/music-supply/drain-source-intake.mjs --execute --workers=4 --max-tracks=32 --max-minutes=20

  isolated-full-decode-qa:
    if: vars.COVE_MUSIC_HIGH_THROUGHPUT_QA == '1' && (github.event_name == 'schedule' || inputs.execute == true)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COVE_MUSIC_SUPPLY_QA_URL: ${{ vars.COVE_MUSIC_SUPPLY_QA_URL }}
      COVE_MUSIC_SUPPLY_QA_TOKEN: ${{ secrets.COVE_MUSIC_SUPPLY_QA_TOKEN }}
      COVE_MUSIC_EXECUTION_RUNNER_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Install full-decode FFmpeg runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Parallel leased original-master QA with exact byte attestations
        run: node scripts/music-supply/drain-full-decode-qa.mjs --execute --workers=4 --max-tracks=32 --max-minutes=20

  isolated-acoustic-analysis:
    if: vars.COVE_MUSIC_HIGH_THROUGHPUT_QA == '1' && (github.event_name == 'schedule' || inputs.execute == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [0, 1, 2, 3]
    env:
      COVE_MUSIC_ANALYSIS_RUNNER_ENABLED: "1"
      COVE_MUSIC_ANALYSIS_TOKEN: ${{ secrets.COVE_MUSIC_ANALYSIS_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/soundtracks/profile-requirements.txt
      - name: Install pinned audio processing runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/soundtracks/profile-requirements.txt
      - name: Independently lease and profile original QA masters
        run: python scripts/music-supply/analyze-qualifying-masters.py --execute --semantic-model --max-tracks=8 --max-minutes=24
