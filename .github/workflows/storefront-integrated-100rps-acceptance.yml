name: storefront-integrated-100rps-acceptance
on:
  push:
    branches: [release/isolated-storefront-safe-main-20261021]
    paths:
      - "src/storefront-strangler/**"
      - "scripts/performance/strangler-integrated-acceptance.mjs"
      - "scripts/build-storefront-strangler.mjs"
      - "wrangler.storefront-strangler.stage.jsonc"
      - ".github/workflows/storefront-integrated-100rps-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cove-strangler-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-hosted-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
      CLOUDFLARE_SEND_METRICS: "false"
      CI: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Show deterministic formatter corrections
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import prettier from "prettier";
          for (const path of [
            "scripts/performance/strangler-integrated-acceptance.mjs",
            "scripts/test-storefront-strangler-browser.mjs",
            "src/storefront-strangler/synthetic-client.ts",
          ]) {
            const before = fs.readFileSync(path, "utf8");
            const options = await prettier.resolveConfig(path);
            const after = await prettier.format(before, { ...options, filepath: path });
            if (after !== before)
              console.log("COVE_FORMAT " + JSON.stringify({ path, content: encodeURIComponent(after) }));
          }
          NODE
      - name: Keep acceptance scripts strictly formatted
        run: npx prettier --check scripts/performance/strangler-integrated-acceptance.mjs scripts/test-storefront-strangler-browser.mjs src/storefront-strangler/synthetic-client.ts
      - name: Validate country and entitlement authority against seeded fixtures
        run: node scripts/check-storefront-strangler.mjs
      - name: Build the exact interactive candidate
        run: node scripts/build-storefront-strangler.mjs
      - name: Hosted independent cold, 1/4/8/16/32, and sustained 100 RPS
        run: node scripts/performance/strangler-integrated-acceptance.mjs
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cove-strangler-acceptance-${{ github.sha }}
          path: artifacts/strangler-acceptance/results.json
          if-no-files-found: warn
          retention-days: 30
# Only wholly synthetic D1 is allowed; temporary authenticated workers.dev URL
# is deleted after the isolated run. No production D1, routing or migrations.
