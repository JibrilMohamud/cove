name: deploy-locked-fast-storefront-gateway
on:
  pull_request:
    paths:
      - "wrangler.storefront-strangler.customer.jsonc"
      - "scripts/check-locked-customer-gateway-no-d1.mjs"
      - ".github/workflows/deploy-locked-fast-storefront-gateway.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-locked-fast-storefront-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cove-fast-gateway-locked-deploy
  cancel-in-progress: false

jobs:
  static-gateway-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-locked-customer-gateway-no-d1.mjs
  deploy-off-by-default:
    needs: static-gateway-proof
    if: github.ref == 'refs/heads/main' && github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install immutable dependency tree
        run: npm ci
      - name: Assert customer mode remains impossible to activate
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const f = JSON.parse(fs.readFileSync("wrangler.storefront-strangler.customer.jsonc","utf8"));
          assert.equal(f.name,"cove-fast-customer-gateway");
          assert.equal(f.vars.COVE_STRANGLER_MODE,"customer-gateway");
          assert.equal(f.vars.COVE_STRANGLER_RELEASE_CERTIFIED,"0");
          assert.equal(f.vars.COVE_STRANGLER_DATABASE_ID,undefined);
          assert.equal(f.d1_databases,undefined,"No direct production D1 capability on locked customer gateway");
          assert.equal(f.workers_dev,true);
          assert.ok(!f.routes && !f.route && !f.services && !f.r2_buckets && !f.queues);
          assert.equal(f.vars.COVE_FAST_RELAY_KEY,undefined);
          console.log("PASS immutable locked Worker config with no customer routes");
          '
      - name: Verify live-country claim and rights revocation
        run: |
          node scripts/check-fast-storefront-relay.mjs
          node scripts/check-storefront-strangler.mjs
      - name: Prove disabled gateway rejects all paths without a D1 binding
        run: node scripts/check-locked-customer-gateway-no-d1.mjs
      - name: Compile standalone Worker
        run: node scripts/build-storefront-strangler.mjs
      - name: Deploy disabled customer gateway with no route bindings
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.storefront-strangler.customer.jsonc
      - name: Independently verify deployed Worker lost canonical D1 capability
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const target="https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+
            "/workers/scripts/cove-fast-customer-gateway/settings";
          const response=await fetch(target,{headers:{
            authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN
          },signal:AbortSignal.timeout(20000)});
          assert.ok(response.ok,"Cannot attest deployed gateway settings");
          const json=await response.json();
          assert.equal(json.success,true);
          const bs=json.result?.bindings||[];
          assert.ok(!bs.some(x=>x.type==="d1"),"Deployed gateway regained direct D1");
          assert.ok(!bs.some(x=>x.name==="COVE_STRANGLER_DATABASE_ID"),"Deployed gateway regained production DB selector");
          assert.equal(bs.find(x=>x.name==="COVE_STRANGLER_RELEASE_CERTIFIED")?.text,"0");
          assert.equal(bs.find(x=>x.name==="COVE_STRANGLER_MODE")?.text,"customer-gateway");
          console.log("PASS: live customer gateway has zero D1 grants and release mode locked");
          '
      - name: Validate public endpoint cannot serve or leak data
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const endpoint="https://cove-fast-customer-gateway.cove-jibrilmohamud.workers.dev";
          for(const path of ["/","/library","/checkout","/api/fore/library"]){
            const response=await fetch(endpoint+path,{redirect:"manual",signal:AbortSignal.timeout(9000)});
            assert.equal(response.status,503,`Disabled gateway leaked status ${response.status} on ${path}`);
            assert.equal(response.headers.get("cache-control"),"no-store");
          }
          console.log("PASS disabled Worker rejects homepage, account, checkout and API routes");
          '
# This workflow never sets COVE_STRANGLER_RELEASE_CERTIFIED=1, never
# configures Vercel, never writes D1, and never serves customer traffic.
