name: legal-authority-private-qa
on:
  pull_request:
    paths:
      - "src/storefront-strangler/legal-authority-*.ts"
      - "src/storefront-strangler/legal-quarantine-qa.writer.ts"
      - "src/storefront-strangler/market-authority-core.ts"
      - "src/storefront-strangler/legal-primary-write-lock.ts"
      - "scripts/staging/prove-private-legal-owner.mjs"
      - "scripts/staging/sweep-expired-legal-qa-callers.mjs"
      - "src/storefront-strangler/legal-authority-qa-caller.worker.ts"
      - "wrangler.legal-*.example.jsonc"
      - "scripts/build-storefront-strangler.mjs"
      - ".github/workflows/legal-authority-private-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-private-legal-qa
  cancel-in-progress: false
jobs:
  certify-real-private-owner:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/owner-first-source-revocation-admin-20261028') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify owner core, legal writer, and locked staging
        run: |
          node scripts/check-legal-authority-owner.mjs
          node scripts/check-legal-authority-coordinator.mjs
          node scripts/check-legal-authority-read.mjs
          node scripts/test-legal-primary-write-lock.mjs
          node scripts/test-legal-admin-owner-commands.mjs
          node scripts/check-legal-quarantine-writer.mjs
          node scripts/check-market-authority-closure.mjs
          node scripts/staging/sweep-expired-legal-qa-callers.mjs --self-test
      - name: Reject production database or publicly routed private authority
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          for(const file of ["wrangler.legal-authority.example.jsonc","wrangler.legal-quarantine-qa.example.jsonc","wrangler.legal-qa-caller.example.jsonc"]) {
            const cfg=JSON.parse(fs.readFileSync(file,"utf8"));
            assert.equal(cfg.workers_dev,false);
            assert.equal(cfg.preview_urls,false);
            assert.deepEqual(cfg.routes,[]);
            for(const binding of cfg.d1_databases||[])
              assert.notEqual(binding.database_id,"4bd657ac-8789-403e-a28c-93aba8d0a989");
            assert.equal(cfg.vars.COVE_RIGHTS_OWNER_ENABLED??cfg.vars.COVE_LEGAL_WRITER_ENABLED??cfg.vars.COVE_LEGAL_QA_CALLER_ENABLED,"0");
          }
          console.log("PASS: disabled QA owner, writer and caller configs; no production D1");
          '
      - name: Sweep abandoned expired QA callers
        run: node scripts/staging/sweep-expired-legal-qa-callers.mjs
      - name: Compile separately deployable private legal authority and writer
        run: node scripts/build-storefront-strangler.mjs
      - name: Deploy disabled unrouteable isolated legal owner
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.legal-authority.example.jsonc
      - name: Prove private live Durable Object denial, replay, and rollback
        run: node scripts/staging/prove-private-legal-owner.mjs
      - name: Sweep expired QA callers even on failure
        if: always()
        run: node scripts/staging/sweep-expired-legal-qa-callers.mjs
