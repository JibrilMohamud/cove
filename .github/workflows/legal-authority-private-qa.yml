name: legal-authority-private-qa
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/storefront-strangler/legal-authority-*.ts"
      - "src/storefront-strangler/legal-primary-write-lock.ts"
      - "wrangler.legal-authority.example.jsonc"
      - "scripts/build-storefront-strangler.mjs"
      - ".github/workflows/legal-authority-private-qa.yml"
permissions:
  contents: read
concurrency:
  group: cove-private-legal-qa
  cancel-in-progress: true
jobs:
  provision-disabled-private-authority:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'arch/isolated-catalog-normalization-20261025') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/arch/isolated-catalog-normalization-20261025')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Validate strong owner and staged legacy writer lock
        run: |
          node scripts/check-legal-authority-owner.mjs
          node scripts/check-legal-authority-coordinator.mjs
          node scripts/check-legal-authority-read.mjs
          node scripts/check-legal-primary-write-lock.mjs
      - name: Compile isolated authority entrypoint
        run: node scripts/build-storefront-strangler.mjs
      - name: Enforce physically nonroutable disabled QA deployment
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("wrangler.legal-authority.example.jsonc","utf8"));
          assert.equal(c.name,"cove-legal-authority-private-qa-example");
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.deepEqual(c.routes,[]);
          assert.equal(c.vars.COVE_RIGHTS_OWNER_ENABLED,"0");
          assert.equal(c.d1_databases[0].database_id,"5e3a6b69-6f3d-4b19-b837-01f7aa56ce87");
          assert.equal(c.durable_objects.bindings[0].class_name,"CoveLegalAuthority");
          console.log("PASS: private disabled legal owner configuration");
          '
      - name: Deploy disabled Durable Object authority to private QA only
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.legal-authority.example.jsonc
      - name: Independently verify private Worker resource exists
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const url="https://api.cloudflare.com/client/v4/accounts/"+process.env.CLOUDFLARE_ACCOUNT_ID+"/workers/scripts";
          const response=await fetch(url,{headers:{authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(15000)});
          assert.equal(response.status,200,"Private QA Worker listing not available");
          const result=await response.json();
          assert.equal(result.success,true);
          assert.ok(Array.isArray(result.result)&&
            result.result.some(worker=>worker.id==="cove-legal-authority-private-qa-example"),
            "Isolated legal authority script has not been deployed");
          console.log("PASS: Cloudflare lists the non-public disabled legal-authority Worker");
          '
