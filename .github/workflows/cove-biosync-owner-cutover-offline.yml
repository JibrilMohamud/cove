name: cove-biosync-owner-cutover-offline
on:
  pull_request:
    paths:
      - "src/storefront-strangler/owner-biosync-checked-publication.stage.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/storefront-strangler/canonical-owner-command-gateway.ts"
      - "src/features/fore/api.server.ts"
      - "scripts/audio_pipeline/biosync_canary.py"
      - "scripts/audio_pipeline/test_biosync_owner_cutover.py"
      - "scripts/check-owner-biosync-checked-publication.mjs"
      - ".github/workflows/biosync-canary.yml"
      - ".github/workflows/cove-biosync-owner-cutover-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-owner-atomicity-and-client-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned TypeScript test runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove owner-only atomic BioSync pointer/job and replay
        run: node scripts/check-owner-biosync-checked-publication.mjs
      - name: Prove existing canonical owner transport still refuses forged receipts
        run: node scripts/check-canonical-owner-command-gateway.mjs
      - name: Keep legal withdrawals, paid settlement, and refunds fail-closed
        run: |
          node scripts/test-stage-distribution-owner.mjs
          node scripts/check-owner-stripe-webhook.mjs
          node scripts/check-owner-refund-accounting.mjs
          node scripts/check-owner-paid-settlement.mjs
      - name: Prove scheduled Python cannot submit direct D1 writes
        run: python3 -m unittest scripts.audio_pipeline.test_biosync_owner_cutover
      - name: Validate source types
        run: npx tsc --noEmit
      - name: Verify source-bound SQL-site attestation remains exact
        run: node scripts/rebase-canonical-writer-review.mjs --review-attestation=docs/architecture/biosync-owner-qa-source-attestation-20261122.json
      - name: Reconcile all source-bound SQL-site identities
        run: node scripts/reconcile-canonical-writers.mjs
      - name: Refuse new unfenced protected-table writers
        run: node scripts/check-canonical-writer-closure.mjs --no-new-writers
