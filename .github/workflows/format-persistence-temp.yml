name: format-persistence-temp

on:
  push:
    branches: [vercel-persistent-backend]
    paths:
      - "src/lib/persistence-backend.ts"
      - "src/persistence-backend.worker.ts"
      - ".github/workflows/format-persistence-temp.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: vercel-persistent-backend
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format persistence modules
        run: |
          npx prettier --write src/lib/persistence-backend.ts src/persistence-backend.worker.ts
          npx eslint --fix src/lib/persistence-backend.ts src/persistence-backend.worker.ts
          npx prettier --check src/lib/persistence-backend.ts src/persistence-backend.worker.ts
          npx eslint src/lib/persistence-backend.ts src/persistence-backend.worker.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/persistence-backend.ts src/persistence-backend.worker.ts; then
            echo "Persistence modules already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/persistence-backend.ts src/persistence-backend.worker.ts
          git commit -m "Format persistence modules"
          git push origin HEAD:vercel-persistent-backend
