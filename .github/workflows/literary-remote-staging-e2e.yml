name: literary-remote-staging-e2e
on:
  pull_request:
    paths:
      - ".github/workflows/literary-remote-staging-e2e.yml"
      - "scripts/staging/certify-literary-remote-synthetic-journey.mjs"
      - "scripts/check-literary-remote-synthetic-journey.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-remote-staging-e2e.yml"
      - "scripts/staging/certify-literary-remote-synthetic-journey.mjs"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact reviewed main SHA for protected Cloudflare operations"
        type: string
        required: true
      confirm_protected_cloudflare_action:
        description: "Explicitly approve protected stage/production Cloudflare operation"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  static-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/certify-literary-remote-synthetic-journey.mjs
      - run: node scripts/check-literary-remote-synthetic-journey.mjs
  protected-real-d1-r2-canary:
    needs: static-synthetic-only
    concurrency:
      group: cove-literary-remote-staging-qa
      queue: max
      cancel-in-progress: false
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: f51e8ccbc394e2d6016ff8c2c303d54b
      COVE_CF_QA_D1_MUTATION_TOKEN: ${{ secrets.COVE_CF_QA_D1_MUTATION_TOKEN }}
      COVE_CF_QA_R2_STORAGE_TOKEN: ${{ secrets.COVE_CF_QA_R2_STORAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Synthetic end-to-end handoff on dedicated remote D1 and private R2
        run: node scripts/staging/certify-literary-remote-synthetic-journey.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: literary-remote-staging-synthetic-${{ github.sha }}
          path: artifacts/literary-cutover/remote-synthetic-e2e.json
          if-no-files-found: warn
          retention-days: 30
