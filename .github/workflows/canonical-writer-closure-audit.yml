name: canonical-writer-closure-audit
on:
  pull_request:
    paths:
      - "src/**"
      - "worker/**"
      - "workers/**"
      - "scripts/check-canonical-writer-closure.mjs"
      - "scripts/canonical-writer-baseline.mjs"
      - "scripts/test-canonical-writer-closure.mjs"
      - "scripts/reconcile-canonical-writers.mjs"
      - "scripts/test-canonical-writer-review.mjs"
      - "scripts/check-audio-progress-nonauthorizing.mjs"
      - "scripts/test-stage-distribution-owner.mjs"
      - "docs/architecture/canonical-writer-review.json"
      - ".github/workflows/canonical-writer-closure-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "workers/**"
      - "scripts/check-canonical-writer-closure.mjs"
      - "scripts/canonical-writer-baseline.mjs"
      - "scripts/test-canonical-writer-closure.mjs"
      - "scripts/reconcile-canonical-writers.mjs"
      - "scripts/test-canonical-writer-review.mjs"
      - "scripts/check-audio-progress-nonauthorizing.mjs"
      - "docs/architecture/canonical-writer-review.json"
      - ".github/workflows/canonical-writer-closure-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-and-cutover-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Inventory production rights, finance, delivery and publication writers
        run: node scripts/test-canonical-writer-closure.mjs
      - name: Refuse newly introduced unfenced production canonical mutations
        run: node scripts/check-canonical-writer-closure.mjs --no-new-writers
      - name: Install parser for exact SQL-site reconciliation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove negative-only owner-first distribution withdrawal
        run: |
          node scripts/test-stage-distribution-owner.mjs
          node scripts/test-legal-admin-owner-commands.mjs
      - name: Reconcile every candidate without approving production ownership
        run: |
          node scripts/reconcile-canonical-writers.mjs
          node scripts/test-canonical-writer-review.mjs
          node scripts/check-audio-progress-nonauthorizing.mjs
      - name: Save reviewable line-addressed mutation evidence
        env:
          COVE_WRITER_AUDIT_OUTPUT: ${{ runner.temp }}/cove-canonical-writer-inventory.json
        run: node scripts/check-canonical-writer-closure.mjs --audit
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-writer-inventory
          path: ${{ runner.temp }}/cove-canonical-writer-inventory.json
          retention-days: 30
          if-no-files-found: error
