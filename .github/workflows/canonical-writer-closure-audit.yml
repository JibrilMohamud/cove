name: canonical-writer-closure-audit
on:
  pull_request:
    paths:
      - "src/**"
      - "worker/**"
      - "workers/**"
      - "scripts/check-canonical-writer-closure.mjs"
      - "scripts/canonical-writer-baseline.mjs"
      - "scripts/test-canonical-writer-closure.mjs"
      - "scripts/reconcile-canonical-writers.mjs"
      - "scripts/canonical-owner-workflow-inventory.mjs"
      - "scripts/test-canonical-owner-workflow-inventory.mjs"
      - "scripts/check-canonical-owner-command-gateway.mjs"
      - "scripts/check-owner-refund-accounting.mjs"
      - "scripts/check-owner-paid-settlement.mjs"
      - "scripts/owner-settlement-source-boundary.mjs"
      - "drizzle/0089_atomic_paid_settlement.sql"
      - "scripts/check-owner-refund-provider.mjs"
      - "scripts/check-production-writer-topology.mjs"
      - "scripts/test-production-writer-topology.mjs"
      - "wrangler.backend.production.toml"
      - "wrangler.legal-authority.production-locked.jsonc"
      - "src/storefront-strangler/canonical-owner-command-gateway.ts"
      - "src/storefront-strangler/paid-order-revocation.server.ts"
      - "src/storefront-strangler/paid-settlement-publication.server.ts"
      - "src/storefront-strangler/publication-owner-routing.server.ts"
      - "src/storefront-strangler/legal-admin-owner-commands.server.ts"
      - "src/storefront-strangler/canonical-legal-tables.json"
      - "src/storefront-strangler/legal-primary-write-lock.ts"
      - "docs/architecture/canonical-writer-workflow-migration-v2.md"
      - "scripts/test-canonical-writer-review.mjs"
      - "scripts/rebase-canonical-writer-review.mjs"
      - "scripts/test-canonical-writer-rebase.mjs"
      - "scripts/check-audio-progress-nonauthorizing.mjs"
      - "scripts/check-nonauthorizing-legal-history.mjs"
      - "scripts/check-audio-playback-remaining-nonauthorizing.mjs"
      - "scripts/check-nonauthorizing-owner-version-history.mjs"
      - "scripts/test-stage-distribution-owner.mjs"
      - "docs/architecture/canonical-writer-review.json"
      - ".github/workflows/canonical-writer-closure-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "workers/**"
      - "scripts/check-canonical-writer-closure.mjs"
      - "scripts/canonical-writer-baseline.mjs"
      - "scripts/test-canonical-writer-closure.mjs"
      - "scripts/reconcile-canonical-writers.mjs"
      - "scripts/canonical-owner-workflow-inventory.mjs"
      - "scripts/test-canonical-owner-workflow-inventory.mjs"
      - "scripts/check-canonical-owner-command-gateway.mjs"
      - "scripts/check-owner-refund-accounting.mjs"
      - "scripts/check-owner-paid-settlement.mjs"
      - "scripts/owner-settlement-source-boundary.mjs"
      - "drizzle/0089_atomic_paid_settlement.sql"
      - "scripts/check-owner-refund-provider.mjs"
      - "scripts/check-production-writer-topology.mjs"
      - "scripts/test-production-writer-topology.mjs"
      - "wrangler.backend.production.toml"
      - "wrangler.legal-authority.production-locked.jsonc"
      - "src/storefront-strangler/canonical-owner-command-gateway.ts"
      - "src/storefront-strangler/paid-order-revocation.server.ts"
      - "src/storefront-strangler/paid-settlement-publication.server.ts"
      - "src/storefront-strangler/publication-owner-routing.server.ts"
      - "src/storefront-strangler/legal-admin-owner-commands.server.ts"
      - "src/storefront-strangler/canonical-legal-tables.json"
      - "src/storefront-strangler/legal-primary-write-lock.ts"
      - "docs/architecture/canonical-writer-workflow-migration-v2.md"
      - "scripts/test-canonical-writer-review.mjs"
      - "scripts/rebase-canonical-writer-review.mjs"
      - "scripts/test-canonical-writer-rebase.mjs"
      - "scripts/check-audio-progress-nonauthorizing.mjs"
      - "scripts/check-nonauthorizing-legal-history.mjs"
      - "scripts/check-audio-playback-remaining-nonauthorizing.mjs"
      - "scripts/check-nonauthorizing-owner-version-history.mjs"
      - "docs/architecture/canonical-writer-review.json"
      - ".github/workflows/canonical-writer-closure-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-and-cutover-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Inventory production rights, finance, delivery and publication writers
        run: node scripts/test-canonical-writer-closure.mjs
      - name: Refuse newly introduced unfenced production canonical mutations
        run: node scripts/check-canonical-writer-closure.mjs --no-new-writers
      - name: Install parser for exact SQL-site reconciliation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove negative-only owner-first distribution withdrawal
        run: |
          node scripts/test-stage-distribution-owner.mjs
          node scripts/test-legal-admin-owner-commands.mjs
      - name: Reconcile every candidate without approving production ownership
        run: |
          node scripts/reconcile-canonical-writers.mjs
          node scripts/test-canonical-writer-review.mjs
          node scripts/test-canonical-writer-rebase.mjs
          node scripts/test-canonical-owner-workflow-inventory.mjs
          node scripts/check-canonical-owner-command-gateway.mjs
          node scripts/check-owner-refund-accounting.mjs
          node scripts/check-owner-paid-settlement.mjs
          node scripts/check-owner-refund-provider.mjs
          node scripts/test-production-writer-topology.mjs
          node scripts/check-audio-progress-nonauthorizing.mjs
          node scripts/check-nonauthorizing-legal-history.mjs
          node scripts/check-audio-playback-remaining-nonauthorizing.mjs
          node scripts/check-nonauthorizing-owner-version-history.mjs
      - name: Export source-bound workflow migration inventory
        env:
          COVE_WORKFLOW_AUDIT_OUTPUT: ${{ runner.temp }}/cove-canonical-workflow-inventory.json
        run: node scripts/canonical-owner-workflow-inventory.mjs
      - name: Save reviewable line-addressed mutation evidence
        env:
          COVE_WRITER_AUDIT_OUTPUT: ${{ runner.temp }}/cove-canonical-writer-inventory.json
        run: node scripts/check-canonical-writer-closure.mjs --audit
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-writer-inventory
          path: ${{ runner.temp }}/cove-canonical-writer-inventory.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-workflow-inventory
          path: ${{ runner.temp }}/cove-canonical-workflow-inventory.json
          retention-days: 30
          if-no-files-found: error
