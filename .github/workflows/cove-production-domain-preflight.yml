name: cove-production-domain-preflight
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "User-owned hostname already added to this Cloudflare account; never workers.dev or vercel.app"
        required: true
        type: string
permissions:
  contents: read
jobs:
  certify-domain-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COVE_RELEASE_HOSTNAME: ${{ inputs.hostname }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node scripts/staging/audit-cloudflare-production-domain.mjs --self-test
      - name: Require active Cloudflare zone, exact Worker binding and TLS
        run: node scripts/staging/audit-cloudflare-production-domain.mjs --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-domain-topology
          path: artifacts/release-topology/
          retention-days: 30
