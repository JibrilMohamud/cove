name: cove-qa-owner-primary-read-transport-offline
on:
  pull_request:
    paths:
      - "src/storefront-strangler/qa-owner-primary-read-transport.mjs"
      - "src/storefront-strangler/qa-owner-primary-read-transport.d.mts"
      - "src/storefront-strangler/qa-owner-primary-read-entrypoint.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/persistence-backend.worker.ts"
      - "src/features/fore/api.server.ts"
      - "src/features/fore/presentation-replica.server.ts"
      - "src/storefront-strangler/qa-owner-scheduled-execution.ts"
      - "src/lib/cron-result-guard.ts"
      - "src/features/fore/public-status.server.ts"
      - "src/features/fore/soundtracks.server.ts"
      - "scripts/test-qa-owner-scheduled-execution.mjs"
      - "scripts/release/inspect-unbound-backend-crons.mjs"
      - "scripts/release/prove-native-owner-schedules.mjs"
      - "scripts/test-local-catalog-fixture.mjs"
      - "scripts/qa-owner-primary-read-transport.test.mjs"
      - "scripts/qa-owner-primary-read-entrypoint.test.mjs"
      - ".github/workflows/cove-qa-owner-primary-read-transport-offline.yml"
  push:
    branches: [main]
    paths:
      - "src/storefront-strangler/qa-owner-primary-read-transport.mjs"
      - "src/storefront-strangler/qa-owner-primary-read-transport.d.mts"
      - "src/storefront-strangler/qa-owner-primary-read-entrypoint.ts"
      - "src/storefront-strangler/legal-authority.worker.ts"
      - "src/persistence-backend.worker.ts"
      - "src/features/fore/api.server.ts"
      - "src/features/fore/presentation-replica.server.ts"
      - "src/storefront-strangler/qa-owner-scheduled-execution.ts"
      - "src/lib/cron-result-guard.ts"
      - "src/features/fore/public-status.server.ts"
      - "src/features/fore/soundtracks.server.ts"
      - "scripts/test-qa-owner-scheduled-execution.mjs"
      - "scripts/release/inspect-unbound-backend-crons.mjs"
      - "scripts/release/prove-native-owner-schedules.mjs"
      - "scripts/test-local-catalog-fixture.mjs"
      - "scripts/qa-owner-primary-read-transport.test.mjs"
      - "scripts/qa-owner-primary-read-entrypoint.test.mjs"
      - ".github/workflows/cove-qa-owner-primary-read-transport-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Check isolated transport syntax
        run: |
          node --check src/storefront-strangler/qa-owner-primary-read-transport.mjs
          node --check scripts/qa-owner-primary-read-transport.test.mjs
      - name: Prove strict private owner READ transport with no caller D1
        run: node --test scripts/qa-owner-primary-read-transport.test.mjs
      - name: Prove backend with no D1 binding can read QA owner without production enrollment
        run: node --test scripts/qa-owner-primary-read-entrypoint.test.mjs
      - name: Prove schedule replay, uncertain acknowledgement, domain fences and leased QA isolation
        run: node --no-warnings scripts/test-qa-owner-scheduled-execution.mjs
      - name: Exercise all seven actual owner schedules across every migration and prove exact replay
        run: node --no-warnings scripts/release/inspect-unbound-backend-crons.mjs --owner-execution --seeded-services --assert-owner-contract
      - name: Prove source metadata cannot grant authority and failed upstream ticks cannot acknowledge success
        run: node --no-warnings scripts/release/inspect-unbound-backend-crons.mjs --owner-execution --assert-negative-owner-contract
      - name: Prove failed populated maintenance jobs remain failures rather than fulfilled promises
        run: node --no-warnings scripts/release/inspect-unbound-backend-crons.mjs --owner-execution --seeded-services --assert-owner-contract --failing-maintenance-job
      - name: Prove all seven actual schedules in native workerd with D1 and SQLite owner journals
        run: |
          npm exec --yes --package=wrangler@4.151.0 -- sh -c 'COVE_MINIFLARE_MODULE="$(dirname "$(command -v wrangler)")/../miniflare" node --no-warnings scripts/release/prove-native-owner-schedules.mjs'
      - name: Deny production cutover from QA-only read-transport source
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const backend=fs.readFileSync("wrangler.backend.production.toml","utf8");
            const owner=fs.readFileSync("wrangler.legal-authority.production-locked.jsonc","utf8");
            assert.match(backend,/binding = "DB"/);
            assert.match(backend,/database_id = "4bd657ac-8789-403e-a28c-93aba8d0a989"/);
            assert.match(owner,/"COVE_RIGHTS_OWNER_ENABLED"/);
            console.log("PASS: this QA contract has not removed production D1 or enabled rights");
          '
