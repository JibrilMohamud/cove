name: regional-epub-bound-staging-smoke
on:
  push:
    branches:
      - fix/regional-epub-asset-repair-20261020
    paths:
      - "src/features/fore/regional-epub-asset-repair.server.ts"
      - "scripts/staging/regional-epub-bound-worker.ts"
      - ".github/workflows/regional-epub-bound-staging-smoke.yml"
permissions:
  contents: read
concurrency:
  group: cove-regional-epub-isolated-smoke
  cancel-in-progress: false
jobs:
  bound-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolated D1/R2 bound repair
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Staging test cannot run without Cloudflare API credentials"
            exit 1
          fi
          npx esbuild scripts/staging/regional-epub-bound-worker.ts --bundle --platform=neutral --format=esm --target=es2022 --outfile=./regional-smoke-worker.mjs
          cat > regional-smoke.toml <<'EOF'
          name = "cove-epub-repair-smoke-20261020"
          main = "./regional-smoke-worker.mjs"
          compatibility_date = "2026-10-09"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "cove-content-repair-stage-20261020"
          database_id = "dbcc0d95-8ca2-4036-ad78-49dbc0ee4b38"
          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "cove-content-repair-stage-20261020"
          EOF
          function cleanup() {
            npx wrangler delete --config regional-smoke.toml --force || true
          }
          trap cleanup EXIT
          npx wrangler deploy --config regional-smoke.toml
          SMOKE_TOKEN=$(openssl rand -hex 40)
          printf %s "$SMOKE_TOKEN" | npx wrangler secret put SMOKE_TOKEN --config regional-smoke.toml
          BODY=$(curl --retry 3 --retry-delay 1 --fail-with-body --silent --show-error \
            --max-time 50 -X POST \
            -H "x-smoke-token: $SMOKE_TOKEN" \
            "https://cove-epub-repair-smoke-20261020.cove-jibrilmohamud.workers.dev/__isolated-smoke")
          echo "$BODY"
          node -e '
            const result=JSON.parse(process.argv[1]);
            if(!result.success || result.repaired.repaired!==1 ||
              result.repaired.missingOrMismatched!==1 ||
              result.retry.repaired!==0 ||
              result.forbidden!==0 || result.missing!==0)
              process.exit(1);
            ' "$BODY"
