name: format-isolated-performance
on:
  push:
    branches: [perf/isolated-d1-representative-benchmark-20261019]
permissions:
  contents: write
concurrency:
  group: cove-format-isolated-perf
  cancel-in-progress: true
jobs:
  format-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format only the new test harness and fixture code
        run: |
          npx prettier --write \
            scripts/check-isolated-d1-gate.mjs \
            scripts/performance/isolated-d1-gate.mjs \
            scripts/performance/generate-synthetic-d1-fixture.mjs \
            scripts/performance/write-isolated-d1-configs.mjs \
            scripts/performance/verify-isolated-d1-fixtures.mjs \
            scripts/performance/cloudflare-lazyfacet-paired.mjs
      - name: Commit deterministic formatting to this non-production branch
        run: |
          set -euo pipefail
          if ! git diff --quiet -- scripts/check-isolated-d1-gate.mjs scripts/performance; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/check-isolated-d1-gate.mjs scripts/performance/isolated-d1-gate.mjs scripts/performance/generate-synthetic-d1-fixture.mjs scripts/performance/write-isolated-d1-configs.mjs scripts/performance/verify-isolated-d1-fixtures.mjs scripts/performance/cloudflare-lazyfacet-paired.mjs
            git commit -m "style: format isolated D1 benchmark instrumentation"
            git push origin HEAD:refs/heads/perf/isolated-d1-representative-benchmark-20261019
          fi
