name: cove-public-ingress-network-diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/cove-public-ingress-network-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-public-network:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Probe Vercel aliases and Cloudflare Worker independently
        shell: bash
        run: |
          set +e
          for target in https://cove-puce-theta.vercel.app/ https://cove-jibrilmohamuds-projects.vercel.app/ https://cove-git-main-jibrilmohamuds-projects.vercel.app/ https://cove-puce-theta.vercel.app/offline.html https://cove-puce-theta.vercel.app/api/fore/health/ready https://cove-persistence-backend.cove-jibrilmohamud.workers.dev/__cove/health; do
            echo "Probe $target"
            for attempt in 1 2; do
              curl --silent --show-error --output /dev/null --connect-timeout 7 --max-time 16 --write-out 'status=%{http_code} ip=%{remote_ip} DNS=%{time_namelookup}s TLS=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n' "$target"
              echo "curl_exit=$? attempt=$attempt"
            done
          done
      - name: Compare HTTP 1.1 and HTTP 2 over IPv4
        shell: bash
        run: |
          set +e
          for mode in --http1.1 --http2; do
            for attempt in 1 2 3; do
              echo "mode=$mode attempt=$attempt"
              curl -4 "$mode" --silent --show-error --output /dev/null --connect-timeout 7 --max-time 16 --write-out 'status=%{http_code} ip=%{remote_ip} proto=%{http_version} TLS=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n' https://cove-puce-theta.vercel.app/
              echo "curl_exit=$?"
            done
          done
