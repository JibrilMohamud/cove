name: canonical-terminal-rights
on:
  pull_request:
    paths:
      - "drizzle/0085_canonical_terminal_rights_resurrection_guard.sql"
      - "drizzle/0086_rights_contract_version_terminal_guard.sql"
      - "scripts/check-terminal-rights-resurrection.mjs"
      - "scripts/check-rights-contract-version-no-revival.mjs"
      - ".github/workflows/canonical-terminal-rights.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/0085_canonical_terminal_rights_resurrection_guard.sql"
      - "drizzle/0086_rights_contract_version_terminal_guard.sql"
      - "scripts/check-terminal-rights-resurrection.mjs"
      - "scripts/check-rights-contract-version-no-revival.mjs"
      - ".github/workflows/canonical-terminal-rights.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject-stale-positive-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Exercise exact production trigger SQL with terminal and upsert replays
        run: |
          node scripts/check-terminal-rights-resurrection.mjs
          node scripts/check-rights-contract-version-no-revival.mjs
      - name: Reject newly introduced unaudited canonical writers
        run: node scripts/check-canonical-writer-closure.mjs --no-new-writers
