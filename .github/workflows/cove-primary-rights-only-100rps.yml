name: cove-primary-current-rights-only-100rps-proof
on:
  push:
    branches: [diag/primary-rights-only-100rps-20261115]
    paths:
      - scripts/staging/run-private-causal-triad.mjs
      - .github/workflows/cove-primary-rights-only-100rps.yml
permissions:
  contents: read
concurrency:
  group: cove-isolated-causal-catalog-stage-driver
  cancel-in-progress: false
jobs:
  isolated-current-rights-proof:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_ALLOW_SAFE_RESTORE: "1"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Verify synthetic D1 guard, no production entrypoints, data minimization
        run: |
          node --check scripts/staging/run-private-causal-triad.mjs
          node --test scripts/staging/private-causal-triad.worker.test.mjs
          node scripts/staging/causal-triad-stage.worker.test.mjs
          npx prettier --check scripts/staging/run-private-causal-triad.mjs
      - name: Require scoped stage deployment credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: No-DB 100-RPS control then fresh territorial rights 50/100-RPS capacity
        run: node scripts/staging/run-private-causal-triad.mjs --rights-only-100rps
      - name: Mandatory pinned original driver restoration
        if: always()
        run: node scripts/staging/run-private-causal-triad.mjs --restore-only
      - name: Preserve valid, failed, offered, TTFB, CPU and D1 SQL metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-primary-rights-only-capacity-${{ github.run_id }}
          path: artifacts/causal-triad-stage/
          if-no-files-found: ignore
          retention-days: 14
