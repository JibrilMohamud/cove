name: cove-protected-version454-preview-readonly

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/release/probe-version454-readonly.mjs"
      - "scripts/release/version454-preview-readonly-policy.mjs"
      - "scripts/release/version454-preview-readonly.test.mjs"
      - ".github/workflows/cove-protected-version454-preview-readonly.yml"
  workflow_dispatch:
    inputs:
      confirm_readonly_version_preview:
        description: "Make exactly three GET-only unauthorized requests to inactive Worker 454; no traffic deploy."
        type: boolean
        required: true
        default: false
      candidate_version_id:
        description: "Exact archived Worker version ID from successful protected upload #25."
        type: string
        required: true
        default: "adc603f1-d82a-44d9-b302-509690dec5bd"
      reviewed_source_sha:
        description: "Approved backend source SHA. Any changes to runtime sources fail closed."
        type: string
        required: true
        default: "a3fd303da6f7418ceec574e0c158d62fe1245984"

permissions:
  contents: read

jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify exact archive URL, auth-denial contract and no-mutation release fence
        run: |
          node --test scripts/release/version454-preview-readonly.test.mjs scripts/release/zero-traffic-worker-version-fence.test.mjs
          node --check scripts/release/probe-version454-readonly.mjs
          git diff --check

  verify_archived_without_deploy:
    if: ${{ github.repository == 'JibrilMohamud/cove' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_readonly_version_preview == true && inputs.candidate_version_id == 'adc603f1-d82a-44d9-b302-509690dec5bd' && inputs.reviewed_source_sha == 'a3fd303da6f7418ceec574e0c158d62fe1245984' }}
    concurrency:
      group: cove-exclusive-real-primary-cold-acceptance
      queue: max
      cancel-in-progress: false
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_APPROVED_DIAGNOSTIC_SOURCE: ${{ inputs.reviewed_source_sha }}
      COVE_EXPECTED_ARCHIVED_VERSION: ${{ inputs.candidate_version_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify offline GET-only source contract with NO credentials
        run: node --test scripts/release/version454-preview-readonly.test.mjs
      - name: Assert approved source, archived parity and 100% pin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_WORKERS_VERSION_UPLOAD_TOKEN }}
          COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
        run: node scripts/release/probe-version454-readonly.mjs preflight
      - name: Probe only anonymous deny paths on the version URL
        run: node scripts/release/probe-version454-readonly.mjs probe
      - name: Always reverify pinned production traffic and disabled owner
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_WORKERS_VERSION_UPLOAD_TOKEN }}
          COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
        run: node scripts/release/probe-version454-readonly.mjs fence
      - name: Archive numeric-only preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-version454-preview-readonly-${{ github.run_id }}
          path: artifacts/protected-version454-preview/evidence.json
          if-no-files-found: ignore
          retention-days: 14
