name: cove-temporary-worker-privacy-formatter
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cove-temporary-worker-privacy-formatter.yml"
permissions:
  contents: read
jobs:
  format-reviewed-public-source:
    if: github.repository == 'JibrilMohamud/cove' && github.event.pull_request.head.repo.full_name == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply pinned Prettier exclusively to public Worker console privacy test
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --ignore-path .prettierignore --write scripts/security/check-backend-worker-console-privacy.mjs
          npx prettier --ignore-path .prettierignore --check scripts/security/check-backend-worker-console-privacy.mjs
          printf '%s\n' COVE_FORMAT_BEGIN_PRIVACY
          base64 -w 0 scripts/security/check-backend-worker-console-privacy.mjs | fold -w 240
          printf '%s\n' COVE_FORMAT_END_PRIVACY
# Temporary PR-only source formatter; remove before relying on final CI.
