name: biosync-production-canary

on:
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Approve the exact main SHA before Cloudflare API access."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Explicitly approve this Cloudflare action; never auto-run on source merge."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cove-biosync-production-canary
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Publish independently verified BioSync canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BIOSYNC_AUTO_SHORT: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python3 -m scripts.audio_pipeline.biosync_canary
