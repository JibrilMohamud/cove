name: biosync-owner-qa-protected

# Replaces the hourly production D1 writer. A scheduled caller must not retain
# an account-wide token or silently fall back to D1 REST mutations. This
# isolated replay is manual until its owner service, R2 fixture and scoped
# service principal are independently attested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cove-biosync-owner-qa
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: cove-protected-biosync-owner-qa
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate isolated command protocol and no direct primary D1 writers
        run: python3 -m unittest scripts.audio_pipeline.test_biosync_owner_cutover
      - name: Publish checked BioSync map only through the enrolled QA owner
        env:
          COVE_BIOSYNC_QA_DATABASE_ID: ${{ vars.COVE_BIOSYNC_QA_DATABASE_ID }}
          COVE_BIOSYNC_QA_BUCKET: ${{ vars.COVE_BIOSYNC_QA_BUCKET }}
          COVE_BIOSYNC_OWNER_STAGE_URL: ${{ vars.COVE_BIOSYNC_OWNER_STAGE_URL }}
          COVE_BIOSYNC_D1_READ_TOKEN: ${{ secrets.COVE_BIOSYNC_D1_READ_TOKEN }}
          COVE_BIOSYNC_R2_TOKEN: ${{ secrets.COVE_BIOSYNC_R2_TOKEN }}
          COVE_BIOSYNC_MACHINE_TOKEN: ${{ secrets.COVE_BIOSYNC_MACHINE_TOKEN }}
        run: python3 -m scripts.audio_pipeline.biosync_canary
