name: temporary-literary-handoff-two-d1
on:
  push:
    branches:
      - feat/isolated-literary-outbox-20261020
    paths:
      - "scripts/staging/literary-handoff-two-d1-smoke.ts"
      - ".github/workflows/temporary-literary-handoff-two-d1.yml"
permissions:
  contents: read
concurrency:
  group: cove-literary-handoff-isolated-stage
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "d26430caa63ec55f6612e32f36aca5e9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolated two D1 outbox, ACK replay and cancellation then cleanup
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Cloudflare credentials missing"; exit 1; }
          npx esbuild scripts/staging/literary-handoff-two-d1-smoke.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=./handoff-smoke.mjs
          cat > handoff-smoke.toml <<'EOF'
          name = "cove-literary-handoff-smoke-20261020"
          main = "./handoff-smoke.mjs"
          compatibility_date = "2026-10-09"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "cove-content-repair-stage-20261020"
          database_id = "dbcc0d95-8ca2-4036-ad78-49dbc0ee4b38"
          [[d1_databases]]
          binding = "CONTENT_DB"
          database_name = "cove-literary-budget-stage-20261020"
          database_id = "7a26c27d-966c-468a-a3ad-d06cfff68010"
          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "cove-content-repair-stage-20261020"
          EOF
          cleanup() { npx wrangler delete --config handoff-smoke.toml --force || true; }
          trap cleanup EXIT
          npx wrangler deploy --config handoff-smoke.toml
          TOKEN=$(openssl rand -hex 40)
          printf %s "$TOKEN" | npx wrangler secret put SMOKE_TOKEN --config handoff-smoke.toml
          sleep 6
          BODY=$(curl --retry 5 --retry-all-errors --retry-delay 2 --fail-with-body --silent --show-error --max-time 55 \
            -H "x-smoke-token: $TOKEN" -X POST \
            "https://cove-literary-handoff-smoke-20261020.cove-jibrilmohamud.workers.dev/__isolated-handoff-smoke")
          echo "$BODY"
          node -e 'const r=JSON.parse(process.argv[1]); if(!r.pass || !r.replayDeduplicated || !r.revokedCancelled || r.independentJobs!==1) process.exit(1)' "$BODY"
