name: cove-stage-real-legal-rights-differential
on:
  push:
    branches: [perf/stage-real-legal-differential-20261115]
    paths:
      - scripts/staging/check-owner-canonical-real-d1-differential.mjs
      - src/features/fore/rights.server.ts
      - .github/workflows/cove-stage-real-legal-rights-differential.yml
permissions:
  contents: read
jobs:
  canonical-vs-primary-legal-view:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_SYNTHETIC_D1_ID: e4cbb0ef-6288-4fa1-9dbb-fb42fe01d4f3
      COVE_SYNTHETIC_OWNER_DIFF_ONLY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Deny unauthorized script drift and SQL mutations
        run: |
          node --check scripts/staging/check-owner-canonical-real-d1-differential.mjs
          test -n "$CLOUDFLARE_API_TOKEN"
          git diff --check
      - name: Compare real canonical TypeScript legal decisions against isolated primary D1
        run: node scripts/staging/check-owner-canonical-real-d1-differential.mjs
