name: fullsite-performance
on:
  pull_request:
    paths: ["scripts/performance/**", ".github/workflows/fullsite-performance.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-fullsite-performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inventory and measure guest HTTP routes
        run: node scripts/performance/route-inventory.mjs
      - name: Measure current production public journeys
        run: node scripts/performance/fullsite-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullsite-performance
          path: artifacts/fullsite-performance
          retention-days: 14
