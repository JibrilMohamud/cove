name: fullsite-performance
on:
  push:
    branches: [main]
    paths:
      [
        "scripts/performance/**",
        ".github/workflows/fullsite-performance.yml",
        "src/features/fore/App.tsx",
        "src/features/fore/Audio.tsx",
        "src/features/fore/service-worker.ts",
        "src/features/fore/Book.tsx",
        "src/features/fore/search.server.ts",
        "src/features/fore/api.server.ts",
        "src/features/fore/catalog-model.server.ts",
        "src/features/fore/fore.css",
        "drizzle/*.sql",
      ]
  pull_request:
    paths: ["scripts/performance/**", ".github/workflows/fullsite-performance.yml"]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: cove-fullsite-performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this production deployment
        if: github.event_name == 'push'
        run: node scripts/wait-vercel-production.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Inventory and measure guest HTTP routes
        run: node scripts/performance/route-inventory.mjs
      - name: Measure current production public journeys
        run: node scripts/performance/fullsite-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullsite-performance
          path: artifacts/fullsite-performance
          retention-days: 14
