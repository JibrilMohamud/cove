name: cove-synthetic-failure-audit-stage-ab
on:
  push:
    branches:
      - perf/stage-synthetic-audit-r2-20261114
    paths:
      - scripts/staging/run-synthetic-audit-r2-ab.mjs
      - .github/workflows/cove-synthetic-failure-audit-stage-ab.yml
permissions:
  contents: read
concurrency:
  group: cove-isolated-causal-catalog-stage-driver
  cancel-in-progress: false
jobs:
  same-code-stage-comparison:
    if: github.repository == 'JibrilMohamud/cove'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      COVE_ALLOW_SAFE_RESTORE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 8ef42c04b01706545c2b36106c6fe90899ec322a
          path: stage-driver
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Require synthetic-only audit eligibility and exact SQL-site re-attestation
        run: |
          node scripts/check-synthetic-failure-audit-r2.mjs
          node scripts/reconcile-canonical-writers.mjs
          node scripts/rebase-canonical-writer-review.mjs --review-attestation=docs/architecture/2026-11-14-synthetic-r2-audit-source-attestation.json
      - name: Verify stage A/B orchestration syntax and formatting
        run: |
          node --check scripts/staging/run-synthetic-audit-r2-ab.mjs
          npx prettier --check scripts/staging/run-synthetic-audit-r2-ab.mjs
      - name: Build the exact candidate stage source bundle
        run: npm run build:backend
      - name: Verify Cloudflare stage deployment credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Same-code 50-RPS baseline versus synthetic-private-R2 audit experiment
        run: node scripts/staging/run-synthetic-audit-r2-ab.mjs
      - name: Mandatory independent driver rollback even after A/B failure
        if: always()
        working-directory: stage-driver
        run: node scripts/staging/run-private-causal-triad.mjs --restore-only
      - name: Mandatory independent candidate rollback even after A/B failure
        if: always()
        run: node scripts/staging/run-synthetic-audit-r2-ab.mjs --restore-only
      - name: Preserve sanitized A/B measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cove-synthetic-audit-r2-ab-${{ github.run_id }}
          path: artifacts/synthetic-audit-ab/
          if-no-files-found: ignore
          retention-days: 14
