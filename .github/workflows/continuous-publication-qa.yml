name: continuous-publication-qa
on:
  pull_request:
    paths:
      - "scripts/staging/deploy-continuous-publication-qa.mjs"
      - "scripts/staging/verify-pinned-publication-capture*.mjs"
      - "scripts/staging/verify-continuous-publication-qa.mjs"
      - "scripts/security/scoped-continuous-publication-qa.test.mjs"
      - ".github/workflows/continuous-publication-qa.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Approve the exact main SHA before Cloudflare API access."
        required: true
        type: string
      confirm_protected_cloudflare_action:
        description: "Explicitly approve this Cloudflare action; never auto-run on source merge."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cove-continuous-publication-qa
  cancel-in-progress: false
jobs:
  source-credential-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test scripts/security/scoped-continuous-publication-qa.test.mjs
      - run: node --check scripts/staging/deploy-continuous-publication-qa.mjs
      - run: node --test scripts/staging/verify-pinned-publication-capture.test.mjs
      - run: node --check scripts/staging/verify-continuous-publication-qa.mjs
  private-qa:
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_protected_cloudflare_action == true &&
      inputs.reviewed_main_sha == github.sha
    runs-on: ubuntu-latest
    environment: cove-production-release-audit
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.COVE_CF_STAGE_WORKERS_DEPLOY_TOKEN }}
      COVE_CF_STAGE_DATA_PLANE_READ_TOKEN: ${{ secrets.COVE_CF_STAGE_DATA_PLANE_READ_TOKEN }}
      COVE_CF_WORKERS_METADATA_READ_TOKEN: ${{ secrets.COVE_CF_WORKERS_METADATA_READ_TOKEN }}
      COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN: ${{ secrets.COVE_CF_ACCOUNT_TOKEN_INVENTORY_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Require distinct deploy, data-plane read and Worker-metadata credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$COVE_CF_STAGE_DATA_PLANE_READ_TOKEN"
          test -n "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
          test "$CLOUDFLARE_API_TOKEN" != "$COVE_CF_STAGE_DATA_PLANE_READ_TOKEN"
          test "$CLOUDFLARE_API_TOKEN" != "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
          test "$COVE_CF_STAGE_DATA_PLANE_READ_TOKEN" != "$COVE_CF_WORKERS_METADATA_READ_TOKEN"
      - name: Verify provider-enforced canonical reader before capture deployment
        run: node scripts/staging/verify-canonical-readonly-service.mjs --require-distinct-inventory
      - run: node scripts/build-storefront-strangler.mjs
      - name: Deploy nonpublic fenced QA publication cron Workers
        run: node scripts/staging/deploy-continuous-publication-qa.mjs
      - name: Observe 23 fresh markets in the independent R2 ledger and next cron capture
        run: node scripts/staging/verify-continuous-publication-qa.mjs
