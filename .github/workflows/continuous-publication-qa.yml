name: continuous-publication-qa
on:
  pull_request:
    paths:
      - "scripts/staging/deploy-continuous-publication-qa.mjs"
      - "scripts/staging/provision-publication-source-reader.mjs"
      - "src/storefront-strangler/publication-source-reader.ts"
      - "src/storefront-strangler/publication-source-protocol.ts"
      - "wrangler.publication-capture.prod-private.jsonc"
      - "scripts/staging/verify-continuous-publication-qa.mjs"
      - ".github/workflows/continuous-publication-qa.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/continuous-publication-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-continuous-publication-qa
  cancel-in-progress: false
jobs:
  private-qa:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node scripts/build-storefront-strangler.mjs
      - name: Provision the fixed advisory source on the disabled private owner
        run: node scripts/staging/provision-publication-source-reader.mjs
      - name: Deploy nonpublic fenced QA publication cron Workers
        run: node scripts/staging/deploy-continuous-publication-qa.mjs
      - name: Observe 23 fresh markets in the independent R2 ledger and next cron capture
        run: node scripts/staging/verify-continuous-publication-qa.mjs
