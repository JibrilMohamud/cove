name: continuous-publication-qa
on:
  pull_request:
    paths:
      - "scripts/staging/deploy-continuous-publication-qa.mjs"
      - ".github/workflows/continuous-publication-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-continuous-publication-qa
  cancel-in-progress: false
jobs:
  private-qa:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'arch/isolated-data-plane-20261022') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/arch/isolated-data-plane-20261022')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node scripts/build-storefront-strangler.mjs
      - name: Deploy nonpublic fenced QA publication cron Workers
        run: node scripts/staging/deploy-continuous-publication-qa.mjs
