name: browser-device-qa
on:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "public/**",
        "drizzle/**",
        "scripts/browser-qa/**",
        "scripts/browser-qa-server.mjs",
        "scripts/local-api.mjs",
        "playwright.config.mjs",
        "package*.json",
        ".github/workflows/browser-qa.yml",
      ]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            chromium-desktop,
            firefox-desktop,
            webkit-desktop,
            android-chrome,
            iphone-safari,
            ipad-safari,
          ]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Avoid huge cache restores that exceed Actions cache egress limits.
      - run: npm ci --no-audit --no-fund
      - name: Install only the browser needed by this matrix job
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          case "$PROJECT" in
            chromium-desktop|android-chrome) browser=chromium ;;
            firefox-desktop) browser=firefox ;;
            webkit-desktop|iphone-safari|ipad-safari) browser=webkit ;;
            *) echo "::error::Unknown browser matrix project"; exit 1 ;;
          esac
          npx playwright install --with-deps "$browser"
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Summarize browser failure snapshots
        if: failure()
        run: |
          find artifacts/browser-qa/runs -name error-context.md -print -exec sed -n '1,110p' {} \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-device-qa-${{ matrix.project }}
          path: artifacts/browser-qa
          retention-days: 14
