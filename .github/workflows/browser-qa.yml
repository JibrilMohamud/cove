name: browser-device-qa
on:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "public/**",
        "drizzle/**",
        "scripts/browser-qa/**",
        "scripts/browser-qa-server.mjs",
        "scripts/local-api.mjs",
        "playwright.config.mjs",
        "package*.json",
        ".github/workflows/browser-qa.yml",
      ]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        project:
          [
            chromium-desktop,
            firefox-desktop,
            webkit-desktop,
            android-chrome,
            iphone-safari,
            ipad-safari,
          ]
    runs-on: ubuntu-latest
    # Pinned official image contains browser binaries and OS libraries. Avoid
    # host apt downloads from the throttled Azure Ubuntu mirror (25m cancels).
    # This keeps all six original matrix check names and test assertions.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    # GitHub sets /github/home (owned by pwuser) while the image's default
    # user is root. Firefox refuses that owner mismatch at browser launch.
    env:
      HOME: /root
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Avoid huge cache restores that exceed Actions cache egress limits.
      - run: npm ci --no-audit --no-fund
      - name: Validate preinstalled pinned browser binaries
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          node --input-type=module - <<'NODE'
          import { chromium, firefox, webkit } from "@playwright/test";
          const name = process.env.PROJECT;
          const type = name === "firefox-desktop" ? firefox
            : ["webkit-desktop", "iphone-safari", "ipad-safari"].includes(name) ? webkit
            : ["chromium-desktop", "android-chrome"].includes(name) ? chromium : null;
          if (!type) throw Error("Unknown browser project " + name);
          const browser = await type.launch({ headless: true });
          console.log("PLAYWRIGHT_BROWSER_READY", name, browser.version());
          await browser.close();
          NODE
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Summarize browser failure snapshots
        if: failure()
        run: |
          find artifacts/browser-qa/runs -name error-context.md -print -exec sed -n '1,110p' {} \; || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-device-qa-${{ matrix.project }}
          path: artifacts/browser-qa
          retention-days: 14
