name: production-storefront-performance

on:
  pull_request:
    paths:
      - "scripts/check-production-storefront-performance*.mjs"
      - "scripts/wait-vercel-production*.mjs"
      - ".github/workflows/production-storefront-performance.yml"
      - "src/features/fore/storefront-loader.ts"
      - "src/features/fore/storefront-bootstrap-fetch.ts"
      - "src/features/fore/storefront-hedged-fetch.ts"
      - "src/features/fore/storefront-bootstrap-recovery.ts"
      - "vercel.json"
      - "src/features/fore/api.server.ts"
      - "src/features/fore/search.server.ts"
      - "src/features/fore/localization.server.ts"
      - "src/features/fore/public-api-cache.server.ts"
      - "src/routes/index.tsx"
      - "src/server.ts"
  push:
    branches: [main]
    paths:
      - "scripts/check-production-storefront-performance*.mjs"
      - "scripts/wait-vercel-production*.mjs"
      - ".github/workflows/production-storefront-performance.yml"
      - "src/features/fore/storefront-loader.ts"
      - "src/features/fore/storefront-bootstrap-fetch.ts"
      - "src/features/fore/storefront-hedged-fetch.ts"
      - "src/features/fore/storefront-bootstrap-recovery.ts"
      - "vercel.json"
      - "src/features/fore/api.server.ts"
      - "src/features/fore/search.server.ts"
      - "src/features/fore/localization.server.ts"
      - "src/features/fore/public-api-cache.server.ts"
      - "src/routes/index.tsx"
      - "src/server.ts"
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"

permissions:
  contents: read
  statuses: read

concurrency:
  group: cove-production-storefront-performance
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate probe calculations and SSR assertions
        run: node --test scripts/check-production-storefront-performance.test.mjs scripts/wait-vercel-production.test.mjs
      - name: Wait for pushed commit to reach Vercel production
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-vercel-production.mjs
      - name: Measure public production homepage
        if: github.event_name != 'pull_request'
        env:
          COVE_PUBLIC_URL: https://cove-puce-theta.vercel.app
        run: node scripts/check-production-storefront-performance.mjs
      - name: Preserve aggregate measurements
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: production-storefront-performance
          path: artifacts/production-storefront-performance.json
          retention-days: 14
          if-no-files-found: warn
