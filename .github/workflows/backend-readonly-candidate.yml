name: backend-readonly-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-exclusive-real-primary-cold-acceptance
  cancel-in-progress: false
jobs:
  private-candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-readonly-audit
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Enforce private no-D1 read-only candidate invariants
        run: node scripts/check-backend-readonly-candidate.mjs
      - name: Build production-equivalent persistence bundle
        run: npm run build:backend
      # A separate candidate-only FORE_BACKEND_TOKEN_SHA256 must be installed
      # through Cloudflare secrets before this action. Never copy production
      # backend credentials or pass them in dispatch inputs.
      - name: Deploy private, health-only candidate (no route or cron)
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.backend.readonly-candidate.toml
      - name: Independently verify ACTIVE version, permissions and ingress
        run: node scripts/staging/verify-backend-readonly-candidate.mjs
      - name: Record limited result
        if: success()
        run: echo "Private read-only backend candidate only. Production owner, payment parity, exclusive D1 and public rollback remain UNVERIFIED." >> "$GITHUB_STEP_SUMMARY"
