name: patch-security-dependencies-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-security-dependencies-once.yml"

permissions:
  contents: write

jobs:
  # Re-run after CodeQL regression alignment
  # Re-run after persistence trust-model regression alignment
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Apply non-breaking audit fixes
        # npm exits nonzero while known breaking fixes remain; the post-upgrade
        # audit below is the authoritative security gate.
        run: npm audit fix || true

      - name: Upgrade security-blocked runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact epubjs@0.3.93 drizzle-orm@0.45.4
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            "@xmldom/xmldom": "0.8.15"
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install

      - name: Verify no high or critical npm advisories remain
        run: npm audit --audit-level=high

      - name: Verify security regressions
        run: |
          npm run security:secret-scan
          npm run test:security-sync
          npm run test:persistence-backend
          python3 -m py_compile scripts/audio_pipeline/*.py

      - name: Verify app and persistence builds
        run: |
          npm run build
          npm run build:backend

      - name: Commit patched dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency graph already satisfies the security gate."
            exit 0
          fi
          git commit -m "Patch audited dependency vulnerabilities"
          git pull --rebase origin main
          git push origin HEAD:main
