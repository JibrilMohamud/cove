name: patch-security-dependencies-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-security-dependencies-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Upgrade security-blocked runtime dependencies
        run: npm install --save-exact epubjs@0.4.2 drizzle-orm@0.45.4

      - name: Verify no high or critical npm advisories remain
        run: npm audit --audit-level=high

      - name: Verify security and type safety
        run: |
          npm run security:secret-scan
          npm run typecheck
          npm run test:security-sync
          npm run test:persistence-backend
          python3 -m py_compile scripts/audio_pipeline/*.py

      - name: Verify app and persistence builds
        run: |
          npm run build
          npm run build:backend

      - name: Commit patched dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency graph already satisfies the security gate."
            exit 0
          fi
          git commit -m "Patch audited dependency vulnerabilities"
          git push origin HEAD:main
