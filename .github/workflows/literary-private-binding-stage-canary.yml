name: literary-private-binding-stage-canary
on:
  pull_request:
    paths:
      - ".github/workflows/literary-private-binding-stage-canary.yml"
      - "wrangler.literary-publisher.stage-canary.jsonc"
      - "wrangler.literary-private-binding.stage-canary.jsonc"
      - "src/literary-private-binding-stage-canary.worker.ts"
      - "scripts/staging/run-literary-service-binding-canary.mjs"
      - "scripts/staging/cleanup-literary-private-binding-canary.mjs"
      - "scripts/check-literary-private-binding-canary.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/literary-private-binding-stage-canary.yml"
      - "scripts/staging/run-literary-service-binding-canary.mjs"
      - "scripts/staging/cleanup-literary-private-binding-canary.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-literary-remote-staging-qa
  cancel-in-progress: false
jobs:
  static-private-qa-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: node --check scripts/staging/run-literary-service-binding-canary.mjs
      - run: node --check scripts/staging/cleanup-literary-private-binding-canary.mjs
      - run: node scripts/check-literary-private-binding-canary.mjs
  protected-real-service-binding:
    needs: static-private-qa-contract
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-literary-inference-publisher.mjs
      - run: mkdir -p lit-stage-dist && npx esbuild src/literary-private-binding-stage-canary.worker.ts --bundle --format=esm --platform=neutral --outfile=lit-stage-dist/worker.js
      - name: Deploy private synthetic publication Worker
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.literary-publisher.stage-canary.jsonc
      - name: Deploy no-route stage caller (no cron yet)
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.literary-private-binding.stage-canary.jsonc
      - name: Generate scoped stage secrets, invoke through real binding and remove cron
        run: node scripts/staging/run-literary-service-binding-canary.mjs
      - name: Enforce QA cron removal even after an interrupted test
        if: always()
        run: node scripts/staging/cleanup-literary-private-binding-canary.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: literary-deployed-private-binding-${{ github.sha }}
          path: artifacts/literary-cutover/deployed-private-binding.json
          if-no-files-found: warn
          retention-days: 30
