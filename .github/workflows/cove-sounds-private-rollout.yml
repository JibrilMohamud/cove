name: cove-sounds-private-rollout
on:
  workflow_run:
    workflows: [deploy-persistence-backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Exactly one production backend mutation at a time, including the existing
# persistence deploy. No DNS/fast customer gateway changes are permitted.
concurrency:
  group: cove-persistence-production
  cancel-in-progress: false
jobs:
  private-sounds-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require private publication and rights authorization unit proofs
        run: |
          node scripts/check-cove-sounds-discovery.mjs
          node scripts/check-cove-sounds-snapshot.mjs
      - name: Build isolated private publisher
        run: node scripts/build-storefront-strangler.mjs
      - name: Require Cloudflare production publication permission
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Seed private R2 and KV from read-only canonical publication metadata
        id: seed
        run: node scripts/staging/seed-cove-sounds-private.mjs
      - name: Dry-run private cron Worker
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.sounds-publication.prod-isolated.jsonc
      - name: Activate hourly publisher with no public endpoint
        id: publisher
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.sounds-publication.prod-isolated.jsonc
      - name: Verify all six private publications and current backend R2/KV/analytics bindings
        id: verify
        run: node scripts/staging/verify-cove-sounds-activation.mjs
      - name: Activate US-only isolated snapshot reads with secrets preserved
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          printf '1' | npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put COVE_SOUNDS_SNAPSHOT_ENABLED --name cove-persistence-backend
      - name: Verify server-feature activation did not enable customer routing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging/verify-cove-sounds-activation.mjs
          node scripts/check-storefront-strangler.mjs
      - name: Re-disable Cove Sounds if publication or activation failed
        if: (failure() || cancelled()) && steps.seed.outcome == 'success'
        shell: bash
        run: |
          set +e
          printf '0' | npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put COVE_SOUNDS_SNAPSHOT_ENABLED --name cove-persistence-backend
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.sounds-publication.prod-disabled.jsonc
      - name: Record private release evidence
        if: success()
        run: |
          {
            echo '## Cove Sounds US private publication enabled'
            echo '- Durable isolated R2 and KV snapshots were byte-verified.'
            echo '- Canonical music playback and retail-book rights are still rechecked live.'
            echo '- Anonymous funnel events use Analytics Engine, not primary D1 click logging.'
            echo '- The customer homepage gateway and DNS were not changed.'
          } >> "$GITHUB_STEP_SUMMARY"
