name: cove-sounds-private-rollout
on:
  pull_request:
    paths:
      - "src/storefront-strangler/sounds-publication.worker.ts"
      - "src/lib/canonical-readonly-d1.server.ts"
      - "wrangler.sounds-publication.prod-isolated.jsonc"
      - "wrangler.sounds-publication.prod-disabled.jsonc"
      - "scripts/staging/verify-canonical-readonly-service.mjs"
      - "scripts/check-sounds-readonly-principal.mjs"
      - "scripts/check-cove-sounds-snapshot.mjs"
      - "scripts/test-production-writer-topology.mjs"
      - ".github/workflows/cove-sounds-private-rollout.yml"
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact approved main HEAD for protected Sounds publication."
        required: true
        type: string
      confirm_private_sounds:
        description: "Approve production-bound private Sounds activation; no automatic merges."
        required: true
        type: boolean
        default: false
permissions:
  contents: read
# Exactly one production backend mutation at a time, including the existing
# persistence deploy. No DNS/fast customer gateway changes are permitted.
concurrency:
  group: cove-persistence-production
  cancel-in-progress: false
jobs:
  source-sounds-readonly:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refuse native production D1 and verify unchanged publication semantics
        run: |
          node scripts/check-sounds-readonly-principal.mjs
          node scripts/check-cove-sounds-snapshot.mjs
          node scripts/test-production-writer-topology.mjs
      - name: Prove active and disabled private publisher build without native D1
        run: |
          node scripts/build-storefront-strangler.mjs
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.sounds-publication.prod-isolated.jsonc
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.sounds-publication.prod-disabled.jsonc
  private-sounds-release:
    # Private source reads and snapshot publication share primary D1 capacity
    # with release migrations and isolated SSR acceptance. Avoid CI-induced
    # overload without reducing any strict storefront throughput criteria.
    concurrency:
      group: cove-exclusive-real-primary-cold-acceptance
      queue: max
      cancel-in-progress: false
    if: >-
      github.repository == 'JibrilMohamud/cove' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_private_sounds == true &&
      inputs.reviewed_main_sha == github.sha
    environment: cove-production-release-audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: d26430caa63ec55f6612e32f36aca5e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify exact approved main SHA before Sounds production secret or publishing
        env:
          EXPECTED_SHA: ${{ inputs.reviewed_main_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$DISPATCH_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require private publication and rights authorization unit proofs
        run: |
          node --test scripts/staging/cf-api-429-retry.test.mjs
          node scripts/check-cove-sounds-discovery.mjs
          node scripts/check-cove-sounds-snapshot.mjs
          node scripts/check-sounds-readonly-principal.mjs
          node scripts/test-production-writer-topology.mjs
      - name: Require exact active provider-enforced D1 Read service before any publication
        run: node scripts/staging/verify-canonical-readonly-service.mjs
      - name: Build isolated private publisher
        run: node scripts/build-storefront-strangler.mjs
      - name: Require Cloudflare production publication permission
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Seed private R2 and KV from read-only canonical publication metadata
        id: seed
        run: node scripts/staging/seed-cove-sounds-private.mjs
      - name: Dry-run private cron Worker
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --dry-run --config wrangler.sounds-publication.prod-isolated.jsonc
      - name: Activate hourly publisher with no public endpoint
        id: publisher
        run: npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.sounds-publication.prod-isolated.jsonc
      - name: Prove active Sounds version has zero native D1 and a private D1 Read service
        run: node scripts/staging/verify-canonical-readonly-service.mjs --sounds
      - name: Verify all six private publications and current backend R2/KV/analytics bindings
        id: verify
        run: node scripts/staging/verify-cove-sounds-activation.mjs
      - name: Activate US-only isolated snapshot reads with secrets preserved
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          printf '1' | npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put COVE_SOUNDS_SNAPSHOT_ENABLED --name cove-persistence-backend
      - name: Verify server-feature activation did not enable customer routing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/staging/verify-cove-sounds-activation.mjs
          node scripts/check-storefront-strangler.mjs
      - name: Re-disable Cove Sounds if publication or activation failed
        if: (failure() || cancelled()) && steps.seed.outcome == 'success'
        shell: bash
        run: |
          set +e
          printf '0' | npm exec --yes --package=wrangler@4.151.0 -- wrangler secret put COVE_SOUNDS_SNAPSHOT_ENABLED --name cove-persistence-backend
          npm exec --yes --package=wrangler@4.151.0 -- wrangler deploy --config wrangler.sounds-publication.prod-disabled.jsonc
          # Fail-closed rollback cannot regrant the canonical D1 connection.
          node scripts/check-sounds-readonly-principal.mjs
      - name: Record private release evidence
        if: success()
        run: |
          {
            echo '## Cove Sounds US private publication enabled'
            echo '- Durable isolated R2 and KV snapshots were byte-verified.'
            echo '- The hourly publisher has no native production D1; the private Worker uses provider-enforced primary D1 Read RPC.'
            echo '- Canonical music playback and retail-book rights are still rechecked live.'
            echo '- Anonymous funnel events use Analytics Engine, not primary D1 click logging.'
            echo '- The customer homepage gateway and DNS were not changed.'
          } >> "$GITHUB_STEP_SUMMARY"
