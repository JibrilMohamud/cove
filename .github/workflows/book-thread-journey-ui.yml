name: book-thread-journey-ui
on:
  pull_request:
    paths:
      - "src/features/fore/Community.tsx"
      - "src/routes/community.tsx"
      - "src/features/fore/CommunityProfileRoute.tsx"
      - "src/features/fore/ReaderProfileOverview.tsx"
      - "src/features/fore/ReaderProfileSections.tsx"
      - "src/features/fore/ReaderProfileRail.tsx"
      - "src/features/fore/ReaderProfileBits.tsx"
      - "src/features/fore/reader-profile.css"
      - "src/features/fore/reader-profile-cards.css"
      - "src/features/fore/reader-profile-shelves.css"
      - "scripts/check-reader-profile-redesign.mjs"
      - "src/features/fore/CommunityArena.tsx"
      - "src/features/fore/OfficialTournament.tsx"
      - "src/features/fore/community-tournaments.server.ts"
      - "src/features/fore/official-tournament.css"
      - "drizzle/0091_community_tournament_rounds.sql"
      - "scripts/check-community-tournaments.mjs"
      - "scripts/browser-qa/localization-a11y.spec.mjs"
      - "src/features/fore/community-arena.ts"
      - "src/features/fore/review-tags.ts"
      - "src/features/fore/Reviews.tsx"
      - "src/features/fore/community.server.ts"
      - "scripts/check-community-arena.mjs"
      - "src/features/fore/Book.tsx"
      - "src/features/fore/Work.tsx"
      - "src/features/fore/BookDiscussionDeferred.tsx"
      - "src/features/fore/social.server.ts"
      - "src/features/fore/reading-community.css"
      - "drizzle/0061_social_book_thread_keyset.sql"
      - "scripts/check-book-thread-journey-ui.mjs"
      - ".github/workflows/book-thread-journey-ui.yml"
permissions:
  contents: read
jobs:
  bounded-thread-and-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-book-thread-journey-ui.mjs
      - run: node scripts/check-reader-profile-redesign.mjs
      - run: npm run test:social-reading
      - run: npm run test:community-arena
      - run: node scripts/check-community-tournaments.mjs
      - run: npm run typecheck
